<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Qandy — Instructions</title>
<style>
  :root{
    --outer-border:#333;   /* 16px inner border color requested */
    --bg:#000;             /* inner background */
    --fg:#ddd;
    --mono: "Courier New", Courier, monospace; /* match Qandy display */
  }

  /* Outer container provides the 16px dark border and padding */
  body {
    margin:0;
    background:var(--outer-border);
    padding:16px; /* keep some spacing to the page */
    box-sizing:border-box;
    color:var(--fg);
    font-family:var(--mono);
  }

  .viewer {
    background: var(--bg);
    padding: 12px;
    box-sizing: border-box;
    border-radius: 4px;
    height: calc(100vh - 32px);
    overflow: auto;
    -webkit-font-smoothing: antialiased;
  }

  /* Use a pre to preserve whitespace and monospace rendering */
  pre.ansi {
    margin:0;
    white-space: pre;       /* preserve exact spacing/newlines like the Qandy */
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1.18;
    color: var(--fg);
  }

  /* Small status area */
  .status {
    color:#9f9fa9;
    font-size:13px;
    padding:8px 0 8px 0;
  }

  /* Make links inside output visible */
  .ansi a { color:#66aaff; text-decoration:underline; }
</style>
</head>
<body>
  <div class="status" id="status">Loading qandy.txt …</div>
  <div class="viewer" id="viewer" role="region" aria-label="Qandy instructions viewer">
    <pre class="ansi" id="output" aria-live="polite"></pre>
  </div>

<script>
/*
  Small ANSI -> HTML renderer.
  - Fetches "qandy.txt" via fetch() (same-origin).
  - Converts common ANSI SGR (m) codes to inline styles (colors, bold, underline, inverse, reset).
  - Renders into a <pre> so spacing matches Qandy.
  - Lightweight: supports standard 8 colors, bright variants, and background colors.
*/

// Simple HTML-escape but preserve spaces/newlines (we only escape & < >)
function escapeText(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ANSI SGR color maps (standard + bright)
const ANSI_COLORS = {
  30: '#000000', // black
  31: '#aa0000', // red
  32: '#00aa00', // green
  33: '#aa5500', // yellow / brownish
  34: '#0000aa', // blue
  35: '#aa00aa', // magenta
  36: '#00aaaa', // cyan
  37: '#aaaaaa', // white / light grey

  // bright (90-97)
  90: '#555555', // bright black / dark grey
  91: '#ff5555', // bright red
  92: '#55ff55', // bright green
  93: '#ffff55', // bright yellow
  94: '#5555ff', // bright blue
  95: '#ff55ff', // bright magenta
  96: '#55ffff', // bright cyan
  97: '#ffffff'  // bright white
};

// Background colors: 40-47 -> map to same palette, 100-107 bright backgrounds
function ansiColorFor(code){
  if(code in ANSI_COLORS) return ANSI_COLORS[code];
  // map 40-47 backgrounds to 30-37 equivalents
  if(code >= 40 && code <= 47){
    return ANSI_COLORS[code - 10] || null;
  }
  if(code >= 100 && code <= 107){
    return ANSI_COLORS[code - 10] || null;
  }
  return null;
}

// Regex to find CSI SGR sequences like \x1b[0;32m
const ANSI_REGEX = /\x1b\[([0-9;]*?)m/g;

// Convert ANSI text to HTML with <span style="..."> wrappers
function ansiToHtml(text){
  let out = '';
  let last = 0;
  let match;

  // current state
  let state = {
    fg: null,
    bg: null,
    bold: false,
    underline: false,
    inverse: false
  };

  function styleForState(s){
    let styles = [];
    if(s.inverse){
      // swap fg/bg when inverse is active
      if(s.bg) styles.push('color:' + s.bg);
      if(s.fg) styles.push('background:' + s.fg);
      // if swapped and one is missing, ensure legibility
      if(!s.bg && s.fg) styles.push('background:#000');
      if(!s.fg && s.bg) styles.push('color:#fff');
    } else {
      if(s.fg) styles.push('color:' + s.fg);
      if(s.bg) styles.push('background:' + s.bg);
    }
    if(s.bold) styles.push('font-weight:700');
    if(s.underline) styles.push('text-decoration: underline');
    return styles.join('; ');
  }

  function openSpan(s, txt){
    // Avoid empty span if no styles
    const style = styleForState(s);
    if(!style) return escapeText(txt);
    return `<span style="${style}">${escapeText(txt)}</span>`;
  }

  while((match = ANSI_REGEX.exec(text)) !== null){
    const idx = match.index;
    const chunk = text.slice(last, idx);
    if(chunk) out += openSpan(state, chunk);

    // apply codes
    const codes = match[1].length ? match[1].split(';').map(c=>c===''?0:parseInt(c,10)) : [0];
    if(codes.length === 0) codes = [0];

    for(let code of codes){
      if(code === 0){
        // reset
        state.fg = null; state.bg = null; state.bold = false; state.underline = false; state.inverse = false;
      } else if(code === 1){
        state.bold = true;
      } else if(code === 22){
        state.bold = false;
      } else if(code === 4){
        state.underline = true;
      } else if(code === 24){
        state.underline = false;
      } else if(code === 7){
        state.inverse = true;
      } else if(code === 27){
        state.inverse = false;
      } else if((code >= 30 && code <= 37) || (code >= 90 && code <= 97)){
        // foreground
        const c = ansiColorFor(code);
        state.fg = c;
      } else if((code >= 40 && code <= 47) || (code >= 100 && code <= 107)){
        // background
        const c = ansiColorFor(code);
        state.bg = c;
      } else if(code === 39){
        // default foreground
        state.fg = null;
      } else if(code === 49){
        // default background
        state.bg = null;
      } else {
        // unsupported code: ignore (future: 38;5;<n> / 48;5;<n> handling)
      }
    }

    last = ANSI_REGEX.lastIndex;
  }

  // trailing chunk
  if(last < text.length){
    out += openSpan(state, text.slice(last));
  }

  // preserve final trailing newline(s) — they remain as \n inside <pre>
  return out;
}

async function loadAndShow(path){
  const status = document.getElementById('status');
  const output = document.getElementById('output');

  status.textContent = 'Loading ' + path + ' ...';
  try {
    const res = await fetch(path, { cache: 'no-cache' });
    if(!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
    const txt = await res.text();
    // Convert CRLF to LF to normalize
    const normalized = txt.replace(/\r\n/g,'\n').replace(/\r/g,'\n');

    // Convert ANSI sequences to HTML and render inside the pre
    const html = ansiToHtml(normalized);
    output.innerHTML = html;

    status.textContent = path + ' loaded';
  } catch (err) {
    status.textContent = 'Error loading ' + path + ': ' + err.message;
    output.textContent = '';
    console.error(err);
  }
}

// Auto-load qandy.txt on start
document.addEventListener('DOMContentLoaded', function(){
  // change filename here if you want a different default
  loadAndShow('qandy.txt');
});
</script>
</body>
</html>
