<!DOCTYPE html>
<html>
<head>
    <title>Map Walker - Tile Editor</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #eee; padding: 20px; }
        .controls { background: #333; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
        canvas { display: block; margin: 20px auto; border: 1px solid #444; }
        #editorContainer { display: flex; flex-direction: column; align-items: center; }
        input, select, button { margin: 5px; padding: 5px; }
        #editorModal { 
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: #333; color: #eee;
            padding: 20px; border: 2px solid #666; z-index: 1000; border-radius: 8px;
        }
        .close-btn { float: right; cursor: pointer; color: red; font-weight: bold; font-size: 14px; }
        .modal-title { font-size: 18px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="controls">
        Wide: <input type="number" id="mapWide" value="5"> 
        High: <input type="number" id="mapHigh" value="3"> 
        Brush: <select id="brushSelect">
            <option value="Ga">Grass</option>
            <option value="Ca">Dirt</option>
            <option value="Ua">Water</option>
            <option value="Ta">Swamp</option>
        </select>
        <button onclick="generateMap()">Generate World</button>
        <button onclick="copyMapData()" style="background:#2196F3; color:white;">Copy All to Clipboard</button>
    </div>

    <div id="editorContainer">
        <canvas id="mapCanvas" width="800" height="600"></canvas>
    </div>

    <!-- Tile Editor Modal -->
    <div id="editorModal">
        <span class="close-btn" onclick="closeEditor()">[X] Close</span>
        <div class="modal-title" id="editorTitle">Edit Tile: --</div>
        <label for="tileCodeInput">Tile Code:</label>
        <input type="text" id="tileCodeInput" maxlength="2" pattern="[A-Z][a-z0-9]">
        <button onclick="saveTile()">Save</button>
    </div>

    <script>
        const tileMapSize = 96; // Total sub-tiles per map
        let worldWidth, worldHeight, worldData = {}, canvasContext;

        // --- Generate Map ---
        function generateMap() {
            worldWidth = parseInt(document.getElementById('mapWide').value);
            worldHeight = parseInt(document.getElementById('mapHigh').value);
            const brush = document.getElementById('brushSelect').value;

            worldData = {}; // Reset map data
            const context = document.getElementById('mapCanvas').getContext('2d');
            canvasContext = context;

            // Dynamically set canvas size based on dimensions
            const canvas = document.getElementById('mapCanvas');
            canvas.width = worldWidth * 64; // 64 for 4x4 tiles scaled up
            canvas.height = worldHeight * 64; // Each tile is 64px x 64px (scaled)

            for (let h = 0; h < worldHeight; h++) {
                for (let w = 0; w < worldWidth; w++) {
                    const id = String.fromCharCode(65 + h) + (w < 26 ? String.fromCharCode(97 + w) : (w - 26));
                    const randomBase = generate192CharString(brush);
                    worldData[id] = randomBase;
                    drawTile(w, h, brush);
                }
            }
        }

        // Draw individual tile on the canvas
        function drawTile(x, y, tileCode) {
            const context = canvasContext;
            const img = new Image();
            img.src = `m/${tileCode}.png`; // Use 4x4 tileset from m/ directory
            img.onload = () => {
                context.drawImage(img, x * 64, y * 64, 64, 64); // Scale tiles to 64x64
            };
        }

        // --- Generate Random Noise ---
        function generate192CharString(baseTerrain) {
            let str = "";
            for (let i = 0; i < tileMapSize; i++) {
                str += getRandomNoise(baseTerrain);
            }
            return str;
        }
        function getRandomNoise(base) {
            if (base === 'Ga' && Math.random() > 0.8) return Math.random() > 0.5 ? 'Fa' : 'Gb';
            if (base === 'Ca' && Math.random() > 0.9) return 'Rh';
            return base;
        }

        // --- Tile Editor Modal ---
        let selectedTileId;
        document.getElementById('mapCanvas').addEventListener('click', function (event) {
            const rect = this.getBoundingClientRect();
            const x = Math.floor((event.clientX - rect.left) / 64);
            const y = Math.floor((event.clientY - rect.top) / 64);

            selectedTileId = String.fromCharCode(65 + y) + (x < 26 ? String.fromCharCode(97 + x) : (x - 26));
            if (worldData[selectedTileId]) {
                openEditor(selectedTileId);
            }
        });

        function openEditor(id) {
            document.getElementById('editorTitle').innerText = `Edit Tile: ${id}`;
            document.getElementById('tileCodeInput').value = worldData[id].substring(0, 2);
            document.getElementById('editorModal').style.display = 'block';
        }

        function closeEditor() {
            document.getElementById('editorModal').style.display = 'none';
        }

        function saveTile() {
            const tileCode = document.getElementById('tileCodeInput').value;
            if (!/^[A-Z][a-z0-9]$/.test(tileCode)) {
                alert("Invalid tile code! Use A-Za-z0-9 format.");
                return;
            }

            worldData[selectedTileId] = tileCode + worldData[selectedTileId].substring(2); // Replace first 2 chars
            drawTile(
                selectedTileId.charCodeAt(1) - 97, // Convert column ID to index
                selectedTileId.charCodeAt(0) - 65, // Convert row ID to index
                tileCode
            );
            closeEditor();
        }

        // --- Clipboard Copy ---
        async function copyMapData() {
            const finalString = Object.values(worldData).join('');
            await navigator.clipboard.writeText(finalString);
            alert(`Copied ${finalString.length} characters to clipboard!`);
        }

        generateMap(); // Generate default map
    </script>
</body>
</html>
