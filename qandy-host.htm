:root {

  --cell-w: 13px;
  --cell-h: 15px;
  --cell-fs: 13px;
}

#screen {
  display: grid;
  grid-template-columns: repeat(var(--cols), var(--cell-w));
  grid-auto-rows: var(--cell-h);
  font-family: monospace, monospace;
  font-size: var(--cell-fs);
  line-height: var(--cell-h);
  -webkit-font-smoothing: antialiased;
}

/* Each cell is a grid item; set background per cell without seams */
.cell {
  width: var(--cell-w);
  height: var(--cell-h);

  margin: 0;
  padding: 0;
  border: 0;
  display: flex;
  align-items: center;

}

/* Make rows own the background and ensure cells are exact-size and transparent when desired */
.qandy-row {
  display: flex;
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  height: var(--cell-h);
  line-height: var(--cell-h);
  align-items: center;
  gap: 0;
  background-color: transparent; /* default: transparent, mode can override */
}

/* Ensure cells are exact-pixel sized and don't introduce borders/gaps */

//
// ──── Guest Message Handler ────────────────────────────────────────────────────────
//

if (GUEST) {
  // these functions transmit packets to and from the host
  window.__qandy_reqCounter = 0;
  window._pending = {};
  function qdosXmitDos(action, packet, timeoutMs) {
    return new Promise(function (resolve, reject) {
      if (!window.parent || window.parent === window) { return reject(new Error('Error: no <host>')); }
      // compact id: timestamp + small counter (no separate helper function)
      window.__qandy_reqCounter += 1;
      var id = 'qdos_' + Date.now() + '_' + window.__qandy_reqCounter;
      var msg = { type: 'guest-action', action: action, id: id };
      if (packet) {
        var keys = Object.keys(packet);
        for (var i = 0; i < keys.length; i++) msg[keys[i]] = packet[keys[i]];
      }
      var timer = setTimeout(function () {
        delete _pending[id];
        reject(new Error('Error: timeout ' + action));
      }, timeoutMs || 5000);
      _pending[id] = { resolve: resolve, reject: reject, timer: timer };
      try {
        window.parent.postMessage(msg, '*');
      } catch (e) {
        clearTimeout(timer);
        delete _pending[id];
        return e;
      }
    });
  }

  // normalize host results into a primitive/string for qdosDir printing
  function _normalizeResult(res) {
    if (Array.isArray(res)) return res.join('\n');
    if (res === null || res === undefined) return '';
    if (typeof res === 'object') {
      try { return JSON.stringify(res); } catch (e) { return String(res); }
    }
    return String(res);
  }

  // qdosAckDOS wrapper (small convenience). If you already define qdosAckDOS elsewhere, this will not override it.
  window.qdosAckDOS = window.qdosAckDOS || function (type, handler, opts) {
    type = String(type || 'message');
    function wrapper(ev) {
      if (ev.source !== window.parent) return; // only accept messages from parent
      try { handler(ev); } catch (e) { console.error('qdosAckDOS handler error:', e && e.message ? e.message : e); }
    }
    window.addEventListener(type, wrapper, opts || false);
    return function remove() { window.removeEventListener(type, wrapper, opts || false); };
  };

  // attach the ack handler using qdosAckDOS
  qdosAckDOS('message', function (ev) {
    var d = ev.data;
    if (!d || typeof d !== 'object') return;
    // accept legacy and new reply names
    if (d.type !== 'action-result' && d.type !== 'ack') return;
    var id = d.id;
    if (!id || !_pending[id]) return;
    var entry = _pending[id];
    try { clearTimeout(entry.timer); } catch (e) {}
    delete _pending[id];
    var ok = (d.ok !== undefined) ? Boolean(d.ok) : (d.success !== undefined ? Boolean(d.success) : true);
    if (!ok) {
      entry.reject(new Error(d.error || 'DOS operation failed'));
      return;
    }
    var res = d.result !== undefined ? d.result : true;
    res = _normalizeResult(res);
    entry.resolve(res);
  }, false);
 
  // evalCode: always-evaluates user input inside an async IIFE so top-level await is valid.
  // Programs / REPL must use `await` for blocking calls (e.g., await print(...); await input(...);).
  window.qdosAckDOS = qdosAckDOS;
  window._normalizeResult = _normalizeResult;
  window.qdosXmitDos = qdosXmitDos; 
}

window.evalCode = async function(code) {
  //if (HOST) { print("Input \'user\' to execute code"); }
  var src = String(code || '');
  if (!src.trim()) return true;
  // Wrap the user input in an async IIFE so top-level await is valid everywhere.
  var wrapped = "(async function __qandy_repl_wrapper() {\n" + src + "\n})();";
  try {
    // Use indirect eval to run in global scope
    var promise = (0, eval)(wrapped);
    // Await the async IIFE result; print returned value if any
    var result = await promise;
    if (typeof result !== 'undefined') {
      try { await print(String(result) + "\n\n"); } catch (e) { /* best-effort */ }
    }
    return true;
  } catch (err) {
    try { await print("Error: " + ((err && err.message) ? err.message : String(err)) + "\n\n"); } catch (e) {}
    return false;
  }
};

    stack.style.justifyContent = 'center';
    stack.appendChild(label);
    stack.appendChild(helper);

    overlay.appendChild(stack);
    document.body.appendChild(overlay);

    var reposition = function () {
      var r = target.getBoundingClientRect();
      overlay.style.left = r.left + 'px';
      overlay.style.top = r.top + 'px';
      overlay.style.width = r.width + 'px';
      overlay.style.height = r.height + 'px';
    };
    window.addEventListener('resize', reposition);

    var ro;
    if (typeof MutationObserver !== 'undefined') {
      ro = new MutationObserver(reposition);
      try { ro.observe(target, { attributes: true, childList: true, subtree: true }); } catch (e) {}
    }

    function engageHandler(e) {
      cleanupListeners();
      // Immediate tiny beep (inside user gesture)
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.value = 0.04;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
        setTimeout(function () { try { if (ctx.close) ctx.close(); } catch (e) {} }, 200);
      } catch (err) {
        console.warn('qandy: beep failed', err);
      }

      // IMPORTANT: call sound_js() (embedded) synchronously so the embedded sound module
      // initializes within the user gesture and can create/resume an AudioContext.
      try {
        if (typeof sound_js === 'function') {
          try {
            sound_js(); // initialize embedded sound module
          } catch (innerErr) {
            console.warn('qandy: sound_js() threw', innerErr);
          }
          // If the embedded sound module exposed an audioContext, attempt to resume it if suspended.
          try {
            if (window.audioContext && typeof window.audioContext.resume === 'function' && window.audioContext.state === 'suspended') {
              window.audioContext.resume().catch(function(){});
            }
          } catch (e) { /* ignore */ }
        } else {
          // Fallback: if sound_js not present, try to resume any existing global audio context.
          if (window.audioContext && typeof window.audioContext.resume === 'function') {
            window.audioContext.resume().catch(function(){});
          } else {
            console.warn('qandy: sound_js() not found; sound may be unavailable.');
          }
        }
      } catch (e) {
        console.warn('qandy: error while initializing sound', e);
      }

      // Remove overlay and observers, continue startup
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      if (ro) try { ro.disconnect(); } catch (e) {}
      try { window.removeEventListener('resize', reposition); } catch (e) {}
      loadNext();
    }

    function cleanupListeners() {
      overlay.removeEventListener('pointerdown', engageHandler, true);
      overlay.removeEventListener('touchstart', engageHandler, true);
      overlay.removeEventListener('click', engageHandler, true);
      document.removeEventListener('keydown', engageHandler, true);
      overlay.removeEventListener('keydown', onOverlayKeyDown, true);
    }

    function onOverlayKeyDown(e) {
      engageHandler(e);
    }

    overlay.addEventListener('pointerdown', engageHandler, { capture: true, passive: true, once: true });
    overlay.addEventListener('touchstart', engageHandler, { capture: true, passive: true, once: true });
    overlay.addEventListener('click', engageHandler, { capture: true, passive: true, once: true });
    document.addEventListener('keydown', engageHandler, { capture: true, once: true });
    overlay.addEventListener('keydown', onOverlayKeyDown, { capture: true, once: true });

    try { overlay.focus(); } catch (e) {}

    return {
      overlayElement: overlay,
      remove: function () {
        cleanupListeners();
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        if (ro) try { ro.disconnect(); } catch (e) {}
        try { window.removeEventListener('resize', reposition); } catch (e) {}
      }
    };
  }

                if (!_impObj || typeof _impObj !== 'object' || !_impObj.files) throw new Error('dos-format: invalid archive');
                // clear existing files
                var _clrRaw = localStorage.getItem(_LS_MAN);
                var _clrList = _clrRaw ? JSON.parse(_clrRaw) : [];
                if (Array.isArray(_clrList)) {
                  for (var _ci = 0; _ci < _clrList.length; _ci++) localStorage.removeItem(_LS_PFX + _clrList[_ci]);
                }
                // write new files
                var _newList = [];
                var _impKeys = Object.keys(_impObj.files);
                for (var _ii = 0; _ii < _impKeys.length; _ii++) {
                  var _iname = _impKeys[_ii];
                  var _ival = _impObj.files[_iname];
                  localStorage.setItem(_LS_PFX + _iname, _ival == null ? '' : String(_ival));
                  _newList.push(_iname);
                }
                localStorage.setItem(_LS_MAN, JSON.stringify(_newList));
                if (_dosIframe && _dosIframe.contentWindow) {
                  _dosIframe.contentWindow.postMessage({ type: 'action-result', action: 'dos-format', id: d.id, success: true, result: true }, '*');
                }
              }
            } catch (_e) {
              if (_dosIframe && _dosIframe.contentWindow) {
                _dosIframe.contentWindow.postMessage({ type: 'action-result', action: 'dos-format', id: d.id, success: false, error: String(_e) }, '*');
              }
            }
            break;
          }
        }
      } catch (e) {
        console.info('Error handling guest action:', e);
        var _errIframe = window._vmIframe || document.getElementById('vm-iframe');
        if (_errIframe && _errIframe.contentWindow) {
          _errIframe.contentWindow.postMessage({ 
            type: 'action-result', 
            action: d.action, 
            success: false, 
            error: String(e) 
          }, '*');
        }
      }
    
  }

  function validateGuestFilename(name) {
    if (typeof name !== 'string' && typeof name !== 'number') return null;
    var s = String(name).trim();
    if (!s) return null;
    // Reject path separators and traversal
    if (/[\/\\]/.test(s)) return null;
    if (/\.\./.test(s)) return null;
    // Allow letters, numbers, spaces, dot, dash, underscore (adjust to taste)
    // Limit length to reasonable size to avoid DOS attacks
    if (s.length > 128) return null;
    if (!/^[A-Za-z0-9 _.\-!]+$/.test(s)) return null;
    return s;
  }

  function validateGuestPattern(pattern) {
    if (typeof pattern !== 'string') return '';
    var s = String(pattern).trim();
    if (!s) return '';
    // Reject path separators and traversal
    if (/[\/\\]/.test(s)) return '';
    if (/\.\./.test(s)) return '';
    // Like validateGuestFilename but also allow wildcards * and ?
    if (s.length > 128) return '';
    if (!/^[A-Za-z0-9 _.\-!*?]+$/.test(s)) return '';
    return s;
  }

  function validateGuestSwitches(sw) {
    if (typeof sw !== 'string') return '';
    var s = String(sw).trim();
    if (!s) return '';
    // Only allow dash and lowercase letters (e.g. "-th", "-t", "th")
    if (!/^-?[a-zA-Z]+$/.test(s)) return '';
    if (s.length > 16) return '';
    return s;
  }

  function dosXmitQdos(iframe, id, action, ok, resultOrError) {
    if (!iframe || !iframe.contentWindow) return;
    var msg = { type: 'action-result', action: action, id: id, success: Boolean(ok) };
    if (ok) {
      var r = resultOrError;
      if (Array.isArray(r)) r = r.join('\n');
      else if (r === null || typeof r === 'undefined') r = '';
      else if (typeof r === 'object') {
        try { r = JSON.stringify(r); } catch (e) { r = String(r); }
      } else r = String(r);
      msg.result = r;
    } else {
      msg.error = String(resultOrError || 'error');
    }
    try { iframe.contentWindow.postMessage(msg, '*'); } catch (e) {
      console.warn('dosXmitQdos: postMessage failed', e);
    }
  }
}  

async function createGuest(options) {
  if (HOST==true) {
    var html = await qandyGuestHtm(options).catch(function (e) { console.info('Error: qandyGuestHtm ', e); return ''; });
    if (!html) throw new Error('Error: qandyGuestHtm null');
    var vmContainer = document.createElement('div');
    vmContainer.id = 'vm-container';
    vmContainer.style.position = 'absolute';
    vmContainer.style.left = '0px';
    vmContainer.style.top = '0px';
    vmContainer.style.width = '350px';
    vmContainer.style.height = '650px';
    vmContainer.style.zIndex = String(options.zIndex || 100);
    vmContainer.style.background = 'transparent';
    vmContainer.style.border = '0px';
    vmContainer.style.borderRadius = '0px';
    vmContainer.style.overflow = 'hidden';
    var iframe = document.createElement('iframe');
    iframe.id = options.iframeId || 'vm-iframe';
    iframe.setAttribute('sandbox', 'allow-scripts allow-modals');
    iframe.setAttribute('title', 'Qandy Virtual Machine');
    iframe.style.margin = 0;
    iframe.style.padding = 0;
    iframe.style.width = '100%';
    iframe.style.height = '100%';
    iframe.style.border = '0';
    iframe.style.display = 'block';
    iframe.style.overflow = 'hidden';
    iframe.style.background = 'transparent';
    vmContainer.appendChild(iframe);
    document.body.appendChild(vmContainer);
    var blob = new Blob([html], { type: 'text/html' });
    var blobUrl = URL.createObjectURL(blob);
    iframe.src = blobUrl;
    iframe._qandyGuestBlobUrl = blobUrl;
    window._vmIframe = iframe;
    window._vmContainer = vmContainer;
    document.getElementById('txt')?.style.setProperty('display','none');
    document.getElementById('keyboard-container')?.style.setProperty('display','none');
    //document.getElementById('pop')?.style.setProperty('display','none');
    //document.getElementById('qpc')?.style.setProperty('display','none');
    window.addEventListener('message', hostMessageHandler, false);
    iframe._qandyGuestCleanup = function () {
      try { URL.revokeObjectURL(blobUrl); } catch (e) {}
      window.removeEventListener('message', hostMessageHandler, false);
      if (iframe && iframe.parentNode) iframe.parentNode.removeChild(iframe);
      if (vmContainer && vmContainer.parentNode) vmContainer.parentNode.removeChild(vmContainer);
      window._vmIframe = null;
      window._vmContainer = null;
    };
    return {vmIframe: iframe, container: vmContainer, blobUrl: blobUrl };
  }
}

function user() {
  if (GUEST) {
    try {
      var hostEl = document.getElementById('txt');
      var hostKb = document.getElementById('host-keyboard');
      var guestKb = document.getElementById('guest-keyboard');
      var vm = document.getElementById('vm-container') || window._vmContainer || null;
      var iframe = document.getElementById('vm-iframe') || window._vmIframe || null;
      if (hostEl) { hostEl.style.display = 'none'; hostEl.style.visibility = 'hidden'; hostEl.style.pointerEvents = 'none'; }
      if (hostKb) { hostKb.style.display = 'none'; hostKb.style.visibility = 'hidden'; hostKb.style.pointerEvents = 'none'; }
      // Show guest container / iframe and bring it to front
      if (vm) {
        vm.style.display = 'block';
        vm.style.visibility = 'visible';
        vm.style.pointerEvents = 'auto';
        // ensure vm is above host
        try {
          vm.style.position = vm.style.position || 'absolute';
          vm.style.zIndex = String(Math.max(parseInt(vm.style.zIndex || 0, 10) || 100, 1000));
        } catch (e) {}
      }
      if (iframe) {
        iframe.style.display = 'block';
        iframe.style.visibility = 'visible';
        iframe.style.pointerEvents = 'auto';
        try { iframe.style.zIndex = vm && vm.style && vm.style.zIndex ? String(parseInt(vm.style.zIndex,10) + 1) : '1001'; } catch (e) {}
      }
      if (guestKb) {
        guestKb.style.display = 'block';
        guestKb.style.visibility = 'visible';
        guestKb.style.pointerEvents = 'auto';
        try {
          guestKb.style.position = guestKb.style.position || 'absolute';
          // put guest keyboard above vm-container
          var vmZ = vm && vm.style && vm.style.zIndex ? parseInt(vm.style.zIndex,10) : 1000;
          guestKb.style.zIndex = String(Math.max(parseInt(guestKb.style.zIndex || 0,10) || (vmZ + 1), vmZ + 1));
        } catch (e) {}
      }
      if (hostEl) { hostEl.style.pointerEvents = 'none'; }
      if (hostKb) { hostKb.style.pointerEvents = 'none'; hostKb.style.visibility = 'hidden'; }
      try {
        if (iframe) {
          iframe.setAttribute && iframe.setAttribute('tabindex', '0'); // make focusable
          try { iframe.focus(); } catch (e) { console.warn('iframe.focus failed', e); }
          try { if (iframe.contentWindow && typeof iframe.contentWindow.focus === 'function') iframe.contentWindow.focus(); } catch (e) { console.warn('iframe.contentWindow.focus failed', e); }
          try { 
            var doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
             if (doc && doc.body && typeof doc.body.focus === 'function') doc.body.focus();
          } catch (e) { /* cross-origin or not accessible; ignore */ }
          setTimeout(function() {
            try { iframe.focus(); } catch (e) {}
            try { if (iframe.contentWindow && typeof iframe.contentWindow.focus === 'function') iframe.contentWindow.focus(); } catch (e) {}
          }, 50);
        }
      } catch (errFocus) {
        console.warn('focus restore attempted but failed', errFocus);
      }
      console.log('Attempted to focus guest iframe; activeElement is:', document.activeElement);
    } catch (err) {
      console.error('focusGuestIframe failed', err);
    }
  }
}

function sysop() { 
  if (isAudioUnlocked()===false) { sound_js(); }        
  // Hide guest VM and guest keyboard only; keep host UI visible
  try {
    // Ensure host text area is visible / interactive
    var hostEl = document.getElementById('txt') || document.getElementById('qandy') || document.body;
    if (hostEl) {
      hostEl.style.display = 'block';
      hostEl.style.visibility = 'visible';
      hostEl.style.pointerEvents = 'auto';
      hostEl.style.opacity = hostEl.style.opacity || '1';
    }
    // Ensure legacy wrapper is visible so host keyboard (child) can be shown
    var wrapper = document.getElementById('keyboard-container');
    if (wrapper) {
      wrapper.style.display = 'block';
      wrapper.style.visibility = 'visible';
      wrapper.style.pointerEvents = 'auto';
    }
    // Show host-keyboard explicitly
    var hostKb = document.getElementById('host-keyboard');
    if (hostKb) {
      hostKb.style.display = 'block';
      hostKb.style.visibility = 'visible';
      hostKb.style.pointerEvents = 'auto';
      hostKb.style.position = hostKb.style.position || 'absolute';
      hostKb.style.zIndex = hostKb.style.zIndex || '110';
    }
    // Hide guest-keyboard only
    var guestKb = document.getElementById('guest-keyboard');
    if (guestKb) {
      guestKb.style.display = 'none';
      guestKb.style.visibility = 'hidden';
      guestKb.style.pointerEvents = 'none';
    }
    // Hide vm-container and/or iframe (guest VM)
    var vm = document.getElementById('vm-container') || window._vmContainer || null;
    if (vm) {
      vm.style.display = 'none';
      vm.style.visibility = 'hidden';
      vm.style.pointerEvents = 'none';
      try { vm.style.zIndex = '-1'; } catch (e) {}
    }
    var iframe = document.getElementById('vm-iframe') || window._vmIframe || null;
    if (iframe) {
      iframe.style.display = 'none';
      iframe.style.visibility = 'hidden';
      iframe.style.pointerEvents = 'none';
      try { iframe.style.zIndex = '-1'; } catch (e) {}
    }
  } catch (err) {
    console.error('showHostHideGuest failed', err);
  }
}

function isAudioUnlocked() {
  try {
    if (window._qandy_audio && window._qandy_audio.unlocked) return true;
    var ctx = (window._qandy_audio && window._qandy_audio.ctx) || window.audioContext || null;
    if (ctx && ctx.state === 'running') return true;
    if (window.audioCtx && window.audioCtx.state === 'running') return true;
  } catch (e) {}
  return false;
}
