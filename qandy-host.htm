var SCRIPT_QUEUE = [
  { src: 'video.js', name: 'video.js' },

var currentIndex = 0;
var signalAdvance = null;

window.qandySignalReady = function(scriptName) {
  console.log('\u2713 ' + scriptName + ' signaled ready');
  if (typeof signalAdvance === 'function') { signalAdvance(); }
};
  
function loadNext() {
  if (typeof signalAdvance === 'function') { signalAdvance(); }
  if (currentIndex >= SCRIPT_QUEUE.length) {
    // Call startup() (if present). Use an async IIFE so startup can be async/await.
    (async function() {
      try {
        if (typeof startup === 'function') {
          console.info('loader: calling startup()');
          await Promise.resolve(startup());
          console.info('loader: startup() completed');
        } else {
          console.info('loader: startup() not defined');
        }
      } catch (e) {
        console.error('startup() failed', e);
      } finally {
        document.dispatchEvent(new CustomEvent('qandyReady'));
      }
    })();
    return;
  }

  var entry = SCRIPT_QUEUE[currentIndex];
  currentIndex++;
  var advanced = false;
  function advance() {
    if (advanced) return;
    advanced = true;
    signalAdvance = null;
    loadNext();
  }

  // Register advance as the handler for qandySignalReady for this script
  signalAdvance = advance;

  switch (entry.name) {
    case "video.js": init_video_js(); break;
    case "keyboard.js": init_keyboard_js(); break;
    case "command.js": init_command_js(); break;
    case "qandy.js": init_qandy_js(); break; 
  }

  // Keep a shorter timeout as a final safety
  var timeout = setTimeout(function() {
    if (!advanced) {
      console.warn('Timed out waiting for ' + entry.name + ' to signal ready. Continuing.');
      advance();
    }
  }, 1000);
}


function startScriptLoading() {
  currentIndex = 0;
  loadNext();
}

// Rewritten createPowerOverlay() — updated to call init_sound_js() (embedded) instead of loading sound.js
function powerOn() {
  console.info("Creating Power On Button");
  var target = document.getElementById('qandy') || document.getElementById('txt') || document.body;
  var rect = target.getBoundingClientRect();

  var overlay = document.createElement('div');
  overlay.id = 'qandy-power-overlay';
  overlay.setAttribute('role', 'button');
  overlay.setAttribute('aria-label', 'Power on the Qandy Pocket Computer');
  overlay.tabIndex = 0;

  Object.assign(overlay.style, {
    position: 'fixed',
    left: rect.left + 'px',
    top: rect.top + 'px',
    width: rect.width + 'px',
    height: rect.height + 'px',
    zIndex: '300',
    background: 'transparent',
    pointerEvents: 'auto',
    display: 'flex',
    alignItems: 'center',
    justifyContent: 'center',
    userSelect: 'none'
  });

  var label = document.createElement('div');
  label.id = 'qandy-power-label';
  label.textContent = 'POWER ON';
  Object.assign(label.style, {
    color: '#fff',
    fontFamily: 'monospace, monospace',
    fontSize: '28px',
    letterSpacing: '2px',
    textAlign: 'center',
    textTransform: 'uppercase',
    lineHeight: '1',
    textShadow: '0 1px 0 rgba(0,0,0,0.6)',
    pointerEvents: 'none'
  });

  var helper = document.createElement('div');
  helper.id = 'qandy-power-helper';
  helper.textContent = 'Click any button,\npress any key,\nor touch screen to power on.';
  Object.assign(helper.style, {
    color: '#ffffff',
    fontFamily: 'monospace, monospace',
    fontSize: '12px',
    marginTop: '8px',
    opacity: '0.95',
    pointerEvents: 'none'
  });

  var stack = document.createElement('div');
  stack.style.display = 'flex';
  stack.style.flexDirection = 'column';
  stack.style.alignItems = 'center';
  stack.style.justifyContent = 'center';
  stack.appendChild(label);
  stack.appendChild(helper);

  overlay.appendChild(stack);
  document.body.appendChild(overlay);

  var reposition = function () {
    var r = target.getBoundingClientRect();
    overlay.style.left = r.left + 'px';
    overlay.style.top = r.top + 'px';
    overlay.style.width = r.width + 'px';
    overlay.style.height = r.height + 'px';
  };
  window.addEventListener('resize', reposition);

  var ro;
  if (typeof MutationObserver !== 'undefined') {
    ro = new MutationObserver(reposition);
    try { ro.observe(target, { attributes: true, childList: true, subtree: true }); } catch (e) {}
  }

  function engageHandler(e) {
    cleanupListeners();
    // Immediate tiny beep (inside user gesture)
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.value = 0.04;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.04);
      setTimeout(function () { try { if (ctx.close) ctx.close(); } catch (e) {} }, 200);
    } catch (err) {
      console.warn('qandy: beep failed', err);
    }

    // IMPORTANT: call init_sound_js() (embedded) synchronously so the embedded sound module
    // initializes within the user gesture and can create/resume an AudioContext.
    try {
      if (typeof init_sound_js === 'function') {
        try {
          init_sound_js(); // initialize embedded sound module
        } catch (innerErr) {
          console.warn('qandy: init_sound_js() threw', innerErr);
        }
        // If the embedded sound module exposed an audioContext, attempt to resume it if suspended.
        try {
          if (window.audioContext && typeof window.audioContext.resume === 'function' && window.audioContext.state === 'suspended') {
            window.audioContext.resume().catch(function(){});
          }
        } catch (e) { /* ignore */ }
      } else {
        // Fallback: if init_sound_js not present, try to resume any existing global audio context.
        if (window.audioContext && typeof window.audioContext.resume === 'function') {
          window.audioContext.resume().catch(function(){});
        } else {
          console.warn('qandy: init_sound_js() not found; sound may be unavailable.');
        }
      }
    } catch (e) {
      console.warn('qandy: error while initializing sound', e);
    }

    // Remove overlay and observers, continue startup
    if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
    if (ro) try { ro.disconnect(); } catch (e) {}
    try { window.removeEventListener('resize', reposition); } catch (e) {}

    try {
      if (typeof startScriptLoading === 'function') {
        startScriptLoading();
      } else {
        console.warn('qandy: startScriptLoading() not found; continue startup manually.');
      }
    } catch (e) {
      console.error('qandy: error while continuing startup', e);
    }
  }

  function cleanupListeners() {
    overlay.removeEventListener('pointerdown', engageHandler, true);
    overlay.removeEventListener('touchstart', engageHandler, true);
    overlay.removeEventListener('click', engageHandler, true);
    document.removeEventListener('keydown', engageHandler, true);
    overlay.removeEventListener('keydown', onOverlayKeyDown, true);
  }

  function onOverlayKeyDown(e) {
    engageHandler(e);
  }

  overlay.addEventListener('pointerdown', engageHandler, { capture: true, passive: true, once: true });
  overlay.addEventListener('touchstart', engageHandler, { capture: true, passive: true, once: true });
  overlay.addEventListener('init(click', engageHandler, { capture: true, passive: true, once: true });
  document.addEventListener('keydown', engageHandler, { capture: true, once: true });
  overlay.addEventListener('keydown', onOverlayKeyDown, { capture: true, once: true });

  try { overlay.focus(); } catch (e) {}

  return {
    overlayElement: overlay,
    remove: function () {
      cleanupListeners();
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      if (ro) try { ro.disconnect(); } catch (e) {}
      try { window.removeEventListener('resize', reposition); } catch (e) {}
    }
  };
}

// Build guest HTML and embed HOST_SCRIPTS map (filename -> source string)
async function assembleGuestHtml(options) {
  // should this be if GUEST==true?
  if (HOST==true) {  
    options = options || {};

    // Build HTML parts
    var parts = [];
    parts.push('<!doctype html>');
    parts.push('<html>');
    parts.push('<head>');
    parts.push('<meta charset="utf-8">');
    parts.push('<meta name="viewport" content="width=device-width,initial-scale=1">');
    // Expose assembled flag and QANDY.mode
    parts.push('<script>window._QANDY_ASSEMBLED = true; window.QANDY = window.QANDY || {}; window.QANDY.mode = "guest";</' + 'script>');
    parts.push('</head>');
    parts.push('<body>');
    var bodyHtml =  document.body.innerHTML;
    bodyHtml = String(bodyHtml).replace(/\bvar\s+HOST\s*=\s*1\s*;?/g, 'var HOST=0;');
    bodyHtml = String(bodyHtml).replace(/\bvar\s+GUEST\s*=\s*0\s*;?/g, 'var GUEST=1;');
    parts.push(bodyHtml);
    parts.push('</body></html>');
    return parts.join('\n');
  }
  
  function sanitizeScriptText(txt) {
    return String(txt || '')
    .replace(/[\u200B\uFEFF\u200C\u200D]/g, '')      // strip invisible chars
    .replace(/<\/script>/gi, '<\\/script>');        // escape closing script sequences
  }
}

window.evalCode=function(code) {
  try {
    var trimmed = String(code).trim();
    var simpleNameRE = /^[$A-Za-z_][$A-Za-z0-9_]*(?:\s*\.\s*[$A-Za-z_][$A-Za-z0-9_]*)*$/;

    function handleResult(result) {
      try {
        if (result === undefined) return;
        // If result is a Promise, wait for it and print the resolved value or error
        if (result && typeof result.then === 'function') {
          result.then(function(res) {
            try {
              if (res !== undefined) { print(String(res) + "\n\n"); }
            } catch (e) {
              print("Error printing promise result: " + (e && e.message ? e.message : String(e)) + "\n\n");
            }
          }).catch(function(err) {
            try {
              print("Promise rejection: " + (err && err.message ? err.message : String(err)) + "\n\n");
            } catch (e) {
              /* swallow */
            }
          });
          return;
        }
        // Non-promise: print synchronously
        print(String(result) + "\n\n");
      } catch (e) {
        try { print("Error handling result: " + e.message + "\n\n"); } catch (ee) {}
      }
    }

    if (simpleNameRE.test(trimmed)) {
      try {
        var value = eval(trimmed);
      } catch (e) {
        print("EI assume trror: " + e.message + "\n\n");
        return false;
      }
      if (typeof value === "function") {
        print("ERROR: use: " + trimmed + "()\n\n");
        return true;
      }
      handleResult(value);
      return true;
    }

    var result = eval(code);
    handleResult(result);
    return true;
  } catch (error) {
    print("Error: " + error.message + "\n\n");
    return false;
  }
}

 }
 if (event.keyCode === 17 && !ctrl) {
  ctrl=1; ctrlPhysical=true;
  document.getElementById(kid+"ctrl").style.backgroundColor = "#ddd";
  document.getElementById(kid+"ctrl").style.color = "#000";
  return;
 }
 if (event.keyCode === 18 && !alt) {
  highlightKey(k);
  alt = 1; altPhysical = true;
  document.getElementById(kid+"alt").style.backgroundColor = "#fff";
  document.getElementById(kid+"alt").style.color = "#000";
  updateKeyLabels();
 }
 // For Ctrl+key combos, pass specific ones through to button() (Ctrl+C, Ctrl+A)
 // Ctrl+V is handled via the native paste event listener instead
 if (event.ctrlKey) {
  var ctrlKey = event.key ? event.key.toLowerCase() : '';
  if (ctrlKey === 'c' || ctrlKey === 'a') {
   event.preventDefault();
   highlightKey(k);
   button(k, event);
  }
  // All other ctrl combos: let browser handle
  return;
 }
 highlightKey(k);
 button(k, event);
}

window.pressup=function(event) {
  // Prevent browser from handling ALT key - must be done before any conditionals
  if (HOST) { kid="host-"; } else { kid="guest-"; }
  if (event.keyCode === 18 || event.altKey) {
    event.preventDefault(); // Prevent browser menu from opening
  }
 
  // Handle physical CTRL key release (unhighlight)
  if (event.keyCode === 17 && ctrlPhysical) {
    ctrl = 0;
    ctrlPhysical = false;
    document.getElementById(kid+"ctrl").style.backgroundColor = "#222";
    document.getElementById(kid+"ctrl").style.color = "#fff";
    return;
  }

  // Handle physical SHIFT key release (unhighlight CAPS unless caps mode is active)
  if (event.keyCode === 16) {
    shift = 0;
    if (typeof updateKeyLabels === 'function') updateKeyLabels();
    if (!caps) { unhighlightKey('caps'); }
    return;
  }

  // Handle physical ALT key release (unhighlight)
  if (event.keyCode === 18 && altPhysical) {
    alt = 0;
    altPhysical = false;
    document.getElementById(kid+"alt").style.backgroundColor = "#fff";
    document.getElementById(kid+"alt").style.color = "#000";
    updateKeyLabels();
    return;
  }
 
  // Route keyup to active script if run is set
  if (RUN && typeof keyup !== 'undefined') {
    var k = String.fromCharCode(event.keyCode);
    var keyData = {keyCode: event.keyCode, key: k, shiftKey: !!shift, ctrlKey: !!ctrl, altKey: !!alt, source: 'physical', originalEvent: event};
    dispatchKeyboardEvent('keyup', keyData);
  }
}

window.dispatchKeyboardEvent = function(eventType, keyData) {
  if (eventType === 'keydown') {
    if (RUN && typeof keydown !== 'undefined') {
      try { keydown(keyData.key, keyData); } catch (e) { print("ERROR: keydown();\n\n"); }
      return; // program handled it; Qandy does not process (backward compatible)
    }
    // No program running: fall back to Qandy's button() handler
    button(keyData.keyCode, keyData.originalEvent);
  } else if (eventType === 'keyup') {
    if (RUN && typeof keyup !== 'undefined') {
      try { keyup(keyData.key, keyData); } catch (e) {}
    }
  }
};

window.hostScript=function(name) {
  if (!name || typeof name !== 'string') return false;
  name = name.trim();
  if (!/^[A-Za-z0-9.\-]+\.js$/i.test(name)) return false;
  if (/^[.\-]/.test(name) || /[.\-]$/.test(name)) return false;
  if (/\.\./.test(name)) return false;
  if (name.length > 64) return false;

  window.hostScript._cnt = (window.hostScript._cnt || 0) + 1;
  var reqId = 'hs_' + Date.now() + '_' + window.hostScript._cnt;

  var timer = setTimeout(function() {
    window.removeEventListener('message', handler);
    print("Timeout loading: " + name + "\n");
  }, 10000);

  function handler(ev) {
    var d = ev.data || {};
    if (d && d.type === 'scriptLoaded' && d.id === reqId) {
      clearTimeout(timer);
      window.removeEventListener('message', handler);
      if (d.error || d.code === null || d.code === undefined) {
        print("File Error\n");
      } else {
        try {
          // eslint-disable-next-line no-eval
          (0, eval)(String(d.code) + '\n//# sourceURL=' + name);
        } catch (e) {
          print("Error running " + name + ": " + String(e) + "\n");
        }
      }
    }
  }

  window.addEventListener('message', handler, false);
  try {
    window.parent.postMessage({ type: 'loadScript', id: reqId, name: name }, '*');
  } catch (e) {
    clearTimeout(timer);
    window.removeEventListener('message', handler);
    print("Error requesting script: " + String(e) + "\n");
  }
}

window.waitForCursorIdle=function(timeoutMs) {
  timeoutMs = typeof timeoutMs === 'number' ? timeoutMs : 5000;
  return new Promise(function(resolve) {
    if (!window._pokeCursor_state) return resolve();
    var start = Date.now();
    var iv = setInterval(function() {
      if (!window._pokeCursor_state) {
        clearInterval(iv);
        return resolve();
      }
      if (Date.now() - start > timeoutMs) {
        clearInterval(iv);
        return resolve();
      }
    }, 8);
  });
}

window._qandy_print_queue = window._qandy_print_queue || { items: [], running: false };

async function _processPrintQueue() {
  var q = window._qandy_print_queue;
  if (q.running) return;
  q.running = true;
  try {
    while (q.items.length) {
      var job = q.items.shift();
      // wait for any current paced output to finish
      await waitForCursorIdle();
      // invoke pokeCursor to print this job.text
      try {
        pokeCursor(job.text);
      } catch (e) {
        // If pokeCursor thrown, still resolve so callers don't hang
      }
      // wait for this pokeCursor output to finish
      await waitForCursorIdle();
      // resolve the enqueue promise if present
      try { job.resolve(); } catch (e) {}
    }
  } finally {
    q.running = false;
  }
}
