var currentIndex = 0;
var signalAdvance = null;

window.qandySignalReady = function(scriptName) {
  LOG+=scriptName+' initalized\n';
  if (typeof signalAdvance === 'function') { signalAdvance(); }
};
  
function loadNext() {
  if (typeof signalAdvance === 'function') { signalAdvance(); }
  if (currentIndex >= SCRIPT_QUEUE.length) {
    // Call startup() (if present). Use an async IIFE so startup can be async/await.
    (async function() {
      try {
        if (typeof startup === 'function') {
          await Promise.resolve(startup());
        } else {
          LOG+='startup() not defined\n';
        }
      } catch (e) {
        LOG+='startup() failed\n';
      }
    })();
    return;
  }

  var entry = SCRIPT_QUEUE[currentIndex];
  currentIndex++;
  var advanced = false;
  function advance() {
    if (advanced) return;
    advanced = true;
    signalAdvance = null;
    loadNext();
  }

  // Register advance as the handler for qandySignalReady for this script
  signalAdvance = advance;

  switch (entry.name) {
    case "video.js": video_js(); break;
    case "keyboard.js": keyboard_js(); break;
    case "command.js": command_js(); break;
    case "qandy.js": qandy_js(); break; 
  }


  // Keep a shorter timeout as a final safety
  var timeout = setTimeout(function() {
    if (!advanced) {
      LOG+=entry.name+' time out\n';
      advance();
    }
  }, 2000);
}

function powerOn() {
  LOG+="Creating Power On Button\n";
  var target = document.getElementById('qandy') || document.getElementById('txt') || document.body;
  var rect = target.getBoundingClientRect();

  var overlay = document.createElement('div');
  overlay.id = 'qandy-power-overlay';
  overlay.setAttribute('role', 'button');
  overlay.setAttribute('aria-label', 'Power on the Qandy Pocket Computer');
  overlay.tabIndex = 0;

  Object.assign(overlay.style, {
    position: 'fixed',
    left: rect.left + 'px',
    top: rect.top + 'px',
    width: rect.width + 'px',
    height: rect.height + 'px',
    zIndex: '300',
    background: 'transparent',
    pointerEvents: 'auto',
    display: 'flex',
    alignItems: 'center',
    justifyContent: 'center',
    userSelect: 'none'
  });

  var label = document.createElement('div');
  label.id = 'qandy-power-label';
  label.textContent = 'POWER ON';
  Object.assign(label.style, {
    color: '#fff',
    fontFamily: 'monospace, monospace',
    fontSize: '28px',
    letterSpacing: '2px',
    textAlign: 'center',
    textTransform: 'uppercase',
    lineHeight: '1',
    textShadow: '0 1px 0 rgba(0,0,0,0.6)',
    pointerEvents: 'none'
  });

  var helper = document.createElement('div');
  helper.id = 'qandy-power-helper';
  helper.textContent = 'Click any button,\npress any key,\nor touch screen to power on.';
  Object.assign(helper.style, {
    color: '#ffffff',
    fontFamily: 'monospace, monospace',
    fontSize: '12px',
    marginTop: '8px',
    opacity: '0.95',
    pointerEvents: 'none'
  });

  var stack = document.createElement('div');
  stack.style.display = 'flex';
  stack.style.flexDirection = 'column';
  stack.style.alignItems = 'center';
  stack.style.justifyContent = 'center';
  stack.appendChild(label);
  stack.appendChild(helper);

  overlay.appendChild(stack);
  document.body.appendChild(overlay);

  var reposition = function () {
    var r = target.getBoundingClientRect();
    overlay.style.left = r.left + 'px';
    overlay.style.top = r.top + 'px';
    overlay.style.width = r.width + 'px';
    overlay.style.height = r.height + 'px';
  };
  window.addEventListener('resize', reposition);

  var ro;
  if (typeof MutationObserver !== 'undefined') {
    ro = new MutationObserver(reposition);
    try { ro.observe(target, { attributes: true, childList: true, subtree: true }); } catch (e) {}
  }

  function engageHandler(e) {
    cleanupListeners();
    // Immediate tiny beep (inside user gesture)
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.value = 0.04;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.04);
      setTimeout(function () { try { if (ctx.close) ctx.close(); } catch (e) {} }, 200);
    } catch (err) {
      console.warn('qandy: beep failed', err);
    }

    // IMPORTANT: call sound_js() (embedded) synchronously so the embedded sound module
    // initializes within the user gesture and can create/resume an AudioContext.
    try {
      if (typeof sound_js === 'function') {
        try {
          sound_js(); // initialize embedded sound module
        } catch (innerErr) {
          console.warn('qandy: sound_js() threw', innerErr);
        }
        // If the embedded sound module exposed an audioContext, attempt to resume it if suspended.
        try {
          if (window.audioContext && typeof window.audioContext.resume === 'function' && window.audioContext.state === 'suspended') {
            window.audioContext.resume().catch(function(){});
          }
        } catch (e) { /* ignore */ }
      } else {
        // Fallback: if sound_js not present, try to resume any existing global audio context.
        if (window.audioContext && typeof window.audioContext.resume === 'function') {
          window.audioContext.resume().catch(function(){});
        } else {
          console.warn('qandy: sound_js() not found; sound may be unavailable.');
        }
      }
    } catch (e) {
      console.warn('qandy: error while initializing sound', e);
    }

    // Remove overlay and observers, continue startup
    if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
    if (ro) try { ro.disconnect(); } catch (e) {}
    try { window.removeEventListener('resize', reposition); } catch (e) {}
    loadNext();
  }

  function cleanupListeners() {
    overlay.removeEventListener('pointerdown', engageHandler, true);
    overlay.removeEventListener('touchstart', engageHandler, true);
    overlay.removeEventListener('click', engageHandler, true);
    document.removeEventListener('keydown', engageHandler, true);
    overlay.removeEventListener('keydown', onOverlayKeyDown, true);
  }

  function onOverlayKeyDown(e) {
    engageHandler(e);
  }

  overlay.addEventListener('pointerdown', engageHandler, { capture: true, passive: true, once: true });
  overlay.addEventListener('touchstart', engageHandler, { capture: true, passive: true, once: true });
  overlay.addEventListener('click', engageHandler, { capture: true, passive: true, once: true });
  document.addEventListener('keydown', engageHandler, { capture: true, once: true });
  overlay.addEventListener('keydown', onOverlayKeyDown, { capture: true, once: true });

  try { overlay.focus(); } catch (e) {}

  return {
    overlayElement: overlay,
    remove: function () {
      cleanupListeners();
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      if (ro) try { ro.disconnect(); } catch (e) {}
      try { window.removeEventListener('resize', reposition); } catch (e) {}
    }
  };
}

function init() {
  if (document.readyState === 'loading') {
    if (HOST==true) {
      LOG+="power on HOST\n";
      setTimeout(loadNext, 0);
    } else {
      LOG+="power on GUEST\n";
      document.addEventListener('DOMContentLoaded', powerOn);
    }
  } else {
    if (HOST==true) {
      LOG+="power-on HOST\n";
      setTimeout(loadNext, 0);
    } else {
      LOG+="power on GUEST\n";
      document.addEventListener('DOMContentLoaded', powerOn);
    }
  }
}

async function qandyGuestHtm(options) {
  // should this be if GUEST==true?
  if (HOST==true) {  
    options = options || {};

    // Build HTML parts
    var parts = [];
    parts.push('<!doctype html>');
    parts.push('<html>');
    parts.push('<head>');
    parts.push('<meta charset="utf-8">');
    parts.push('<meta name="viewport" content="width=device-width,initial-scale=1">');
    // Expose assembled flag and QANDY.mode
    parts.push('<script>window._QANDY_ASSEMBLED = true; window.QANDY = window.QANDY || {}; window.QANDY.mode = "guest";</' + 'script>');
    parts.push('</head>');
    parts.push('<body>');
    var bodyHtml =  document.body.innerHTML;
    bodyHtml = String(bodyHtml).replace(/\bvar\s+HOST\s*=\s*1\s*;?/g, 'var HOST=0;');
    bodyHtml = String(bodyHtml).replace(/\bvar\s+GUEST\s*=\s*0\s*;?/g, 'var GUEST=1;');
    parts.push(bodyHtml);
    parts.push('</body></html>');
    return parts.join('\n');
  }
  
  function sanitizeScriptText(txt) {
    return String(txt || '')
      .replace(/[\u200B\uFEFF\u200C\u200D]/g, '')      // strip invisible chars
      .replace(/<\/script>/gi, '<\\/script>');        // escape closing script sequences
  }
}

async function hostMessageHandler(ev) {
  //if (!iframe.contentWindow || ev.source !== iframe.contentWindow) {
  //  console.log("Message is not from our iframe");
  //  return;
  //}
  var iframe = window._vmIframe || document.getElementById('vm-iframe');
  if (!iframe || !iframe.contentWindow || ev.source !== iframe.contentWindow) { return; }
  var d = ev.data || {}; if (!d || typeof d !== 'object') return;
  
  if (d.type === 'guest-action' && typeof d.action === 'string') {
    try {
      switch(d.action) {
      
        case 'sysop': { sysop(); break; }
        case 'user': { sysop(); break; }
        
        case 'localList': {
          var _dosIframe = window._vmIframe || document.getElementById('vm-iframe');
          // call localDir() and handle both sync and Promise-returning implementations
          Promise.resolve().then(function () { return localList(); })
            .then(function (result) {
              dosXmitQdos(_dosIframe, d.id, 'localList', true, result);
            })
            .catch(function (err) {
              dosXmitQdos(_dosIframe, d.id, 'localList', false, err && err.message ? err.message : String(err));
            });
          break;
        }

        case 'localDir': {
          var _dosIframe = window._vmIframe || document.getElementById('vm-iframe');
          var pattern = validateGuestPattern((typeof d.pattern === 'undefined' || d.pattern === null) ? '' : String(d.pattern));
          var switches = validateGuestSwitches((typeof d.switches === 'undefined' || d.switches === null) ? '' : String(d.switches));
          // call localDir() and handle both sync and Promise-returning implementations
          Promise.resolve().then(function () { return localDir(pattern, switches); })
            .then(function (result) {
              dosXmitQdos(_dosIframe, d.id, 'localDir', true, result);
            })
            .catch(function (err) {
              dosXmitQdos(_dosIframe, d.id, 'localDir', false, err && err.message ? err.message : String(err));
            });
          break;
        }

        case 'localMkDir': {
          var _dosIframe = window._vmIframe || document.getElementById('vm-iframe');
          var fname = (typeof d.file === 'undefined' || d.file === null) ? '' : String(d.file);
          var validName = validateGuestFilename(fname);
          if (!validName) { dosXmitQdos(_dosIframe, d.id, 'localMkDir', false, 'invalid filename'); break; }

              dosXmitQdos(_dosIframe, d.id, 'localMkDir', true, result);

function validateGuestFilename(name) {
  if (typeof name !== 'string' && typeof name !== 'number') return null;
  var s = String(name).trim();
  if (!s) return null;
  // Reject path separators and traversal
  if (/[\/\\]/.test(s)) return null;
  if (/\.\./.test(s)) return null;
  // Allow letters, numbers, spaces, dot, dash, underscore (adjust to taste)
  // Limit length to reasonable size to avoid DOS attacks
  if (s.length > 128) return null;
  if (!/^[A-Za-z0-9 _.\-!]+$/.test(s)) return null;
  return s;
}

function validateGuestPattern(pattern) {
  if (typeof pattern !== 'string') return '';
  var s = String(pattern).trim();
  if (!s) return '';
  // Reject path separators and traversal
  if (/[\/\\]/.test(s)) return '';
  if (/\.\./.test(s)) return '';
  // Like validateGuestFilename but also allow wildcards * and ?
  if (s.length > 128) return '';
  if (!/^[A-Za-z0-9 _.\-!*?]+$/.test(s)) return '';
  return s;
}

function validateGuestSwitches(sw) {
  if (typeof sw !== 'string') return '';
  var s = String(sw).trim();
  if (!s) return '';
  // Only allow dash and lowercase letters (e.g. "-th", "-t", "th")
  if (!/^-?[a-zA-Z]+$/.test(s)) return '';
  if (s.length > 16) return '';
  return s;
}

function dosXmitQdos(iframe, id, action, ok, resultOrError) {
  if (!iframe || !iframe.contentWindow) return;
  var msg = { type: 'action-result', action: action, id: id, success: Boolean(ok) };
  if (ok) {
    var r = resultOrError;
    if (Array.isArray(r)) r = r.join('\n');
    else if (r === null || typeof r === 'undefined') r = '';
    else if (typeof r === 'object') {
      try { r = JSON.stringify(r); } catch (e) { r = String(r); }
    } else r = String(r);
    msg.result = r;
  } else {
    msg.error = String(resultOrError || 'error');
  }
  try { iframe.contentWindow.postMessage(msg, '*'); } catch (e) {
    console.warn('dosXmitQdos: postMessage failed', e);
  }
}

    vmContainer.appendChild(iframe);

    var blob = new Blob([html], { type: 'text/html' });
    var blobUrl = URL.createObjectURL(blob);
    iframe.src = blobUrl;
    iframe._qandyGuestBlobUrl = blobUrl;
    window._vmIframe = iframe;
    window._vmContainer = vmContainer;
    document.getElementById('txt')?.style.setProperty('display','none');

    //document.getElementById('pop')?.style.setProperty('display','none');
    //document.getElementById('qpc')?.style.setProperty('display','none');
    window.addEventListener('message', hostMessageHandler, false);
    iframe._qandyGuestCleanup = function () {
      try { URL.revokeObjectURL(blobUrl); } catch (e) {}
      window.removeEventListener('message', hostMessageHandler, false);
      if (iframe && iframe.parentNode) iframe.parentNode.removeChild(iframe);
      if (vmContainer && vmContainer.parentNode) vmContainer.parentNode.removeChild(vmContainer);
      window._vmIframe = null;
      window._vmContainer = null;
    };
    return {vmIframe: iframe, container: vmContainer, blobUrl: blobUrl };
  }
}

function user() {
  if (GUEST) {
    try {
      var hostEl = document.getElementById('txt');
      var hostKb = document.getElementById('host-keyboard');
      var guestKb = document.getElementById('guest-keyboard');
      var vm = document.getElementById('vm-container') || window._vmContainer || null;

      if (hostKb) { hostKb.style.display = 'none'; hostKb.style.visibility = 'hidden'; hostKb.style.pointerEvents = 'none'; }
      // Show guest container / iframe and bring it to front
      if (vm) {

        vm.style.pointerEvents = 'auto';
        // ensure vm is above host
        try {
          vm.style.position = vm.style.position || 'absolute';
          vm.style.zIndex = String(Math.max(parseInt(vm.style.zIndex || 0, 10) || 100, 1000));
        } catch (e) {}
      }
      if (iframe) {
        iframe.style.display = 'block';
        iframe.style.visibility = 'visible';
        iframe.style.pointerEvents = 'auto';
        try { iframe.style.zIndex = vm && vm.style && vm.style.zIndex ? String(parseInt(vm.style.zIndex,10) + 1) : '1001'; } catch (e) {}
      }
      if (guestKb) {
        guestKb.style.display = 'block';
        guestKb.style.visibility = 'visible';
        guestKb.style.pointerEvents = 'auto';
        try {
          guestKb.style.position = guestKb.style.position || 'absolute';
          // put guest keyboard above vm-container
          var vmZ = vm && vm.style && vm.style.zIndex ? parseInt(vm.style.zIndex,10) : 1000;
          guestKb.style.zIndex = String(Math.max(parseInt(guestKb.style.zIndex || 0,10) || (vmZ + 1), vmZ + 1));
        } catch (e) {}
      }
      if (hostEl) { hostEl.style.pointerEvents = 'none'; }
      if (hostKb) { hostKb.style.pointerEvents = 'none'; hostKb.style.visibility = 'hidden'; }
      try {
        if (iframe) {
          iframe.setAttribute && iframe.setAttribute('tabindex', '0'); // make focusable
          try { iframe.focus(); } catch (e) { console.warn('iframe.focus failed', e); }
          try { if (iframe.contentWindow && typeof iframe.contentWindow.focus === 'function') iframe.contentWindow.focus(); } catch (e) { console.warn('iframe.contentWindow.focus failed', e); }
          try { 
            var doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
             if (doc && doc.body && typeof doc.body.focus === 'function') doc.body.focus();
          } catch (e) { /* cross-origin or not accessible; ignore */ }
          setTimeout(function() {
            try { iframe.focus(); } catch (e) {}
            try { if (iframe.contentWindow && typeof iframe.contentWindow.focus === 'function') iframe.contentWindow.focus(); } catch (e) {}
          }, 50);
        }
      } catch (errFocus) {
        console.warn('focus restore attempted but failed', errFocus);
      }
      console.log('Attempted to focus guest iframe; activeElement is:', document.activeElement);
    } catch (err) {
      console.error('focusGuestIframe failed', err);
    }
  }
}

  return false;
}

  }

        }

        return;
      }
      pokeCursorOn();
      return;
    }

    // Typing clears any active selection (replacing selected text)
    if (SSTART !== -1 && SEND !== -1) {
      // deleteSelection();  // keep your existing deletion routine if needed
    }
    if (SSTART>-1) { pokeSelect(false); SSTART = -1; SEND = -1; }

    // Silent input (echo disabled): store char in buffer, don't display
    if (window.QandyKeyboard) {
      var _cp = QandyKeyboard._pendingState();
      if (_cp && !_cp.echo) {
        _cp.buffer = (_cp.buffer || "") + finalChar;

      }
    }

    LINE = (LINE || "").substring(0, CURP) + finalChar + (LINE || "").substring(CURP);
    CURP += finalChar.length;
    CURX += finalChar.length;
    while (CURX >= W) { CURX -= W; CURY++; if (CURY >= H) { CURY = H - 1; } }

    if (typeof historyIndex !== 'undefined' && historyIndex !== -1) { historyIndex = -1; tempCommand = ""; }
  }

  // No guest script fast-path and not handled above - final housekeeping
  pokeCursorOn();
}

function keyToChar(event) {
  // Special keys
  if (event.key === 'Enter') return '\n';
  if (event.key === 'Tab') return '\t';
  if (event.key === 'Backspace') return '\b';
  if (event.key === 'Escape') return '\x1b';
  
  // Regular character
  if (event.key && event.key.length === 1) return event.key;
  
  // Fallback
  var code = event.charCode || event.keyCode;
  return code ? String.fromCharCode(code) : '';
}

window.press=function(event) { 
  key=""; k=event.keyCode; shift=event.shiftKey;
  if (HOST) { kid="host-"; } else { kid="guest-"; }

  var altActive = !!(alt || altPhysical || altVirtual);
  // Only convert if ALT is pressed WITHOUT SHIFT or CAPS
  if (altActive && !shift && !caps) {
    // WASD → Arrow keys
    if (k === 87) { k = 38; }  // ALT-W → Up (38)
    if (k === 65) { k = 37; }  // ALT-A → Left (37)
    if (k === 83) { k = 40; }  // ALT-S → Down (40)
    if (k === 68) { k = 39; }  // ALT-D → Right (39)
    // QERF → Cursor keys
    if (k === 81) { k = 36; }  // ALT-Q → Home (36)
    if (k === 69) { k = 35; }  // ALT-E → End (35)
    if (k === 82) { k = 33; }  // ALT-R → Page Up (33)
    if (k === 70) { k = 34; }  // ALT-F → Page Down (34)
  }

  if (_inkey_waiting && _inkey_resolve) {
    if (k === 16 || k === 17 || k === 18 || k === 20) return;
    // Don't process function keys (F1-F12: keyCode 112-123)
    if (k >= 112 && k <= 123) return;

    _inkey_waiting = false;
    var char = keyToChar(event);
    var resolve = _inkey_resolve;
    _inkey_resolve = null;
  
    if (char) {
      event.preventDefault && event.preventDefault();
      highlightKey(k);
      resolve(char);
      return;
    }
  }
  if (SOUND && typeof beep === 'function') { try { beep(900, 25, 0.01); } catch (e) {}}
  // Handle physical CapsLock keypress (keyCode 20)
  if (event.keyCode === 20) {
    // Determine the platform state if available
    var platformState = (typeof event.getModifierState === 'function') ? !!event.getModifierState('CapsLock') : null;
    // Compute the new desired caps state:
    // - If platformState is available, use it.
    // - But some browsers report the previous state on keydown; if platformState equals current caps,
    //   assume the toggle has not yet been applied and flip it.
    var newCaps;
    if (platformState === null) {
      newCaps = !caps; // no platform info -> just toggle
    } else {
      newCaps = platformState;
      if (platformState === caps) {
        // likely timing issue -> flip to reflect the user action
        newCaps = !caps;
      }
    }
 
    caps = !!newCaps;  
    l = document.getElementById(kid+"kcaps") || document.getElementById(kid+"caps");
    if (l) {
      if (caps) { l.style.backgroundColor = "#fff"; l.style.color = "#000"; }
      else { l.style.backgroundColor = "#222"; l.style.color = "#fff"; }
    }

    // Cancel any transient flash timeout for the CAPS element so it won't reapply a flash style
    try {
      if (keyTimeouts && keyTimeouts['caps']) { clearTimeout(keyTimeouts['caps']); delete keyTimeouts['caps']; }
      // Also clear any stored flash marker on the element
      if (l) l.dataset._flash = '';
    } catch (e) { /* ignore */ }

    // Ensure label updates
    if (typeof updateKeyLabels === 'function') updateKeyLabels();

    // If we just turned it off, explicitly unhighlight the element (clear inline styles)
    if (!caps) {
      unhighlightKey('caps');
    } else {
      // Ensure locked appearance
      if (l) { l.style.backgroundColor = "#ddd"; l.style.color = "#000"; }
    }

    // Prevent default browser handling side-effects and stop further processing for this key event
    event.preventDefault && event.preventDefault();
    return;
  } 

  if (event.keyCode === 27) { event.preventDefault(); }
  if (event.keyCode === 16) {
    var capsBtn = document.getElementById(kid+"caps");
    if (capsBtn) { capsBtn.style.backgroundColor = "#444"; capsBtn.style.color = "#fff"; }
    updateKeyLabels();
  }
  if (event.keyCode === 17) {
   if (event.source !== 'virtual') {
    if (!ctrl) {
     ctrl=1; ctrlPhysical=true;
     document.getElementById(kid+"ctrl").style.backgroundColor = modifierFlagBgColorPhysical;
     document.getElementById(kid+"ctrl").style.color = modifierFlagFgColor;
    } 
    return;
   }
   // Virtual CTRL: toggle lock and return early
   ctrlVirtual = !ctrlVirtual;
   ctrl = ctrlVirtual ? 1 : 0;
   var elCtrl = document.getElementById(kid+"ctrl");
   if (elCtrl) { elCtrl.style.backgroundColor = ctrlVirtual ? modifierFlagBgColor : modifierFlagBgColorOff; elCtrl.style.color = ctrlVirtual ? modifierFlagFgColor : modifierFlagFgColorOff; }
   if (typeof updateKeyLabels === 'function') updateKeyLabels();
   return;
  }
  if (event.keyCode === 18) {
   if (event.source !== 'virtual') {
    event.preventDefault();
    if (!alt) {
     highlightKey(k);
     alt = 1; altPhysical = true;
     document.getElementById(kid+"alt").style.backgroundColor = modifierFlagBgColor;
     document.getElementById(kid+"alt").style.color = modifierFlagFgColor;
     updateKeyLabels();
    }
    return; // Physical ALT: don't call button()
   }
   // Virtual ALT: toggle lock and return early
   altVirtual = !altVirtual;
   alt = altVirtual ? 1 : 0;
   var elAlt = document.getElementById(kid+"alt");
   if (elAlt) { elAlt.style.backgroundColor = altVirtual ? modifierFlagBgColor : modifierFlagBgColorOff; elAlt.style.color = altVirtual ? modifierFlagFgColor : modifierFlagFgColorOff; }
   if (typeof updateKeyLabels === 'function') updateKeyLabels();
   return;
  }

  // For Ctrl+key combos, pass specific ones through to button() (Ctrl+C, Ctrl+A, Ctrl+V)
  if ((event.ctrlKey || ctrl) && event.source !== 'virtual') {
    var ctrlKey = event.key ? event.key.toLowerCase() : '';
    if (ctrlKey === 'c' || ctrlKey === 'a' || ctrlKey === 'v') {
      if (event.preventDefault && typeof event.preventDefault === 'function') { event.preventDefault(); }
      highlightKey(k);
      button(k, event); 
    }
    // All other ctrl combos: let browser handle
    return;
  }
  if (typeof RUN !== 'undefined' && RUN !== "qandy.js" && typeof keydown === 'function') {
    if (!event.key) { try { event.key = String.fromCharCode(event.keyCode || 0); } catch (e) { event.key = ""; } }
    event.source = event.source || 'physical';
    event.ctrlKey = !!(event.ctrlKey || ctrl);
    event.altKey  = !!(event.altKey  || alt);
    var remappedKeyCode = event.keyCode;
    var keyChar = String.fromCharCode(event.keyCode).toLowerCase();
    
    if (event.altKey || alt) {
      if ((event.shiftKey || shift) && typeof altShiftKeys === 'object' && altShiftKeys.hasOwnProperty(keyChar)) {
        // ALT+SHIFT pressed - use altShiftKeys table
        var newChar = altShiftKeys[keyChar];
        remappedKeyCode = newChar.charCodeAt(0);
      } else if (typeof altKeys === 'object' && altKeys.hasOwnProperty(keyChar)) {
        // ALT only - use altKeys table
        var newChar = altKeys[keyChar];
        remappedKeyCode = newChar.charCodeAt(0);
      }
    }
    
    if (keyboard==true) {
      window.button(event.keyCode, event);
    } else {
      try {
        keydown(remappedKeyCode, event);  // ← Pass remapped keyCode
      } catch (err) {
        // again, what to do with this error?
        // need to terminate running script and alert user
        console.error("Error: keydown() ", err);
      }
      return;
      //event.preventDefault && event.preventDefault();
      //event.stopPropagation && event.stopPropagation();
      // Auto-clear virtual modifier locks after key delivery (one-shot behavior)
      if (ctrlVirtual) { ctrlVirtual = false; ctrl = ctrlPhysical ? 1 : 0; var elCk=document.getElementById(kid+"ctrl"); if (elCk) { elCk.style.backgroundColor = ctrl ? modifierFlagBgColorPhysical : modifierFlagBgColorOff; elCk.style.color = ctrl ? modifierFlagFgColor : modifierFlagFgColorOff; } }
      if (altVirtual) { altVirtual = false; alt = altPhysical ? 1 : 0; var elAk=document.getElementById(kid+"alt"); if (elAk) { elAk.style.backgroundColor = alt ? modifierFlagBgColor : modifierFlagBgColorOff; elAk.style.color = alt ? modifierFlagFgColor : modifierFlagFgColorOff; } if (typeof updateKeyLabels === 'function') updateKeyLabels(); }
      return;
    }
  }
  // Default host behavior: highlight and send to emulator button()
  highlightKey(k);
  button(k, event);
  // Auto-clear virtual modifier locks after key delivery (one-shot behavior)
  // if (ctrlVirtual) { ctrlVirtual = false; ctrl = ctrlPhysical ? 1 : 0; var elCb=document.getElementById(kid+"ctrl"); if (elCb) { elCb.style.backgroundColor = ctrl ? modifierFlagBgColorPhysical : modifierFlagBgColorOff; elCb.style.color = ctrl ? modifierFlagFgColor : modifierFlagFgColorOff; } }
  // if (altVirtual) { altVirtual = false; alt = altPhysical ? 1 : 0; var elAb=document.getElementById(kid+"alt"); if (elAb) { elAb.style.backgroundColor = alt ? modifierFlagBgColor : modifierFlagBgColorOff; elAb.style.color = alt ? modifierFlagFgColor : modifierFlagFgColorOff; } if (typeof updateKeyLabels === 'function') updateKeyLabels(); }
}

window.pressup=function(event) {
  // Prevent browser from handling ALT key - must be done before any conditionals
  if (HOST) { kid="host-"; } else { kid="guest-"; }
  if (event.keyCode === 18 || event.altKey) {
    if (event.source !== 'virtual') { event.preventDefault(); }
  }
  // Handle physical CTRL key release (unhighlight)
  if (event.keyCode === 17 && ctrlPhysical) {
    ctrl = 0;
    ctrlPhysical = false;
    document.getElementById(kid+"ctrl").style.backgroundColor = modifierFlagBgColorOff;
    document.getElementById(kid+"ctrl").style.color = modifierFlagFgColorOff;
    return;
  }
  // Handle physical SHIFT key release (unhighlight CAPS unless caps mode is active)
  if (event.keyCode === 16) {
    shift = 0;
    if (typeof updateKeyLabels === 'function') updateKeyLabels();
    if (!caps) { unhighlightKey('caps'); }
    return;
  }
  // Handle physical ALT key release (unhighlight)
  if (event.keyCode === 18 && altPhysical) {
    alt = 0;
    altPhysical = false;
    document.getElementById(kid+"alt").style.backgroundColor = modifierFlagBgColorOff;
    document.getElementById(kid+"alt").style.color = modifierFlagFgColorOff;
    updateKeyLabels();
    return;
  }
  // Route keyup to active script if RUN is set and not the host
  if (RUN !== "qandy.js" && typeof keyup === 'function') {
    event = event || {};
    if (!event.key) { try { event.key = String.fromCharCode(event.keyCode || 0); } catch (e) { event.key = ""; }}
    // mark source so scripts can tell physical vs synthetic
    event.source = event.source || 'physical';
    try {
      keyup(event.keyCode, event);
  	   // we need way to terminate running script and alert programmer
    } catch (err) {
  	   // what is best thing to do with this error??
      console.log("script keyup() threw:", err);
    }
    return;
  }
}

function formatError(e) {
  if (e == null) return String(e);
  if (typeof e === 'string') return e;
  // Error instances
  if (e instanceof Error) {
    return e.name + (e.message ? ': ' + e.message : '') + (e.stack ? '\n' + e.stack : '');
  }
  // Some environments use .message on non-Error objects
  if (e && typeof e.message === 'string') {
    return (e.name ? (e.name + ': ') : '') + e.message + (e.stack ? '\n' + e.stack : '');
  }
  // Fallback: JSON stringify with circular replacer
  try {
    const seen = new WeakSet();
    return JSON.stringify(e, function(k, v) {
      if (v && typeof v === 'object') {
        if (seen.has(v)) return '[Circular]';
        seen.add(v);
      }
      if (typeof v === 'function') return '[Function]';
      return v;
    }, 2);
  } catch (err) {
    return Object.prototype.toString.call(e);
  }
}

window.waitForCursorIdle=function(timeoutMs) {
  timeoutMs = typeof timeoutMs === 'number' ? timeoutMs : 5000;
  return new Promise(function(resolve) {
    if (!window._pokeCursor_state) return resolve();
    var start = Date.now();
    var iv = setInterval(function() {
      if (!window._pokeCursor_state) {
        clearInterval(iv);
        return resolve();
      }
      if (Date.now() - start > timeoutMs) {
        clearInterval(iv);
        return resolve();
      }
    }, 8);
  });
}

window._qandy_print_queue = window._qandy_print_queue || { items: [], running: false };

async function _processPrintQueue() {
  var q = window._qandy_print_queue;
  if (q.running) return;
  q.running = true;
  try {
    while (q.items.length) {
      var job = q.items.shift();
      // wait for any current paced output to finish
      await waitForCursorIdle();
      // invoke pokeCursor to print this job.text (pokeCursor is async — await it so
      // morePrompt() pauses are respected before resolving the print job)
      try {
        await pokeCursor(job.text);
      } catch (e) {
        // If pokeCursor thrown, still resolve so callers don't hang
      }
      // wait for any residual paced output to finish
      await waitForCursorIdle();
      // resolve the enqueue promise if present
      try { job.resolve(); } catch (e) {}
    }
  } finally {
    q.running = false;
  }
}
