<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qandy Pocket Computer</title>
<link rel="stylesheet" href="qandy.css">
<script>
  var HOST = 1;
  var GUEST = 0;
  var LOG = "Host Booting...\n";
</script>
<script src="qandy-sound.js"></script>
<script src="qandy-video.js"></script>
<script src="qandy-keyboard.js"></script>
<script src="qandy-command.js"></script>
<script src="qandy-core.js"></script>
</head><body>
<div id="txt" class="txt"></div>
<div id="host-keyboard" class="keyboard-container"></div>
<script>
window.qandySignalReady = function(s) {
  LOG += s + " ready\n";
  if (s==='qandy.js') {
    LOG += "All scripts loaded. Auto-powering on drivers...\n";
    if (typeof sound_js === 'function') sound_js();
    if (typeof video_js === 'function') video_js();
    if (typeof keyboard_js === 'function') keyboard_js();
    if (typeof command_js === 'function') command_js();
    if (typeof qandy_js === 'function') qandy_js();
    startup();
  }
};

async function startup() {
  await createGuest();
}

async function qandyGuestHtm() {
  // Use function references from host memory
  var funcs = [sound_js, video_js, keyboard_js, command_js, qandy_js];
  var driverCode = "";
  for (var i = 0; i < funcs.length; i++) {
    var f = funcs[i];
    if (typeof f === 'function') {
      driverCode += f.toString() + ";\n" + f.name + "();\n";
    }
  }
  
  var guestHtml = "<!doctype html><html><head>" +
    "<link rel='stylesheet' href='qandy.css'>" +
    "<script>var HOST=0; var GUEST=1; var LOG='Guest Booting...\\n';</" + "script>" +
    "<script>" + driverCode + "</" + "script>" +
    "</head><body>" +
    "<div id='txt' class='txt'></div>" +
    "<div id='guest-keyboard' class='keyboard-container'></div>" +
    "</body></html>";
    
  return guestHtml;
}

async function createGuest() {
  var html = await qandyGuestHtm();
  var container = document.createElement('div');
  container.id = 'vm-container';
  Object.assign(container.style, { position: 'absolute', left: '0', top: '0', width: '350px', height: '650px', zIndex: '100' });
  var iframe = document.createElement('iframe');
  iframe.id = 'vm-iframe';
  iframe.setAttribute('sandbox', 'allow-scripts allow-modals');
  Object.assign(iframe.style, { width: '100%', height: '100%', border: '0', background: 'transparent' });
  container.appendChild(iframe);
  document.body.appendChild(container);
  var blob = new Blob([html], { type: 'text/html' });
  iframe.src = URL.createObjectURL(blob);
  window._vmIframe = iframe;
}
</script>
</body></html>
