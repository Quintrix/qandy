<script>
    const SECTORS_WIDE = 8, SECTORS_TALL = 8;
    const SECTOR_TILE_WIDTH = 8, SECTOR_TILE_HEIGHT = 12;

    const DEFAULT_MAP_URL = 'capflag.gfx'; // The name of your default map file

    let copiedSectorData = null; // Stores an array of 96 tile codes when a sector is copied
    let copiedSectorLabel = null; // Stores the label of the copied sector (e.g., "A1")

    var TILE_W = 64;
    var TILE_H = 96; 
    var TILE_SIZE = 32; 
    var NOISE_TILES = ['Fa', 'Gb', 'Gc', 'Gd', 'Ge', 'Gf', 'Gg'];

    let mapData = [];
    const imageCache = {}; // Cache for tile images
    const itemCache = {}; // Cache for item images

    // New: Keep track of all unique tile codes encountered for preloading
    const uniqueTileCodes = new Set(); 
    const uniqueItemCodes = new Set();


    let mapHistory = [];
    const MAX_UNDO = 20; // Limit memory usage

    let sectorExits = {};  // Example: { "A1": "A2B1", "A2": "A1A3B2", ... }
    let lastEditedSector = "A1";

    let selection = null; // {x, y, w, h} in tile coordinates
    let isSelecting = false;
    let selectionStart = null; // {x, y}
    let clipboard = "";

    let activeTool = 'brush'; // Options: 'brush', 'path', 'flower'    

    let brush = "Ga";
    let brushSize = 1;
    let brushShape = 'box'; // Options: 'box', 'circle' 

    let flowerMode = false;
    let currentFlowerSet = 'yellow'; // 'yellow', 'white', 'blue'
    let flowerWeights = { primary: 30, variant: 20, weeds: 10 }; // Percentages
    
    let pathMode = 0; // 0: Off, 1: Select Start, 2: Select End
    let pathStartNode = null;
    
    let sectorLOS = {}; // Format: { "A1": "Ga", "B1": "Sa", ... }
    let sectorItems = {}; // Format: { "A1": [{id: "I1", z: "05", data: "01"}, ...] }

    let preservedLines = {}; // NEW: Stores any data/logic lines we don't recognize

    let currentItemCode = "I1";
    let currentItemData = "00";

    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    const brushDisplay = document.getElementById('brushDisplay'); // This element doesn't exist, can remove if not used elsewhere.

    async function initMap() {
        canvas.width = TILE_W * TILE_SIZE;
        canvas.height = TILE_H * TILE_SIZE;

        console.log(`Loading default map: ${DEFAULT_MAP_URL}`);
        try {
            const response = await fetch(DEFAULT_MAP_URL);

            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            const mapText = await response.text();
            processMap(mapText);
            await preloadAllImages(); 
            renderFullMap(); // Render after data is loaded and parsed and images are preloaded
            console.log("Default map loaded and rendered.");

        } catch (error) {
            console.error("Failed to load default map:", error);
            alert("Failed to load default map. Initializing with random noise.");
            // Fallback to random noise if default map fails to load
            for (let y = 0; y < TILE_H; y++) {
                mapData[y] = [];
                for (let x = 0; x < TILE_W; x++) {
                    const tile = NOISE_TILES[Math.floor(Math.random() * NOISE_TILES.length)];
                    mapData[y][x] = tile;
                    uniqueTileCodes.add(tile); // Add to unique codes
                }
            }
            // Fallback: Also preload images if falling back to noise
            await preloadAllImages(); 
            renderFullMap();
        }
    }


async function preloadAllImages() {
    console.log("Preloading images...");
    const imagePromises = [];

    // Preload tile images
    for (const code of uniqueTileCodes) {
        if (!imageCache[code]) {
            const img = new Image();
            img.src = `t/${code}.png`;
            const promise = new Promise((resolve) => {
                img.onload = () => resolve();
                img.onerror = () => { console.warn(`Failed to load tile image: t/${code}.png`); resolve(); }; // Resolve even on error
            });
            imageCache[code] = img;
            imagePromises.push(promise);
        }
    }

    // Preload item images
    for (const id of uniqueItemCodes) {
        if (!itemCache[id]) {
            const img = new Image();
            img.src = `i/${id}.png`;
            const promise = new Promise((resolve) => {
                img.onload = () => resolve();
                img.onerror = () => { console.warn(`Failed to load item image: i/${id}.png`); resolve(); }; // Resolve even on error
            });
            itemCache[id] = img;
            imagePromises.push(promise);
        }
    }

    await Promise.all(imagePromises);
    console.log("All images preloaded.");
}

// Function to fill a sector with the current brush
function fillSectorWithBrush(globalX, globalY) {
    saveHistory(); // Ensure this is inside the mousedown listener or at the start of the action
    for (let y = globalY; y < globalY + SECTOR_TILE_HEIGHT; y++) {
        for (let x = globalX; x < globalX + SECTOR_TILE_WIDTH; x++) {
            if (x >= 0 && x < TILE_W && y >= 0 && y < TILE_H) { // Bounds check for safety
                if (mapData[y][x] !== brush) {
                    mapData[y][x] = brush;
                    drawTile(x, y); // Only redraw changed tiles
                }
            }
        }
    }
    renderFullMap(); // A full render might be cleaner to ensure everything is updated, especially if only drawTile(x,y) is used sparingly.
}

// Function to copy a sector's tiles
function copySector(globalX, globalY, label) {
    copiedSectorData = [];
    for (let y = globalY; y < globalY + SECTOR_TILE_HEIGHT; y++) {
        for (let x = globalX; x < globalX + SECTOR_TILE_WIDTH; x++) {
            if (x >= 0 && x < TILE_W && y >= 0 && y < TILE_H) {
                copiedSectorData.push(mapData[y][x]);
            } else {
                copiedSectorData.push('Ga'); // Fill with default grass if out of bounds (shouldn't happen for valid sectors)
            }
        }
    }
    copiedSectorLabel = label;
    showSectorTool(); // Refresh popup to show copied sector label
    console.log(`Copied sector ${label} (containing ${copiedSectorData.length} tiles).`);
}

// Function to paste a sector's tiles
function pasteSector(globalX, globalY) {
    saveHistory(); // Ensure this is inside the mousedown listener or at the start of the action
    let sourceTiles = copiedSectorData;
    if (!sourceTiles) {
        // If no sector was copied, use default grass
        console.log("No sector copied, pasting default grass.");
        sourceTiles = Array(SECTOR_TILE_WIDTH * SECTOR_TILE_HEIGHT).fill('Ga');
        copiedSectorLabel = "Default Grass"; // Update label for feedback
    }

    let tileIndex = 0;
    for (let y = globalY; y < globalY + SECTOR_TILE_HEIGHT; y++) {
        for (let x = globalX; x < globalX + SECTOR_TILE_WIDTH; x++) {
            if (x >= 0 && x < TILE_W && y >= 0 && y < TILE_H) {
                mapData[y][x] = sourceTiles[tileIndex] || 'Ga'; // Fallback to Ga if sourceTiles is somehow short
            }
            tileIndex++;
        }
    }
    renderFullMap();
    showSectorTool(); // Refresh popup to show confirmation (or updated copied sector label)
    console.log(`Pasted sector at (${globalX}, ${globalY}).`);
}

function applySimpleRiver(start, end) {
    console.log("Generating thick river...");
    
    // Disable walkability constraints so the river can go anywhere
    const originalWalkable = window.isWalkable;
    window.isWalkable = () => true; 

    const path = findPath(start, end);
    window.isWalkable = originalWalkable;

    if (!path) return;

    path.forEach(node => {
        // 1. Draw a core 2x2 block to ensure thickness
        for (let dy = 0; dy <= 1; dy++) {
            for (let dx = 0; dx <= 1; dx++) {
                const nx = node.x + dx;
                const ny = node.y + dy;
                if (nx >= 0 && nx < TILE_W && ny >= 0 && ny < TILE_H) {
                    mapData[ny][nx] = 'Ua';
                }
            }
        }

        // 2. Extra "Stumble" (80% chance to add 1-2 random surrounding tiles)
        if (Math.random() > 0.2) {
            const offsets = [
                {x: -1, y: 0}, {x: 2, y: 0}, 
                {x: 0, y: -1}, {x: 0, y: 2},
                {x: 1, y: -1}, {x: -1, y: 1}
            ];
            // Pick two random offsets for variety
            for (let i = 0; i < 2; i++) {
                const off = offsets[Math.floor(Math.random() * offsets.length)];
                const sx = node.x + off.x;
                const sy = node.y + off.y;
                if (sx >= 0 && sx < TILE_W && sy >= 0 && sy < TILE_H) {
                    mapData[sy][sx] = 'Ua';
                }
            }
        }
    });

    renderFullMap();
}

function solveRiverEdges() {
    saveHistory();
    // Clone map so neighbor checks aren't affected by tiles we change mid-loop
    const tempMap = mapData.map(row => [...row]);

    const isW = (x, y) => {
        if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) return true; 
        const t = tempMap[y][x];
        // Treat both solid water (U) and shore tiles (A) as "Water" for connection logic
        return t.startsWith('U') || t.startsWith('A'); 
    };

    for (let y = 0; y < TILE_H; y++) {
        for (let x = 0; x < TILE_W; x++) {
            // We only care about tiles that are currently water or shore
            if (!isW(x, y)) continue;

            const N = isW(x, y - 1), S = isW(x, y + 1), W = isW(x - 1, y), E = isW(x + 1, y);
            const NW = isW(x - 1, y - 1), NE = isW(x + 1, y - 1), SW = isW(x - 1, y + 1), SE = isW(x + 1, y + 1);

            const cardinalCount = (N?1:0) + (S?1:0) + (W?1:0) + (E?1:0);
            
            let tile = 'Ua'; // Default solid water

            // Flat Shores (One side is land)
            if (cardinalCount === 3) {
                if (!N) tile = 'Aa'; // Grass North
                if (!S) tile = 'Ab'; // Grass South
                if (!E) tile = 'Ac'; // Grass East
                if (!W) tile = 'Ad'; // Grass West
            } 
            // Outer Corners (Two sides are land)
            else if (cardinalCount === 2) {
                if (S && E) tile = 'Ag'; 
                if (S && W) tile = 'Ah';
                if (N && E) tile = 'Ai';
                if (N && W) tile = 'Ae';
            }
            // Inner Corners (All sides water, but diagonal is land)
            else if (cardinalCount === 4) {
                if (!SE) tile = 'Ub';
                if (!SW) tile = 'Uc';
                if (!NE) tile = 'Ud';
                if (!NW) tile = 'Ue';
            }

            mapData[y][x] = tile;
        }
    }
    renderFullMap();
}

function applyDrunkRiver(start, end) {
    let path = findPath(start, end);
    if (!path) {
        alert("No path found! Make sure the start and end aren't blocked by mountains/walls.");
        return;
    }

    saveHistory();

    // Determine thickness based on global brushSize
    const half = Math.floor(brushSize / 2);

    path.forEach(node => {
        // Draw a block centered on the path node
        for (let dy = -half; dy <= half; dy++) {
            for (let dx = -half; dx <= half; dx++) {
                const nx = node.x + dx;
                const ny = node.y + dy;
                
                // Bounds check
                if (nx >= 0 && nx < TILE_W && ny >= 0 && ny < TILE_H) {
                    mapData[ny][nx] = 'Ua'; // Fill with standard solid water
                }
            }
        }
    });

    renderFullMap();
    
    // Reset state for the next river segment
    pathMode = 1; 
    document.getElementById('pathStatus').innerHTML = "River drawn! Click for <b>New River Start</b>.";
}

        imageCache[code] = img;

        img.onload = () => { renderFullMap(); };
        img.onerror = () => { console.warn(`Failed to dynamically load tile: t/${code}.png`); };
      }
      return imageCache[code];
    }   

    function makeDraggable(popup, header) {
        let offsetX = 0, offsetY = 0, isDown = false;
        header.onmousedown = function(e) {
            isDown = true;
            offsetX = e.clientX - popup.offsetLeft;
            offsetY = e.clientY - popup.offsetTop;
            document.onmousemove = function(e) {
                if (!isDown) return;
                popup.style.left = (e.clientX - offsetX) + 'px';
                popup.style.top = (e.clientY - offsetY) + 'px';
            };
            document.onmouseup = function() {
                isDown = false;
                document.onmousemove = null;
            };
        };
    }

function updateBrushSizePreview(val) {
    brushSize = parseInt(val, 10);
    document.getElementById('brushSizeValue').textContent = brushSize;
    
    let out = '<table style="border-collapse:collapse; background:#000;">';
    const half = Math.floor(brushSize / 2);

    for (let dy = -half; dy <= half; dy++) {
        out += '<tr>';
        for (let dx = -half; dx <= half; dx++) {
            let isActive = false;
            
            if (brushShape === 'box') isActive = true;
            else if (brushShape === 'circle') isActive = (dx * dx + dy * dy <= (half * half) + 0.5);
            else if (brushShape === 'diamond') isActive = (Math.abs(dx) + Math.abs(dy) <= half);
            else if (brushShape === 'hline') isActive = (dy === 0);
            else if (brushShape === 'vline') isActive = (dx === 0);
            else if (brushShape === 'triangle') {
                // Triangle math: dy goes from -half to half. 
                // At dy = -half (top), width should be 0. At dy = half (bottom), width is full.
                let rowWidth = (dy + half); 
                isActive = (Math.abs(dx * 2) <= rowWidth);
            }
            
            const color = isActive ? '#0af' : 'transparent';
            out += `<td style="width:4px; height:4px; background:${color};"></td>`;
        }
        out += '</tr>';
    }
    out += '</table>';
    document.getElementById('brushPreview').innerHTML = out;
}

function borders() {

function drawSectorBorders(ctx, tileSize, sectorsWide, sectorsTall, sectorTileWidth, sectorTileHeight) {
    ctx.save();
    const ROWS = ["A","B","C","D","E","F","G","H"];

    for (let r = 0; r < sectorsTall; r++) {
        for (let c = 0; c < sectorsWide; c++) {
            const currentLabel = `${ROWS[r]}${c + 1}`;
            const exits = sectorExits[currentLabel] || "";

            const x = c * sectorTileWidth * tileSize;
            const y = r * sectorTileHeight * tileSize;
            const w = sectorTileWidth * tileSize;
            const h = sectorTileHeight * tileSize;

            // 1. Vertical Border (Check connection to the East/Right neighbor)
            if (c < sectorsWide - 1) {
                const rightNeighbor = `${ROWS[r]}${c + 2}`;
                const neighborExits = sectorExits[rightNeighbor] || "";
                
                // Connection exists if Current labels Right OR Right labels Current
                const canGoNext = exits.includes(rightNeighbor);
                const canComeBack = neighborExits.includes(currentLabel);

                if (canGoNext || canComeBack) {
                    ctx.strokeStyle = 'rgba(255, 255, 0, 0.6)'; // Yellow: Connected
                    ctx.lineWidth = 1;
                } else {
                    ctx.strokeStyle = 'rgba(255, 50, 50, 0.8)';  // Red: Blocked
                    ctx.lineWidth = 3;
                }

                ctx.beginPath();
                ctx.moveTo(x + w, y);
                ctx.lineTo(x + w, y + h);
                ctx.stroke();
            }

            // 2. Horizontal Border (Check connection to the South/Bottom neighbor)
            if (r < sectorsTall - 1) {
                const downNeighbor = `${ROWS[r + 1]}${c + 1}`;
                const neighborExits = sectorExits[downNeighbor] || "";

                const canGoDown = exits.includes(downNeighbor);
                const canComeUp = neighborExits.includes(currentLabel);

                if (canGoDown || canComeUp) {
                    ctx.strokeStyle = 'rgba(255, 255, 0, 0.6)'; // Yellow
                    ctx.lineWidth = 1;
                } else {
                    ctx.strokeStyle = 'rgba(255, 50, 50, 0.8)';  // Red
                    ctx.lineWidth = 3;
                }

                ctx.beginPath();
                ctx.moveTo(x, y + h);
                ctx.lineTo(x + w, y + h);
                ctx.stroke();
            }
        }
    }
    ctx.restore();
}


    function drawTile(x, y) {

function handlePaintAction(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const tileX = Math.floor((clientX - rect.left) / TILE_SIZE);
    const tileY = Math.floor((clientY - rect.top) / TILE_SIZE);

    const half = Math.floor(brushSize / 2);

    for (let dy = -half; dy <= half; dy++) {
        for (let dx = -half; dx <= half; dx++) {
            // SHAPE LOGIC
            let skip = false;
            if (brushShape === 'circle' && (dx * dx + dy * dy > (half * half) + 0.5)) skip = true;
            if (brushShape === 'diamond' && (Math.abs(dx) + Math.abs(dy) > half)) skip = true;
            if (brushShape === 'hline' && dy !== 0) skip = true;
            if (brushShape === 'vline' && dx !== 0) skip = true;
            if (brushShape === 'triangle' && (Math.abs(dx * 2) > (dy + half))) skip = true;

            if (skip) continue;

            const x = tileX + dx;
            const y = tileY + dy;
            if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) continue;
            
            if (activeTool === 'forest') { applyForestSpray(x, y); }
            
            if (activeTool === 'road') { applySmartRoad(x, y); } 

            if (activeTool === 'mountain') {
                applySmartMountain(x, y);
            } else if (activeTool === 'flower') {
                applyFlowerSpray(x, y);
            } else if (activeTool === 'brush') {
                if (mapData[y][x] !== brush) {
                    mapData[y][x] = brush;
                    drawTile(x, y);
                }
            } else if (activeTool === 'path') {
                if (!mapData[y][x].startsWith('B')) mapData[y][x] = 'Ba';
                fixPathTile(x, y);
                fixPathTile(x, y - 1); fixPathTile(x, y + 1);
                fixPathTile(x - 1, y); fixPathTile(x + 1, y);
            }
        }
    }
}

function applyFlowerSpray(x, y) {
    const currentTile = mapData[y][x];
    
    // Constraint: Only spray on Ga-Gg (Grass/Noise)
    const isGrass = currentTile.startsWith('G') || currentTile === 'Fa'; // Fa is also noise in your initMap
    if (!isGrass) return;

    const roll = Math.random() * 100;
    let targetTile = null;

    // Define the tile groups based on your rules
    const sets = {
        yellow: { primary: 'Fa', variant: 'Fe', weeds: 'Gb' },
        white:  { primary: 'Fb', variant: 'Ff', weeds: 'Gb' },
        blue:   { primary: 'Fc', variant: 'Fd', weeds: 'Gb' }
    };

    const config = sets[currentFlowerSet];

    if (roll < flowerWeights.primary) {
        targetTile = config.primary;
    } else if (roll < (flowerWeights.primary + flowerWeights.variant)) {
        targetTile = config.variant;
    } else if (roll < (flowerWeights.primary + flowerWeights.variant + flowerWeights.weeds)) {
        targetTile = config.weeds;
    }

    if (targetTile && mapData[y][x] !== targetTile) {
        mapData[y][x] = targetTile;
        drawTile(x, y);
    }
}

function toggleExit(targetCode) {
    if (!targetCode || targetCode === 'null') return;
    
    let input = document.getElementById('exitsInput');
    let val = input.value.toUpperCase();
    
    // Split string into 2-character chunks
    let parts = val.match(/.{1,2}/g) || [];
    
    if (parts.includes(targetCode)) {
        // Remove it
        parts = parts.filter(p => p !== targetCode);
    } else {
        // Add it (max 6 exits for logic safety, though string can hold more)
        if (parts.length < 6) parts.push(targetCode);
    }
    
    input.value = parts.join("");
    
    // Save immediately to the data object so the UI refresh shows the change
    sectorExits[exitEditSector] = input.value;
    
    // Refresh the popup to update button colors
    showExitsEditor(exitEditSector);

}

function autoCalculateExits(isRound) {
    const ROWS = ["A","B","C","D","E","F","G","H"];
    const rowCount = 12;
    const colCount = 8;
    
    // Clear current exits before recalculating
    sectorExits = {};

    for (let r = 0; r < rowCount; r++) {
        for (let c = 0; c < colCount; c++) {
            const currentLabel = `${ROWS[r]}${c + 1}`;
            let neighbors = [];

            // Directions: North, South, West, East
            const directions = [
                { dr: -1, dc: 0 }, // North
                { dr: 1, dc: 0 },  // South
                { dr: 0, dc: -1 }, // West
                { dr: 0, dc: 1 }   // East
            ];

            directions.forEach(dir => {
                let nr = r + dir.dr;
                let nc = c + dir.dc;

                if (isRound) {
                    // Toroidal Wrap logic: (val + max) % max
                    nr = (nr + rowCount) % rowCount;
                    nc = (nc + colCount) % colCount;
                    neighbors.push(`${ROWS[nr]}${nc + 1}`);
                } else {
                    // Flat Box logic: only push if within bounds
                    if (nr >= 0 && nr < rowCount && nc >= 0 && nc < colCount) {
                        neighbors.push(`${ROWS[nr]}${nc + 1}`);
                    }
                }
            });

            sectorExits[currentLabel] = neighbors.join("");
        }
    }
    
    alert(`Exits calculated for ${isRound ? 'Round' : 'Flat'} world!`);
    renderFullMap();
}

async function processMap(text) {
        console.log('processMap='+text);
        const lines = text.split('\n');
        const ROWS = ["A","B","C","D","E","F","G","H"];
        const SECTOR_W = 8;
        const SECTOR_H = 12;

        // Reset mapData and sectorItems before loading new data
        mapData = []; // Clear existing map
        for (let y = 0; y < TILE_H; y++) { // Re-initialize mapData structure
            mapData[y] = Array(TILE_W).fill('Ga'); // Fill with default grass initially
        }

        sectorExits = {};
        sectorItems = {};
        preservedLines = {}; 
        
        uniqueTileCodes.clear(); // Clear for new import
        uniqueItemCodes.clear(); // Clear for new import

        lines.forEach(line => {
            if (!line.includes('=')) return;

            const [label, allData] = line.trim().split('=');
            if (!label || !allData) return;
            
            const rIndex = ROWS.indexOf(label.charAt(0));
            const cIndex = parseInt(label.substring(1)) - 1;

            if (label.length !== 2 || rIndex === -1 || isNaN(cIndex) || cIndex < 0 || cIndex >= 8) {
                preservedLines[label] = allData;
                return;
            }
            
            if (rIndex === -1 || isNaN(cIndex)) return;
            
            // 1. Split Tiles/Exits from the Objects
            const parts = allData.split('.');
            const mainData = parts[0];     // Contains Tiles (192 chars) + Exits
            const objectData = parts[1] || ""; // Contains ID(2)Z(2)DATA(2):LOGIC, ...

            // 2. Process Tiles (First 192 characters)
            const tilesLength = 96 * 2; 
            const tilesString = mainData.substring(0, tilesLength);
            
            // 3. Process Exits (Everything after the first 192 characters in part 0)
            const exitString = mainData.substring(tilesLength);
            sectorExits[label] = exitString;

            for (let i = 0; i < 96; i++) {
                const tileCode = tilesString.substring(i * 2, (i * 2) + 2);
                const sx = i % SECTOR_W;
                const sy = Math.floor(i / SECTOR_W);
                const globalX = (cIndex * SECTOR_W) + sx;
                const globalY = (rIndex * SECTOR_H) + sy;

                if (globalX < TILE_W && globalY < TILE_H) {
                    mapData[globalY][globalX] = tileCode;
                    uniqueTileCodes.add(tileCode); // Add for preloading
                }
            }

            // 4. Process Objects (Logic-aware)
            if (objectData) {
                sectorItems[label] = [];
                // Split by comma for multiple objects
                const objectChunks = objectData.split(',');
                objectChunks.forEach(chunk => {
                    if (!chunk) return;
                    
                    // Split metadata from logic by colon
                    const [meta, logic] = chunk.split(':');
                    if (meta) {
                        if (meta.length >= 6) {
                            // Static Object (ID + Z + DATA)
                            const item = {
                                id: meta.substring(0, 2),
                                z: meta.substring(2, 4),
                                data: meta.substring(4, 6),
                                logic: logic || ""
                            };
                            sectorItems[label].push(item);
                            uniqueItemCodes.add(item.id);
                        } else if (meta.length >= 4) {
                            // Dynamic Item (ID + Z)
                            const item = {
                                id: meta.substring(0, 2),
                                z: meta.substring(2, 4),
                                data: "", // No data provided
                                logic: logic || ""
                            };
                            sectorItems[label].push(item);
                            uniqueItemCodes.add(item.id);
                        }
                    }
                });
            }
        });

        // After importing new data, preload the new images and then render
        await preloadAllImages(); 
        renderFullMap();
}

function exportMap() {
    const SECTOR_W = 8;
    const SECTOR_H = 12;
    const ROWS = ["A","B","C","D","E","F","G","H"];
    let output = "";

    for (let r = 0; r < SECTORS_TALL; r++) { 
        for (let c = 0; c < SECTORS_WIDE; c++) { 
            const sectorLabel = `${ROWS[r]}${c + 1}`;
            let tilesString = "";

            // 1. Get 192 characters of tile data (96 tiles)
            for (let sy = 0; sy < SECTOR_H; sy++) {
                for (let sx = 0; sx < SECTOR_W; sx++) {
                    const globalX = (c * SECTOR_W) + sx;
                    const globalY = (r * SECTOR_H) + sy;
                    tilesString += mapData[globalY][globalX];
                }
            }

            // 2. Get Exits
            const exits = sectorExits[sectorLabel] || "";
            
            // 3. Get Objects with Logic/Bytecode
            let objectString = "";
            if (sectorItems[sectorLabel] && sectorItems[sectorLabel].length > 0) {
                const objSerialized = sectorItems[sectorLabel].map(it => {
                    let meta = it.id + it.z;
                    // Add 2-character DATA only if it exists and is valid (Static objects)
                    if (it.data && it.data.trim().length === 2) {
                        meta += it.data; 
                    }
                    // Append :logic only if logic actually exists
                    return it.logic ? `${meta}:${it.logic}` : meta;
                }).join(',');
                objectString = "." + objSerialized;
            }
            output += `${sectorLabel}=${tilesString}${exits}${objectString}\n`;
        }
    }
    
    alert(preservedLines);
    
    for (const [key, value] of Object.entries(preservedLines)) {
        output += `${key}=${value}\n`;
    }


    navigator.clipboard.writeText(output.trim()).then(() => {
        alert("Map exported to clipboard in Object-compatible format!");
    }).catch(err => {
        console.error('Error copying to clipboard', err);
    });
}

function fixPathTile(x, y) {
    if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) return;
    
    // Only "fix" tiles that are already paths
    if (!mapData[y][x].startsWith('B')) return;

    const isP = (nx, ny) => {
        if (nx < 0 || nx >= TILE_W || ny < 0 || ny >= TILE_H) return false;
        return mapData[ny][nx].startsWith('B');
    };

    const n = isP(x, y - 1), s = isP(x, y + 1), w = isP(x - 1, y), e = isP(x + 1, y);
    let tile = 'Ba'; // Default vertical

    if (n && s && e && w) tile = 'Bc';
    else if (n && s && w) tile = 'Bh';
    else if (n && s && e) tile = 'Bi';
    else if (w && e && n) tile = 'Bj'; // Assuming Bj is T-junction North
    else if (w && e && s) tile = 'Bk'; // Assuming Bk is T-junction South
    else if (n && s) tile = 'Ba';
    else if (e && w) tile = 'Bb';
    else if (n && w) tile = 'Bd';
    else if (n && e) tile = 'Be';
    else if (s && e) tile = 'Bf';
    else if (s && w) tile = 'Bg';
    else if (n) tile = 'Bm';
    else if (s) tile = 'Bn';
    else if (e) tile = 'Bk';
    else if (w) tile = 'Bl';

    mapData[y][x] = tile;
    drawTile(x, y);
}

function isWalkable(tileCode) {
    // Walkable: Aa-Lz. Blocked: Ma and above.
    return tileCode < "Ma"; 
}

function findPath(start, end) {
    const openSet = [start];
    const cameFrom = new Map();
    const gScore = new Map();
    const fScore = new Map();

    const posKey = (p) => `${p.x},${p.y}`;
    
    gScore.set(posKey(start), 0);
    fScore.set(posKey(start), Math.abs(start.x - end.x) + Math.abs(start.y - end.y));

    while (openSet.length > 0) {
        // Get node with lowest fScore
        openSet.sort((a, b) => fScore.get(posKey(a)) - fScore.get(posKey(b)));
        let current = openSet.shift();

        if (current.x === end.x && current.y === end.y) {
            const path = [];
            while (current) {
                path.push(current);
                current = cameFrom.get(posKey(current));
            }
            return path.reverse();
        }

        const neighbors = [
            {x: current.x, y: current.y - 1}, {x: current.x, y: current.y + 1},
            {x: current.x - 1, y: current.y}, {x: current.x + 1, y: current.y}
        ];

        for (let neighbor of neighbors) {
            if (neighbor.x < 0 || neighbor.x >= TILE_W || neighbor.y < 0 || neighbor.y >= TILE_H) continue;
            if (!isWalkable(mapData[neighbor.y][neighbor.x])) continue;

            // "Stumble" Logic: Add a tiny random weight (0 to 0.2) to make paths less robotic
            let tentativeG = gScore.get(posKey(current)) + 1 + (Math.random() * 0.2);

            if (!gScore.has(posKey(neighbor)) || tentativeG < gScore.get(posKey(neighbor))) {
                cameFrom.set(posKey(neighbor), current);
                gScore.set(posKey(neighbor), tentativeG);
                fScore.set(posKey(neighbor), tentativeG + Math.abs(neighbor.x - end.x) + Math.abs(neighbor.y - end.y));
                if (!openSet.find(p => p.x === neighbor.x && p.y === neighbor.y)) {
                    openSet.push(neighbor);
                }
            }
        }
    }
    return null; // No path found
}

function applyPathToMap(path) {
    for (let i = 0; i < path.length; i++) {
        let curr = path[i];
        let prev = path[i - 1];
        let next = path[i + 1];

        let connections = { n: false, s: false, e: false, w: false };

        // Determine directions for current tile
        if (prev) {
            if (prev.y < curr.y) connections.n = true;
            if (prev.y > curr.y) connections.s = true;
            if (prev.x < curr.x) connections.w = true;
            if (prev.x > curr.x) connections.e = true;
        }
        if (next) {
            if (next.y < curr.y) connections.n = true;
            if (next.y > curr.y) connections.s = true;
            if (next.x < curr.x) connections.w = true;
            if (next.x > curr.x) connections.e = true;
        }

        // Logic for "Pro" Junction Merging
        let existing = mapData[curr.y][curr.x];
        if (existing.startsWith('B')) {
            // Add existing connections to our new path tile
            if (existing === 'Ba') { connections.n = true; connections.s = true; }
            if (existing === 'Bb') { connections.e = true; connections.w = true; }
            // ... add more logic here to detect existing corners if desired
        }

        let tile = 'Ba'; // Default
        const {n, s, e, w} = connections;

        // Selection Logic
        if (n && s && e && w) tile = 'Bc';
        else if (n && s && w) tile = 'Bh';
        else if (n && s && e) tile = 'Bi';
        else if (n && s) tile = 'Ba';
        else if (e && w) tile = 'Bb';
        else if (n && w) tile = 'Bd';
        else if (n && e) tile = 'Be';
        else if (s && e) tile = 'Bf';
        else if (s && w) tile = 'Bg';
        // Caps/Starts
        else if (n) tile = 'Bm';
        else if (s) tile = 'Bn';
        else if (e) tile = 'Bk';
        else if (w) tile = 'Bl';

        mapData[curr.y][curr.x] = tile;
    }
    renderFullMap();
}

// Helper to check if a tile is part of a mountain
function isMountain(x, y) {
    if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) return false;
    return mapData[y][x].startsWith('S');
}

function getSmartMountainTile(x, y) {
    const N = isMountain(x, y - 1);
    const S = isMountain(x, y + 1);
    const W = isMountain(x - 1, y);
    const E = isMountain(x + 1, y);

    // 1. Vertical Priority (Top/Bottom)
    if (!N && S) return 'Sb'; // It's a Peak (nothing above, mountain below)
    if (N && !S) return 'Sf'; // It's a Base (mountain above, nothing below)

    // 2. Horizontal Priority (Left/Right)
    if (!W && E) return 'Sc'; // It's a Left Edge
    if (W && !E) return 'Se'; // It's a Right Edge (User's corrected 'Se')

    // 3. Center or Isolated
    if (N && S && W && E) return 'Sd'; // Solid Center
    
    // Default for single tiles or complex junctions
    return 'Sb'; 
}

function applySmartMountain(x, y) {
    // 1. Mark the current tile as mountain so neighbors can see it
    mapData[y][x] = 'Sd'; 

    // 2. Define the area to "Heal" (the clicked tile + its 4 cardinal neighbors)
    const pointsToUpdate = [
        {x: x, y: y},
        {x: x, y: y - 1}, {x: x, y: y + 1},
        {x: x - 1, y: y}, {x: x + 1, y: y}
    ];

    // 3. Recalculate each tile in that area
    pointsToUpdate.forEach(p => {
        if (isMountain(p.x, p.y)) {
            const newTile = getSmartMountainTile(p.x, p.y);
            if (mapData[p.y][p.x] !== newTile) {
                mapData[p.y][p.x] = newTile;
                drawTile(p.x, p.y);
            }
        }
    });
}

        ctx.strokeStyle = '#0af';
        ctx.lineWidth = 2;

        ctx.strokeRect(
            selection.x * TILE_SIZE, 
            selection.y * TILE_SIZE, 
            selection.w * TILE_SIZE, 
            selection.h * TILE_SIZE
        );
        ctx.setLineDash([]); // Reset dash
    }

    drawSectorBorders(ctx, TILE_SIZE, SECTORS_WIDE, SECTORS_TALL, SECTOR_TILE_WIDTH, SECTOR_TILE_HEIGHT);
}

// Pastes text from the textarea onto the map starting at the selection's top-left
function applyStampToSelection() {
    const text = document.getElementById('stampInput').value.trim();
    if (!text) {
        document.getElementById('stampStatus').innerText = "Nothing to paste!";
        return;
    }
    if (!selection) {
        alert("Click or drag on the map to set the paste origin.");
        return;
    }

    saveHistory();
    
    // We use selection.x/y as the strict top-left origin
    const originX = selection.x;
    const originY = selection.y;

    const lines = text.split('\n');
    lines.forEach((line, dy) => {
        // Strip spaces/tabs but keep the 2-char codes
        const cleanLine = line.replace(/\s+/g, '');
        const tiles = cleanLine.match(/.{1,2}/g); 
        
        if (tiles) {
            tiles.forEach((code, dx) => {
                const gx = originX + dx;
                const gy = originY + dy;
                
                // Overflow Check: Paste everywhere as long as it's on the map
                if (gx >= 0 && gx < TILE_W && gy >= 0 && gy < TILE_H) {
                    mapData[gy][gx] = code;
                }
            });
        }
    });
    
    document.getElementById('stampStatus').innerText = "Pasted at (" + originX + "," + originY + ")";
    renderFullMap();
}
function updateStampData() {
    const text = document.getElementById('stampInput').value.trim();
    if (!text) return;

    const lines = text.split('\n');
    currentStamp = lines.map(line => {
        // Remove all whitespace and match 2-character pairs
        const cleanLine = line.replace(/\s+/g, '');
        const matches = cleanLine.match(/.{1,2}/g);
        return matches || [];
    });

    const height = currentStamp.length;
    const width = currentStamp[0] ? currentStamp[0].length : 0;
    document.getElementById('stampStatus').innerText = `Loaded: ${width}x${height} stamp. Click map to place.`;
}

function applyStamp(tx, ty) {
    if (currentStamp.length === 0) return;
    
    saveHistory(); // Ensure undo works
    for (let y = 0; y < currentStamp.length; y++) {
        for (let x = 0; x < currentStamp[y].length; x++) {
            const gx = tx + x;
            const gy = ty + y;
            // Bounds check
            if (gx >= 0 && gx < TILE_W && gy >= 0 && gy < TILE_H) {
                mapData[gy][gx] = currentStamp[y][x];
            }
        }
    }
    renderFullMap();
}

let currentForestSet = 'all'; // 'green', 'white', 'red', 'all'
let forestDensity = 15; // Percentage chance to spawn a tree per tile per frame

    activeTool = 'forest';

    popup.innerHTML = `
        <div id="toolPopupHeader" style="cursor:move; background:#2d5a27; padding:8px; border-radius:6px 6px 0 0; font-weight:bold;">
            Forest Sprayer (2-Tile Trees)
            <span style="float:right;cursor:pointer;" onclick="document.getElementById('toolPopup').style.display='none'">✕</span>
        </div>
        <div style="padding:14px;">
            <div style="margin-bottom:12px;">
                <b>Tree Type:</b><br>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px; margin-top:5px;">
                    <button onclick="setForestSet('green')" style="${currentForestSet==='green'?'background:#2ecc71;':''}">Green</button>
                    <button onclick="setForestSet('white')" style="${currentForestSet==='white'?'background:#ecf0f1;color:#333':''}">White</button>
                    <button onclick="setForestSet('red')" style="${currentForestSet==='red'?'background:#e74c3c;':''}">Red</button>
                    <button onclick="setForestSet('all')" style="${currentForestSet==='all'?'background:#f1c40f;color:#333':''}">Mixed</button>
                </div>
            </div>
            
            <div style="margin-bottom:10px;">
                <b>Spray Density:</b><br>
                <input type="range" min="1" max="50" value="${forestDensity}" oninput="forestDensity=parseInt(this.value)">
            </div>
            
            <p style="font-size:0.8em; color:#aaa;">Requires 1x2 vertical grass space. Base (Ra/Rp) + Top (Rb/Rc/Rd).</p>
            <button onclick="activeTool='brush'; document.getElementById('toolPopup').style.display='none'">Done</button>
        </div>
    `;
    popup.style.display = "block";
    makeDraggable(popup, document.getElementById('toolPopupHeader'));
}

function setForestSet(set) {
    currentForestSet = set;
    showForestTool();
}

function applyForestSpray(x, y) {
    // 1. Density Check
    if (Math.random() * 100 > forestDensity) return;

    // 2. Bounds Check (Need space for the top)
    if (y < 1) return;

    // 3. Terrain Check (Both current tile and tile above must be grass/noise)
    const isG = (tx, ty) => {
        const code = mapData[ty][tx];
        return code.startsWith('G') || code === 'Fa'; 
    };

    if (!isG(x, y) || !isG(x, y - 1)) return;

    // 4. Determine Tree Type
    let type = currentForestSet;
    if (type === 'all') {
        const roll = Math.random();
        if (roll < 0.6) type = 'green';
        else if (roll < 0.8) type = 'white';
        else type = 'red';
    }

    let topTile = 'Rb'; // Default Green
    let baseTile = 'Ra'; // Default Base

    if (type === 'white') topTile = 'Rc';
    if (type === 'red') {
        topTile = 'Rd';
        // Special rule: Rp is a variant base for Red trees (15% chance)
        if (Math.random() < 0.15) baseTile = 'Rp';
    }

    // 5. Apply
    mapData[y][x] = baseTile;      // Place base at click
    mapData[y - 1][x] = topTile;   // Place top above
    drawTile(x, y);
    drawTile(x, y - 1);
}

// Check if a tile is part of the brick series (Ea-Ei)
function isBrick(x, y) {
    if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) return false;
    return mapData[y][x].startsWith('E');
}

function getSmartBrickTile(x, y) {
    const N = isBrick(x, y - 1);
    const S = isBrick(x, y + 1);
    const W = isBrick(x - 1, y);
    const E = isBrick(x + 1, y);

    // 1. Corners (Diagonal Splits)
    if (!N && !W && S && E) return 'Ef'; // Top-Left corner (TL=Grass, BR=Bricks)
    if (!N && !E && S && W) return 'Ei'; // Top-Right corner (TR=Grass, BL=Bricks)
    if (!S && !W && N && E) return 'Eh'; // Bottom-Left corner (BL=Grass, TR=Bricks)
    if (!S && !E && N && W) return 'Eg'; // Bottom-Right corner (BR=Grass, TL=Bricks)

    // 2. Straight Edges
    if (!N && S) return 'Ed'; // Top edge (Grass on top)
    if (!S && N) return 'Ee'; // Bottom edge (Grass on bottom)
    if (!W && E) return 'Eb'; // Left edge (Grass on left)
    if (!E && W) return 'Ec'; // Right edge (Grass on right)

    // 3. Center or Isolated
    return 'Ea'; // All bricks
}

function applySmartRoad(x, y) {
    // 1. Temporarily set to center bricks
    mapData[y][x] = 'Ea'; 

    // 2. Heal target and 4 neighbors
    const pointsToUpdate = [
        {x: x, y: y},
        {x: x, y: y - 1}, {x: x, y: y + 1},
        {x: x - 1, y: y}, {x: x + 1, y: y}
    ];

    pointsToUpdate.forEach(p => {
        if (isBrick(p.x, p.y)) {
            mapData[p.y][p.x] = getSmartBrickTile(p.x, p.y);
            drawTile(p.x, p.y);
        }
    });
}
