            }
        }

    }

function applySimpleRiver(start, end) {
    console.log("Generating thick river...");
    
    // Disable walkability constraints so the river can go anywhere
    const originalWalkable = window.isWalkable;
    window.isWalkable = () => true; 

    const path = findPath(start, end);
    window.isWalkable = originalWalkable;

    if (!path) return;

    path.forEach(node => {
        // 1. Draw a core 2x2 block to ensure thickness
        for (let dy = 0; dy <= 1; dy++) {
            for (let dx = 0; dx <= 1; dx++) {
                const nx = node.x + dx;
                const ny = node.y + dy;
                if (nx >= 0 && nx < TILE_W && ny >= 0 && ny < TILE_H) {
                    mapData[ny][nx] = 'Ua';
                }
            }
        }

        // 2. Extra "Stumble" (80% chance to add 1-2 random surrounding tiles)
        if (Math.random() > 0.2) {
            const offsets = [
                {x: -1, y: 0}, {x: 2, y: 0}, 
                {x: 0, y: -1}, {x: 0, y: 2},
                {x: 1, y: -1}, {x: -1, y: 1}
            ];
            // Pick two random offsets for variety
            for (let i = 0; i < 2; i++) {
                const off = offsets[Math.floor(Math.random() * offsets.length)];
                const sx = node.x + off.x;
                const sy = node.y + off.y;
                if (sx >= 0 && sx < TILE_W && sy >= 0 && sy < TILE_H) {
                    mapData[sy][sx] = 'Ua';
                }
            }
        }
    });

    renderFullMap();
}
function solveRiverEdges() {
    // Clone map so neighbor checks don't cascade and mess up calculations mid-loop
    const tempMap = mapData.map(row => [...row]);

    // Helper: Is this coordinate Water? 
    // We treat off-screen tiles as water so rivers flow cleanly off the map edges.
    const isW = (x, y) => {
        if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) return true; 
        const t = tempMap[y][x];
        return t.startsWith('U') || t.startsWith('A'); 
    };

    for (let y = 0; y < TILE_H; y++) {
        for (let x = 0; x < TILE_W; x++) {
            // ONLY shape tiles that are already part of the water mass
            if (!isW(x, y)) continue;

            // Check 4 Cardinal Directions
            const N = isW(x, y - 1);
            const S = isW(x, y + 1);
            const W = isW(x - 1, y);
            const E = isW(x + 1, y);
            
            // Check 4 Diagonal Directions
            const NW = isW(x - 1, y - 1);
            const NE = isW(x + 1, y - 1);
            const SW = isW(x - 1, y + 1);
            const SE = isW(x + 1, y + 1);

            // Count how many cardinal water neighbors this tile has
            const edges = (N?1:0) + (S?1:0) + (W?1:0) + (E?1:0);
            
            let tile = 'Ua'; // Default to full water

            if (edges === 3) {
                // Flat Shores (Grass is touching exactly one side)
                if (!N) tile = 'Aa'; // Grass North (GG/WW)
                if (!S) tile = 'Ab'; // Grass South (WW/GG) - Assumed
                if (!E) tile = 'Ac'; // Grass East -> Water West (WG/WG)
                if (!W) tile = 'Ad'; // Grass West -> Water East (GW/GW)
            } 
            else if (edges === 2) {
                // Outer Corners (Grass is eating two sides of the tile)
                if (N && W) tile = 'Ae'; // Water in Top-Left (WG/GG)
                if (S && E) tile = 'Ag'; // Water in Bottom-Right (GG/WG)
                if (S && W) tile = 'Ah'; // Water in Bottom-Left (GG/GW) - Assumed
                if (N && E) tile = 'Ai'; // Water in Top-Right (GW/GG) - Assumed
            }
            else if (edges === 4) {
                // Inner Corners (Water on all 4 sides, but Grass peeking in from a diagonal)
                if (!SE) tile = 'Ub'; // Grass Bottom-Right (WW/WG)
                if (!SW) tile = 'Uc'; // Grass Bottom-Left (WW/GW)
                if (!NE) tile = 'Ud'; // Grass Top-Right (WG/WW)
                if (!NW) tile = 'Ue'; // Grass Top-Left (GW/WW)
            }
            // If edges === 1 or 0, it remains 'Ua' (a dead end or a 1x1 puddle)

            mapData[y][x] = tile;
        }
    }
    renderFullMap();
}

function applyDrunkRiver(start, end) {
    let path = findPath(start, end);
    if (!path) return;

    // Stage 1: The "Drunk" filling
    path.forEach(node => {
        mapData[node.y][node.x] = 'Ua';
        // Randomly widen the river
        if (Math.random() > 0.5) {
            const neighbors = [{x:1,y:0}, {x:-1,y:0}, {x:0,y:1}, {x:0,y:-1}];
            const rand = neighbors[Math.floor(Math.random()*4)];
            if (mapData[node.y + rand.y]?.[node.x + rand.x]) {
                mapData[node.y + rand.y][node.x + rand.x] = 'Ua';
            }
        }
    });

    // Stage 2: The Edge Filter
    solveRiverEdges();
    exitPathMode();
}

    function getTileImage(code) {
        if (imageCache[code]) return imageCache[code];
        const img = new Image();
        img.src = `t/${code}.png`;
        img.onload = () => renderFullMap(); 
        imageCache[code] = img;
        return img;
    }

    function makeDraggable(popup, header) {
        let offsetX = 0, offsetY = 0, isDown = false;
        header.onmousedown = function(e) {
            isDown = true;
            offsetX = e.clientX - popup.offsetLeft;
            offsetY = e.clientY - popup.offsetTop;
            document.onmousemove = function(e) {
                if (!isDown) return;
                popup.style.left = (e.clientX - offsetX) + 'px';
                popup.style.top = (e.clientY - offsetY) + 'px';
            };
            document.onmouseup = function() {
                isDown = false;
                document.onmousemove = null;
            };
        };
    }

function bigbrush() {
    activeTool = 'brush'; // Selecting the brush automatically disables others

    const group = brush[0];
    const groupTiles = Array.from({length: 16}, (_, i) => group + String.fromCharCode(97 + i));

    const tileButtons = groupTiles.map(code =>

function setBrushShape(s) {
    brushShape = s;
    bigbrush(); // Refresh popup to show active button
}
    function setBrush(code) {
      brush = code;
      updateBrushUI();
      bigbrush(); // re-show popup with new tile highlighted
    }

function updateBrushSizePreview(val) {
    brushSize = parseInt(val, 10);
    document.getElementById('brushSizeValue').textContent = brushSize;
    
    let out = '<table style="border-collapse:collapse; background:#000;">';
    const half = Math.floor(brushSize / 2);
    const radiusSq = half * half;

    for (let dy = -half; dy <= half; dy++) {
        out += '<tr>';
        for (let dx = -half; dx <= half; dx++) {
            let isActive = true;
            if (brushShape === 'circle') {
                // Euclidean distance check for rounding
                if (dx * dx + dy * dy > radiusSq + 0.1) isActive = false;
            }
            
            const color = isActive ? '#0af' : 'transparent';
            const border = isActive ? '1px solid #444' : 'none';
            out += `<td style="width:12px; height:12px; background:${color}; border:${border};"></td>`;
        }
        out += '</tr>';
    }
    out += '</table>';
    document.getElementById('brushPreview').innerHTML = out;
}

    function borders() {
      drawSectorBorders(ctx, TILE_SIZE, SECTORS_WIDE, SECTORS_TALL, SECTOR_TILE_WIDTH, SECTOR_TILE_HEIGHT);
    }

    function drawSectorBorders(ctx, tileSize, sectorsWide, sectorsTall, sectorTileWidth, sectorTileHeight) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 0, 0.4)';
        ctx.lineWidth = 1;
        for (let sx = 1; sx < sectorsWide; sx++) {
            const x = sx * sectorTileWidth * tileSize;
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let sy = 1; sy < sectorsTall; sy++) {
            const y = sy * sectorTileHeight * tileSize;
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }
        ctx.restore();
    }

    function drawTile(x, y) {
        if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) return;
        const code = mapData[y][x];
        const img = getTileImage(code);
        ctx.fillStyle = '#000';
        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        if (img.complete && img.naturalWidth !== 0) {
            ctx.drawImage(img, x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        } else {
            ctx.strokeStyle = '#333';
            ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        }
    }

    // Consolidated Paint Logic
    let isPainting = false;

function handlePaintAction(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const tileX = Math.floor((clientX - rect.left) / TILE_SIZE);
    const tileY = Math.floor((clientY - rect.top) / TILE_SIZE);

    const half = Math.floor(brushSize / 2);
    const radiusSq = half * half;

    for (let dy = -half; dy <= half; dy++) {
        for (let dx = -half; dx <= half; dx++) {
            if (brushShape === 'circle' && (dx * dx + dy * dy > radiusSq + 0.1)) continue;

            const x = tileX + dx;
            const y = tileY + dy;
            if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) continue;

            // Switch behavior based on activeTool

            if (activeTool === 'mountain') {
                applySmartMountain(x, y);
            } else if (activeTool === 'flower') {
                applyFlowerSpray(x, y);
            } else if (activeTool === 'brush') {
                if (mapData[y][x] !== brush) {
                    mapData[y][x] = brush;
                    drawTile(x, y);
                }
            }
            // Note: 'path' is handled by the mousedown listener, not the drag/paint action
        }
    }
}

    document.querySelectorAll('#toolbar button').forEach(btn => btn.classList.remove('active-tool'));

}

}

function applyFlowerSpray(x, y) {
    const currentTile = mapData[y][x];
    
    // Constraint: Only spray on Ga-Gg (Grass/Noise)
    const isGrass = currentTile.startsWith('G') || currentTile === 'Fa'; // Fa is also noise in your initMap
    if (!isGrass) return;

    const roll = Math.random() * 100;
    let targetTile = null;

    // Define the tile groups based on your rules
    const sets = {
        yellow: { primary: 'Fa', variant: 'Fe', weeds: 'Gb' },
        white:  { primary: 'Fb', variant: 'Ff', weeds: 'Gb' },
        blue:   { primary: 'Fc', variant: 'Fd', weeds: 'Gb' }
    };

    const config = sets[currentFlowerSet];

    if (roll < flowerWeights.primary) {
        targetTile = config.primary;
    } else if (roll < (flowerWeights.primary + flowerWeights.variant)) {
        targetTile = config.variant;
    } else if (roll < (flowerWeights.primary + flowerWeights.variant + flowerWeights.weeds)) {
        targetTile = config.weeds;
    }

    if (targetTile && mapData[y][x] !== targetTile) {
        mapData[y][x] = targetTile;
        drawTile(x, y);
    }
}

canvas.addEventListener('mousedown', (e) => {
    saveHistory();
    const rect = canvas.getBoundingClientRect();
    const tx = Math.floor((e.clientX - rect.left) / TILE_SIZE);
    const ty = Math.floor((e.clientY - rect.top) / TILE_SIZE);

    if (activeTool === 'stamp' && e.button === 0) {
        applyStamp(tx, ty);
        return; 
    }

    if (activeTool === 'select') {
        isSelecting = true;
        selectionStart = { x: tx, y: ty };
        selection = { x: tx, y: ty, w: 1, h: 1 };
        return;
    }

// Generates the 4 "natural" exits (within map bounds) for a sector
function resetExitsToNatural(sectorLabel) {
    const ROWS = ["A","B","C","D","E","F","G","H","I","J","K","L"];
    let rowChar = sectorLabel.charAt(0), colNum = parseInt(sectorLabel.slice(1));
    let r = ROWS.indexOf(rowChar), c = colNum - 1;
    let exits = "";
    if (r > 0) exits += `${ROWS[r-1]}${c+1}`;
    if (r < 11) exits += `${ROWS[r+1]}${c+1}`;
    if (c > 0) exits += `${ROWS[r]}${c}`;
    if (c < 7) exits += `${ROWS[r]}${c+2}`;
    document.getElementById('exitsInput').value = exits;
    validateExitsInput();
}

async function importMap() {
    try {
        const text = await navigator.clipboard.readText();
        if (!text) return;

        const lines = text.split('\n');
        const ROWS = ["A","B","C","D","E","F","G","H","I","J","K","L"];
        const SECTOR_W = 8;
        const SECTOR_H = 12;

        lines.forEach(line => {
            if (!line.includes('=')) return;

            // Split "A1=[tiles][exits]"
            const [label, data] = line.trim().split('=');
            if (!label || !data) return;
            
            // Parse sector indices
            const rowChar = label.charAt(0);
            const colNum = parseInt(label.substring(1));
            const rIndex = ROWS.indexOf(rowChar);
            const cIndex = colNum - 1;
            if (rIndex === -1 || isNaN(cIndex)) return;

            // --- Extract and store exits after tiles ---
            const tilesLength = 96 * 2; // 192 chars for 96 tiles, each 2 chars
            const tilesString = data.substring(0, tilesLength);
            const exitString = data.substring(tilesLength); // may be "" if no exits were saved (old format)

            // Store exits using sector codes (label) or by [r][c] as needed
            sectorExits[label] = exitString; // e.g. sectorExits["A1"] = "A2B1"

            // --- Process tiles ---
            for (let i = 0; i < 96; i++) {
                const tileCode = tilesString.substring(i * 2, (i * 2) + 2);

                // Local tile coords in sector
                const sx = i % SECTOR_W;
                const sy = Math.floor(i / SECTOR_W);

                // Map to global grid
                const globalX = (cIndex * SECTOR_W) + sx;
                const globalY = (rIndex * SECTOR_H) + sy;

                if (globalX < TILE_W && globalY < TILE_H) {
                    mapData[globalY][globalX] = tileCode;
                }
            }
        });

        // Optionally: update UI to reflect exits here

        renderFullMap();
        alert("Map imported successfully!");

    } catch (err) {
        console.error('Failed to read clipboard:', err);
        alert("Failed to import. Make sure you've granted clipboard permissions.");
    }
}

    // Export logic
function exportMap() {
    const SECTOR_W = 8;
    const SECTOR_H = 12;
    const ROWS = ["A","B","C","D","E","F","G","H","I","J","K","L"];
    let output = "";

    for (let r = 0; r < 12; r++) { // Vertical sectors
        for (let c = 0; c < 8; c++) { // Horizontal sectors
            const sectorLabel = `${ROWS[r]}${c + 1}`;
            let sectorString = "";

            // Get tiles in this sector
            for (let sy = 0; sy < SECTOR_H; sy++) {
                for (let sx = 0; sx < SECTOR_W; sx++) {
                    const globalX = (c * SECTOR_W) + sx;
                    const globalY = (r * SECTOR_H) + sy;
                    sectorString += mapData[globalY][globalX];
                }
            }

            // --- Add the exits string ---
            var exits = sectorExits[sectorLabel] || ""; // fallback to "" if undefined
            output += `${sectorLabel}=${sectorString}${exits}\n`;
        }
    }

    navigator.clipboard.writeText(output.trim()).then(() => {
        alert("Map exported to clipboard!");
    }).catch(err => {
        console.error('Error copying to clipboard', err);
    });
}

function isWalkable(tileCode) {
    // Walkable: Aa-Lz. Blocked: Ma and above.
    return tileCode < "Ma"; 
}

function findPath(start, end) {
    const openSet = [start];
    const cameFrom = new Map();
    const gScore = new Map();
    const fScore = new Map();

    const posKey = (p) => `${p.x},${p.y}`;
    
    gScore.set(posKey(start), 0);
    fScore.set(posKey(start), Math.abs(start.x - end.x) + Math.abs(start.y - end.y));

    while (openSet.length > 0) {
        // Get node with lowest fScore
        openSet.sort((a, b) => fScore.get(posKey(a)) - fScore.get(posKey(b)));
        let current = openSet.shift();

        if (current.x === end.x && current.y === end.y) {
            const path = [];
            while (current) {
                path.push(current);
                current = cameFrom.get(posKey(current));
            }
            return path.reverse();
        }

        const neighbors = [
            {x: current.x, y: current.y - 1}, {x: current.x, y: current.y + 1},
            {x: current.x - 1, y: current.y}, {x: current.x + 1, y: current.y}
        ];

        for (let neighbor of neighbors) {
            if (neighbor.x < 0 || neighbor.x >= TILE_W || neighbor.y < 0 || neighbor.y >= TILE_H) continue;
            if (!isWalkable(mapData[neighbor.y][neighbor.x])) continue;

            // "Stumble" Logic: Add a tiny random weight (0 to 0.2) to make paths less robotic
            let tentativeG = gScore.get(posKey(current)) + 1 + (Math.random() * 0.2);

            if (!gScore.has(posKey(neighbor)) || tentativeG < gScore.get(posKey(neighbor))) {
                cameFrom.set(posKey(neighbor), current);
                gScore.set(posKey(neighbor), tentativeG);
                fScore.set(posKey(neighbor), tentativeG + Math.abs(neighbor.x - end.x) + Math.abs(neighbor.y - end.y));
                if (!openSet.find(p => p.x === neighbor.x && p.y === neighbor.y)) {
                    openSet.push(neighbor);
                }
            }
        }
    }
    return null; // No path found
}

function applyPathToMap(path) {
    for (let i = 0; i < path.length; i++) {
        let curr = path[i];
        let prev = path[i - 1];
        let next = path[i + 1];

        let connections = { n: false, s: false, e: false, w: false };

        // Determine directions for current tile
        if (prev) {
            if (prev.y < curr.y) connections.n = true;
            if (prev.y > curr.y) connections.s = true;
            if (prev.x < curr.x) connections.w = true;
            if (prev.x > curr.x) connections.e = true;
        }
        if (next) {
            if (next.y < curr.y) connections.n = true;
            if (next.y > curr.y) connections.s = true;
            if (next.x < curr.x) connections.w = true;
            if (next.x > curr.x) connections.e = true;
        }

        // Logic for "Pro" Junction Merging
        let existing = mapData[curr.y][curr.x];
        if (existing.startsWith('B')) {
            // Add existing connections to our new path tile
            if (existing === 'Ba') { connections.n = true; connections.s = true; }
            if (existing === 'Bb') { connections.e = true; connections.w = true; }
            // ... add more logic here to detect existing corners if desired
        }

        let tile = 'Ba'; // Default
        const {n, s, e, w} = connections;

        // Selection Logic
        if (n && s && e && w) tile = 'Bc';
        else if (n && s && w) tile = 'Bh';
        else if (n && s && e) tile = 'Bi';
        else if (n && s) tile = 'Ba';
        else if (e && w) tile = 'Bb';
        else if (n && w) tile = 'Bd';
        else if (n && e) tile = 'Be';
        else if (s && e) tile = 'Bf';
        else if (s && w) tile = 'Bg';
        // Caps/Starts
        else if (n) tile = 'Bm';
        else if (s) tile = 'Bn';
        else if (e) tile = 'Bk';
        else if (w) tile = 'Bl';

        mapData[curr.y][curr.x] = tile;
    }
    renderFullMap();
}

function fillSectorAt(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const tileX = Math.floor((clientX - rect.left) / TILE_SIZE);
    const tileY = Math.floor((clientY - rect.top) / TILE_SIZE);

    const sectorX = Math.floor(tileX / SECTOR_TILE_WIDTH);
    const sectorY = Math.floor(tileY / SECTOR_TILE_HEIGHT);

    // Calculate the pixel/tile boundaries of that sector
    const startX = sectorX * SECTOR_TILE_WIDTH;
    const endX = startX + SECTOR_TILE_WIDTH;
    const startY = sectorY * SECTOR_TILE_HEIGHT;
    const endY = startY + SECTOR_TILE_HEIGHT;

    // Fill the sector
    for (let y = startY; y < endY; y++) {
        for (let x = startX; x < endX; x++) {
            if (mapData[y][x] !== brush) {
                mapData[y][x] = brush;
            }
        }
    }
    renderFullMap();
}

// Helper to check if a tile is part of a mountain
function isMountain(x, y) {
    if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) return false;
    return mapData[y][x].startsWith('S');
}

function getSmartMountainTile(x, y) {
    const N = isMountain(x, y - 1);
    const S = isMountain(x, y + 1);
    const W = isMountain(x - 1, y);
    const E = isMountain(x + 1, y);

    // 1. Vertical Logic (Peak/Base/Middle)
    if (!N && S) return 'Sb'; // Peak (Grass above, Mountain below)
    if (N && !S) return 'Sf'; // Base (Mountain above, Grass below)
    
    // 2. Horizontal/Edge Logic (Only if it's a middle vertical piece)
    if (N && S) {
        if (!W && E) return 'Sc'; // Left Edge
        if (W && !E) return 'Sd'; // Right Edge
        return 'Sd';              // Solid Center
    }

    // 3. Default/Isolated
    return 'Sb'; // Single tiles look like rocks/peaks
}

function applySmartMountain(x, y) {
    // 1. Set the painted tile to mountain center by default for neighbor detection.
    mapData[y][x] = 'Sd'; 

    // 2. Heal the painted tile and the 4 neighbors if they are mountains
    const pointsToUpdate = [
        {x: x, y: y},
        {x: x, y: y - 1}, {x: x, y: y + 1},
        {x: x - 1, y: y}, {x: x + 1, y: y}
    ];

    pointsToUpdate.forEach(p => {
        if (isMountain(p.x, p.y)) {
            mapData[p.y][p.x] = getSmartMountainTile(p.x, p.y);
            drawTile(p.x, p.y);
        }
    });

    // 3. Handle right (east) edge for "mountain meets grass"
    // If the tile to the right is grass, make it Se
    const ex = x + 1;
    if (ex < TILE_W && !isMountain(ex, y)) {
        const rightCode = mapData[y][ex];
        // Only convert if it is grass/noise
        if (rightCode.startsWith('G') || rightCode === 'Ga') {
            mapData[y][ex] = 'Se'; // left side mountain, right side grass
            drawTile(ex, y);
        }
    }
}

function undo() {
    if (mapHistory.length === 0) return;
    mapData = mapHistory.pop();
    renderFullMap();
}

function saveHistory() {
    // We must clone the array, otherwise we just save a reference to the live map
    const snapshot = mapData.map(row => [...row]);
    mapHistory.push(snapshot);
    
    // Keep history from getting too large
    if (mapHistory.length > MAX_UNDO) {
        mapHistory.shift(); 
    }
}

function copySelected(isCut = false) {
    if (!selection) return;
    saveHistory();
    let out = "";
    for (let y = selection.y; y < selection.y + selection.h; y++) {
        for (let x = selection.x; x < selection.x + selection.w; x++) {
            out += mapData[y][x];
            if (isCut) mapData[y][x] = "Ga"; // Replace with default grass
        }
        if (y < selection.y + selection.h - 1) out += "\n";
    }
    clipboard = out;
    if (isCut) renderFullMap();
    console.log("Copied to internal clipboard:\n" + clipboard);
}

function pasteAt(tileX, tileY) {
    if (!clipboard) return;
    saveHistory();
    const rows = clipboard.split('\n');
    rows.forEach((rowStr, dy) => {
        // Match every 2 characters (the tile codes)
        const tiles = rowStr.match(/.{1,2}/g); 
        tiles.forEach((code, dx) => {
            const x = tileX + dx;
            const y = tileY + dy;
            if (x < TILE_W && y < TILE_H) {
                mapData[y][x] = code;
            }
        });
    });
    renderFullMap();
}

function renderFullMap() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < TILE_H; y++) {
        for (let x = 0; x < TILE_W; x++) {
            drawTile(x, y);
        }
    }
    
    // Draw Selection Box
    if (selection) {
        ctx.strokeStyle = '#0af';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]); // Dashed line effect
        ctx.strokeRect(
            selection.x * TILE_SIZE, 
            selection.y * TILE_SIZE, 
            selection.w * TILE_SIZE, 
            selection.h * TILE_SIZE
        );
        ctx.setLineDash([]); // Reset dash
    }

    drawSectorBorders(ctx, TILE_SIZE, SECTORS_WIDE, SECTORS_TALL, SECTOR_TILE_WIDTH, SECTOR_TILE_HEIGHT);
}

// Copies the selected map area into the textarea and the browser clipboard
async function copySelectionToStamp() {

    }

    let out = "";
    for (let y = selection.y; y < selection.y + selection.h; y++) {

    } catch (err) {
        document.getElementById('stampStatus').innerText = "Copied to box (Clipboard blocked).";

// Pastes text from the textarea onto the map starting at the selection's top-left
function applyStampToSelection() {
    const text = document.getElementById('stampInput').value.trim();
    if (!text) {
        document.getElementById('stampStatus').innerText = "Nothing to paste!";
        return;
    }
    if (!selection) {
        alert("Click or drag on the map to set the paste origin.");
        return;
    }

    saveHistory();
    
    // We use selection.x/y as the strict top-left origin
    const originX = selection.x;
    const originY = selection.y;

    const lines = text.split('\n');
    lines.forEach((line, dy) => {
        // Strip spaces/tabs but keep the 2-char codes
        const cleanLine = line.replace(/\s+/g, '');
        const tiles = cleanLine.match(/.{1,2}/g); 
        
        if (tiles) {
            tiles.forEach((code, dx) => {
                const gx = originX + dx;
                const gy = originY + dy;
                
                // Overflow Check: Paste everywhere as long as it's on the map
                if (gx >= 0 && gx < TILE_W && gy >= 0 && gy < TILE_H) {
                    mapData[gy][gx] = code;
                }
            });
        }
    });
    
    document.getElementById('stampStatus').innerText = "Pasted at (" + originX + "," + originY + ")";
    renderFullMap();
}
function updateStampData() {
    const text = document.getElementById('stampInput').value.trim();
    if (!text) return;

    const lines = text.split('\n');
    currentStamp = lines.map(line => {
        // Remove all whitespace and match 2-character pairs
        const cleanLine = line.replace(/\s+/g, '');
        const matches = cleanLine.match(/.{1,2}/g);
        return matches || [];
    });

    const height = currentStamp.length;
    const width = currentStamp[0] ? currentStamp[0].length : 0;
    document.getElementById('stampStatus').innerText = `Loaded: ${width}x${height} stamp. Click map to place.`;
}

function applyStamp(tx, ty) {
    if (currentStamp.length === 0) return;
    
    saveHistory(); // Ensure undo works
    for (let y = 0; y < currentStamp.length; y++) {
        for (let x = 0; x < currentStamp[y].length; x++) {
            const gx = tx + x;
            const gy = ty + y;
            // Bounds check
            if (gx >= 0 && gx < TILE_W && gy >= 0 && gy < TILE_H) {
                mapData[gy][gx] = currentStamp[y][x];
            }
        }
    }
    renderFullMap();
}
