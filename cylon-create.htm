<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CREATE .GFX WORLD</title>
    <style>
        body {
            background: #222;
            color: #eee;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #toolbar {
            background: #333;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #444;
        }

        #outerContainer { display: flex; flex-direction: row; height: 90vh; }

        #sideToolbar {
          width: 56px;
          background: #202a36;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 8px 0;
          border-right: 1px solid #333;
          gap: 14px;
        }
        /* #viewport is now the SCROLL CONTAINER for the virtual camera.
           It no longer holds a world-sized canvas -- it holds a 1:1 sized
           "world spacer" div (which gives the scrollbar its correct range)
           and a viewport-sized <canvas> that sticks to the top-left corner
           of the visible area as you scroll. */
        #viewport {
            flex-grow: 1;
            overflow: auto;
            background: #111;
            position: relative;
        }
        #worldSpacer {
            position: relative;
            /* width/height set dynamically to TILE_W*TILE_SIZE x TILE_H*TILE_SIZE */
        }
        canvas {
            background: #000;
            cursor: crosshair;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            left: 0;
            display: block;
        }
        .brush-info {
            font-weight: bold;
            font-family: monospace;
            font-size: 1.2em;
            background: #444;
            padding: 5px 10px;
            border-radius: 4px;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
            background: #068;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover { background: #07a; }
        #toolbar .tool-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #444;
            padding: 4px 10px;
            border-radius: 4px;
        }
        #toolbar input[type="number"] {
            background: #222;
            color: #0af;
            border: 1px solid #555;
            padding: 4px;
            width: 45px;
            font-family: monospace;
            font-weight: bold;
        }
        #renderStats {
            margin-left: auto;
            font-family: monospace;
            font-size: 0.75em;
            color: #666;
        }
    </style>
</head>
<body>

<div id="toolbar"></div>

<div id="outerContainer">
    <div id="viewport">
        <div id="worldSpacer">
            <canvas id="mapCanvas"></canvas>
        </div>
    </div>
</div>

<div id="toolPopup" style="display:none; position:fixed; left:200px; top:100px; background:#333; border:2px solid #0af; color:#eee; border-radius:8px; z-index:1000; min-width:250px; min-height:120px; box-shadow:0 6px 32px #000a"></div>

<script>
    // ==========================================================================
    // WORLD CONSTANTS
    // ==========================================================================
    let SECTORS_WIDE = 26, SECTORS_TALL = 26; // 26x26 sectors == 676 sectors
    const SECTOR_TILE_WIDTH = 8, SECTOR_TILE_HEIGHT = 12;

    const DEFAULT_MAP_URL = 'capflag.gfx'; // The name of your default map file

    let copiedSectorData = null; // Stores an array of 96 tile codes when a sector is copied
    let copiedSectorLabel = null; // Stores the label of the copied sector (e.g., "Aa")

    var TILE_W = SECTORS_WIDE * SECTOR_TILE_WIDTH;   // 208 tiles wide
    var TILE_H = SECTORS_TALL * SECTOR_TILE_HEIGHT;  // 312 tiles tall
    var TILE_SIZE = 32; // Current DISPLAY zoom (8 / 16 / 32 / 64). Independent of chunk resolution.
    const BASE_TILE_PX = 32; // Native resolution tiles are rendered into sector chunk canvases at.
    var NOISE_TILES = ['Fa', 'Gb', 'Gc', 'Gd', 'Ge', 'Gf', 'Gg'];

    let mapData = [];
    const imageCache = {}; // Cache for tile images
    const itemCache = {}; // Cache for item images

    const uniqueTileCodes = new Set();
    const uniqueItemCodes = new Set();

    // ==========================================================================
    // HISTORY (diff-based, not full-map-copy-based)
    // ==========================================================================
    let mapHistory = []; // Array of Map<"x,y", oldCode>
    const MAX_UNDO = 20;
    let historyStroke = null; // active Map while a paint stroke/action is in progress

    function beginStroke() {
        historyStroke = new Map();
    }
    function endStroke() {
        if (historyStroke && historyStroke.size > 0) {
            mapHistory.push(historyStroke);
            if (mapHistory.length > MAX_UNDO) mapHistory.shift();
        }
        historyStroke = null;
    }
    function undo() {
        if (mapHistory.length === 0) return;
        const stroke = mapHistory.pop();
        for (const [key, oldCode] of stroke.entries()) {
            const commaIdx = key.indexOf(',');
            const x = Number(key.slice(0, commaIdx));
            const y = Number(key.slice(commaIdx + 1));
            mapData[y][x] = oldCode;
            markTileDirty(x, y);
        }
        scheduleRender();
    }

    // ==========================================================================
    // SECTOR / GAME STATE
    // ==========================================================================
    let sectorExits = {};  // { "Aa": "AbBa", ... }

    const UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"; // rows
    const LOWER = "abcdefghijklmnopqrstuvwxyz"; // cols

    let lastEditedSector = "Aa";

    let selection = null; // {x, y, w, h} in tile coordinates
    let isSelecting = false;
    let selectionStart = null; // {x, y}
    let clipboard = "";

    let activeTool = 'brush';

    let brush = "Ga";
    let brushSize = 1;
    let brushShape = 'box';

    let flowerMode = false;
    let currentFlowerSet = 'yellow';
    let flowerWeights = { primary: 30, variant: 20, weeds: 10 };

    let pathMode = 0; // 0: Off, 1: Select Start, 2: Select End (river tool)
    let pathStartNode = null;

    let sectorLOS = {};
    let sectorItems = {};

    let preservedLines = {};

    let currentItemCode = "I1";
    let currentItemData = "00";

    let isPainting = false;

    // ==========================================================================
    // DOM REFS
    // ==========================================================================
    const viewportEl = document.getElementById('viewport');
    const worldSpacer = document.getElementById('worldSpacer');
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');

    // ==========================================================================
    // SECTOR LABEL HELPERS
    // ==========================================================================
    function sectorLabelToRC(label) {
        return { row: UPPER.indexOf(label.charAt(0)), col: LOWER.indexOf(label.charAt(1)) };
    }
    function tileToSectorLabel(x, y) {
        const row = Math.floor(y / SECTOR_TILE_HEIGHT);
        const col = Math.floor(x / SECTOR_TILE_WIDTH);
        return `${UPPER[row]}${LOWER[col]}`;
    }

    function boundsFromW4(w4) {
      // w4 is like "Hh" — inclusive upper-left-origin bound
      const rows = UPPER.indexOf(w4.charAt(0)) + 1; // Hh -> H is index 7 -> 8 rows
      const cols = LOWER.indexOf(w4.charAt(1)) + 1;
      return { rows, cols };
    }
    
    function resizeMapBounds(w4) {
      const { rows, cols } = boundsFromW4(w4);
      SECTORS_TALL = rows;
      SECTORS_WIDE = cols;
      TILE_W = SECTORS_WIDE * SECTOR_TILE_WIDTH;
      TILE_H = SECTORS_TALL * SECTOR_TILE_HEIGHT;
    }

    // ==========================================================================
    // SECTOR CHUNKING (offscreen canvas cache, lazily built, LRU-evicted)
    // This is what makes zooming/panning/undo fast at 676 sectors: we never
    // loop over all 64,896 tiles to render a frame. We only ever draw the
    // handful of sector-chunk canvases that are visible, and only rebuild a
    // chunk when a tile inside it actually changes.
    // ==========================================================================
    const sectorChunks = new Map(); // label -> {canvas, ctx, lastUsed}
    const CHUNK_CACHE_LIMIT = 220;  // ~220 * 256x384x4 bytes =~ 86MB ceiling
    let chunkAccessCounter = 0;

    function getSectorCanvas(label) {
        let chunk = sectorChunks.get(label);
        if (chunk) {
            chunk.lastUsed = ++chunkAccessCounter;
            return chunk;
        }
        chunk = buildSectorCanvas(label);
        sectorChunks.set(label, chunk);
        evictOldChunksIfNeeded();
        return chunk;
    }

    function buildSectorCanvas(label) {
        const cnv = document.createElement('canvas');
        cnv.width = SECTOR_TILE_WIDTH * BASE_TILE_PX;
        cnv.height = SECTOR_TILE_HEIGHT * BASE_TILE_PX;
        const cctx = cnv.getContext('2d');
        const { row, col } = sectorLabelToRC(label);
        const baseX = col * SECTOR_TILE_WIDTH, baseY = row * SECTOR_TILE_HEIGHT;
        for (let sy = 0; sy < SECTOR_TILE_HEIGHT; sy++) {
            for (let sx = 0; sx < SECTOR_TILE_WIDTH; sx++) {
                paintTileIntoChunk(cctx, baseX + sx, baseY + sy, sx, sy);
            }
        }
        return { canvas: cnv, ctx: cctx, lastUsed: ++chunkAccessCounter };
    }

    function evictOldChunksIfNeeded() {
        if (sectorChunks.size <= CHUNK_CACHE_LIMIT) return;
        const entries = [...sectorChunks.entries()].sort((a, b) => a[1].lastUsed - b[1].lastUsed);
        const removeCount = sectorChunks.size - CHUNK_CACHE_LIMIT;
        for (let i = 0; i < removeCount; i++) sectorChunks.delete(entries[i][0]);
    }

    // Paints ONE tile into a sector chunk's own local ctx, at native BASE_TILE_PX resolution.
    function paintTileIntoChunk(cctx, gx, gy, localX, localY) {
        const px = localX * BASE_TILE_PX, py = localY * BASE_TILE_PX;
        if (gx < 0 || gx >= TILE_W || gy < 0 || gy >= TILE_H) {
            cctx.fillStyle = '#000';
            cctx.fillRect(px, py, BASE_TILE_PX, BASE_TILE_PX);
            return;
        }
        const code = mapData[gy][gx];
        const img = getTileImage(code);
        cctx.fillStyle = '#000';
        cctx.fillRect(px, py, BASE_TILE_PX, BASE_TILE_PX);
        if (img && img.complete && img.naturalWidth !== 0) {
            cctx.drawImage(img, px, py, BASE_TILE_PX, BASE_TILE_PX);
        } else {
            cctx.strokeStyle = '#333';
            cctx.strokeRect(px, py, BASE_TILE_PX, BASE_TILE_PX);
        }
    }

    // If a chunk is currently cached, patch just the one tile inside it.
    // If it's NOT cached, we don't need to do anything -- next time it's
    // requested it will be built fresh from the live mapData anyway.
    function markTileDirty(x, y) {
        if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) return;
        const label = tileToSectorLabel(x, y);
        const chunk = sectorChunks.get(label);
        if (chunk) {
            const { row, col } = sectorLabelToRC(label);
            const localX = x - col * SECTOR_TILE_WIDTH, localY = y - row * SECTOR_TILE_HEIGHT;
            paintTileIntoChunk(chunk.ctx, x, y, localX, localY);
        }
        scheduleRender();
    }

    // ==========================================================================
    // THE SINGLE MUTATION ENTRY POINT
    // Every tool in this file changes tiles by calling setTile(), never by
    // writing to mapData directly. That's what lets undo() be a cheap diff
    // and lets the sector chunk cache stay correct without full rebuilds.
    // ==========================================================================
    function setTile(x, y, code) {
        if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) return;
        const old = mapData[y][x];
        if (old === code) return;
        if (historyStroke && !historyStroke.has(x + ',' + y)) {
            historyStroke.set(x + ',' + y, old);
        }
        mapData[y][x] = code;
        uniqueTileCodes.add(code);
        markTileDirty(x, y);
    }

    // ==========================================================================
    // VIRTUAL CAMERA / VIEWPORT RENDERING
    // The <canvas> is always sized to the visible viewport, never the world.
    // Panning is just the browser's native scrollbars on #viewport; camera
    // position is simply viewportEl.scrollLeft / scrollTop.
    // ==========================================================================
    let renderScheduled = false;
    function scheduleRender() {
        if (renderScheduled) return;
        renderScheduled = true;
        requestAnimationFrame(() => {
            renderScheduled = false;
            renderViewport();
        });
    }

    function updateWorldSpacerSize() {
        worldSpacer.style.width = (TILE_W * TILE_SIZE) + 'px';
        worldSpacer.style.height = (TILE_H * TILE_SIZE) + 'px';
    }

    function resizeCanvasToViewport() {
        const w = viewportEl.clientWidth || 800;
        const h = viewportEl.clientHeight || 600;
        if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
        }
        scheduleRender();
    }

    function renderViewport() {
        const w = canvas.width, h = canvas.height;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);

        const camX = viewportEl.scrollLeft;
        const camY = viewportEl.scrollTop;

        const sectorPxW = SECTOR_TILE_WIDTH * TILE_SIZE;
        const sectorPxH = SECTOR_TILE_HEIGHT * TILE_SIZE;

        // +/- 1 sector margin so panning doesn't show pop-in at the edges
        const firstSecCol = Math.max(0, Math.floor(camX / sectorPxW) - 1);
        const lastSecCol  = Math.min(SECTORS_WIDE - 1, Math.floor((camX + w) / sectorPxW) + 1);
        const firstSecRow = Math.max(0, Math.floor(camY / sectorPxH) - 1);
        const lastSecRow  = Math.min(SECTORS_TALL - 1, Math.floor((camY + h) / sectorPxH) + 1);

        let chunksDrawn = 0;
        for (let r = firstSecRow; r <= lastSecRow; r++) {
            for (let c = firstSecCol; c <= lastSecCol; c++) {
                const label = `${UPPER[r]}${LOWER[c]}`;
                const chunk = getSectorCanvas(label);
                const destX = c * sectorPxW - camX;
                const destY = r * sectorPxH - camY;
                ctx.drawImage(chunk.canvas, 0, 0, chunk.canvas.width, chunk.canvas.height,
                              destX, destY, sectorPxW, sectorPxH);
                chunksDrawn++;
            }
        }

        // Selection box overlay
        if (selection) {
            ctx.strokeStyle = '#0af';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.strokeRect(
                selection.x * TILE_SIZE - camX,
                selection.y * TILE_SIZE - camY,
                selection.w * TILE_SIZE,
                selection.h * TILE_SIZE
            );
            ctx.setLineDash([]);
        }

        drawSectorBordersViewport(camX, camY, firstSecRow, lastSecRow, firstSecCol, lastSecCol);

        const stats = document.getElementById('renderStats');
        if (stats) stats.textContent = `chunks: ${chunksDrawn} drawn / ${sectorChunks.size} cached`;
    }

    // Converts a mouse event's client coordinates into world TILE coordinates,
    // accounting for the current camera scroll offset and zoom level.
    function screenToTile(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const camX = viewportEl.scrollLeft, camY = viewportEl.scrollTop;
        const tx = Math.floor((clientX - rect.left + camX) / TILE_SIZE);
        const ty = Math.floor((clientY - rect.top + camY) / TILE_SIZE);
        return { tx, ty };
    }

    // ==========================================================================
    // INITIALIZATION
    // ==========================================================================
    async function initMap() {
        updateWorldSpacerSize();
        resizeCanvasToViewport();

        console.log(`Loading default map: ${DEFAULT_MAP_URL}`);
        try {
            const response = await fetch(DEFAULT_MAP_URL);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const mapText = await response.text();
            processMap(mapText);
            await preloadAllImages();
            scheduleRender();
            console.log("Default map loaded and rendered.");
        } catch (error) {
            console.error("Failed to load default map:", error);
            alert("Failed to load default map. Initializing with random noise.");
            mapData = [];
            for (let y = 0; y < TILE_H; y++) {
                mapData[y] = [];
                for (let x = 0; x < TILE_W; x++) {
                    const tile = NOISE_TILES[Math.floor(Math.random() * NOISE_TILES.length)];
                    mapData[y][x] = tile;
                    uniqueTileCodes.add(tile);
                }
            }
            sectorChunks.clear();
            await preloadAllImages();
            scheduleRender();
        }
    }

    async function preloadAllImages() {
        console.log("Preloading images...");
        const imagePromises = [];
        for (const code of uniqueTileCodes) {
            if (!imageCache[code]) {
                const img = new Image();
                img.src = `t/${code}.png`;
                const promise = new Promise((resolve) => {
                    img.onload = () => resolve();
                    img.onerror = () => { console.warn(`Failed to load tile image: t/${code}.png`); resolve(); };
                });
                imageCache[code] = img;
                imagePromises.push(promise);
            }
        }
        for (const id of uniqueItemCodes) {
            if (!itemCache[id]) {
                const img = new Image();
                img.src = `i/${id}.png`;
                const promise = new Promise((resolve) => {
                    img.onload = () => resolve();
                    img.onerror = () => { console.warn(`Failed to load item image: i/${id}.png`); resolve(); };
                });
                itemCache[id] = img;
                imagePromises.push(promise);
            }
        }
        await Promise.all(imagePromises);
        console.log("All images preloaded.");
    }

    function getTileImage(code) {
        if (!imageCache[code]) {
            const img = new Image();
            img.src = `t/${code}.png`;
            imageCache[code] = img;
            img.onload = () => {
                // A tile image that finished loading late might already be
                // baked into some cached chunks as a placeholder -- refresh them.
                sectorChunks.clear();
                scheduleRender();
            };
            img.onerror = () => { console.warn(`Failed to dynamically load tile: t/${code}.png`); };
        }
        return imageCache[code];
    }

    // ==========================================================================
    // TOOLBAR
    // ==========================================================================
    function renderToolbar() {
        const toolbar = document.getElementById('toolbar');
        toolbar.innerHTML = '';

        function addButton(label, onclick) {
            var btn = document.createElement('button');
            btn.innerText = label;
            btn.onclick = onclick;
            toolbar.appendChild(btn);
        }

        const select = document.createElement('select');
        [
          {label:'2x', value:64},
          {label:'1x', value:32},
          {label:'1/2x', value:16},
          {label:'1/4x', value:8}
        ].forEach(opt => {
          let o = document.createElement('option');
          o.textContent = opt.label;
          o.value = opt.value;
          if (opt.value === TILE_SIZE) o.selected = true;
          select.appendChild(o);
        });
        select.addEventListener('change', function() { setTileSize(Number(this.value)); });
        toolbar.appendChild(select);

        addButton('File', showFileTool);
        addButton('Borders', borders);

        const sizeGroup = document.createElement('div');
        sizeGroup.className = 'tool-group';
        sizeGroup.innerHTML = `
            <label style="font-size:0.8em; color:#aaa;">SIZE</label>
            <input type="number" id="toolbarBrushSize" value="${brushSize}" min="1" max="25"
                   onchange="syncBrushSize(this.value)">
        `;
        toolbar.appendChild(sizeGroup);

        addButton('Brush', bigbrush);
        addButton('Flower', showFlowerTool);
        addButton('Terrain', showTerrainTool);
        addButton('Sectors', showSectorTool);
        addButton('Stamp', showStampTool);
        addButton('Exits', () => showExitsEditor(lastEditedSector));

        const stats = document.createElement('div');
        stats.id = 'renderStats';
        toolbar.appendChild(stats);
    }

    function syncBrushSize(val) {
        brushSize = parseInt(val, 10);
        const slider = document.getElementById('brushSizeSlider');
        if (slider) {
            slider.value = brushSize;
            updateBrushSizePreview(brushSize);
        }
    }

    // ==========================================================================
    // SECTOR TOOL (fill / copy / paste whole sectors)
    // ==========================================================================
    let currentSectorToolMode = 'fill';

    function showSectorTool() {
        activeTool = 'sector_tool';
        const popup = document.getElementById('toolPopup');
        const buttonStyle = (mode) => currentSectorToolMode === mode ? 'background:#0af; color:white;' : '';
        popup.innerHTML = `
            <div id="toolPopupHeader" style="cursor:move; background:#1abc9c; padding:8px; border-radius:6px 6px 0 0; font-weight:bold;">
                Sector Editor
                <span style="float:right;cursor:pointer;" onclick="exitSectorTool()">✕</span>
            </div>
            <div style="padding:16px; display:flex; flex-direction:column; gap:10px;">
                <p style="font-size:0.85em; color:#eee; margin-top:0;">Select an action, then click a sector on the map.</p>
                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px;">
                    <button onclick="setSectorToolMode('fill')" style="${buttonStyle('fill')}">Fill Sector</button>
                    <button onclick="setSectorToolMode('copy')" style="${buttonStyle('copy')}">Copy Sector</button>
                    <button onclick="setSectorToolMode('paste')" style="${buttonStyle('paste')}">Paste Sector</button>
                </div>
                <div style="background:#222; padding:10px; border-radius:4px; font-size:0.85em; color:#bbb;">
                    Current Brush: <span style="color:#0af; font-family:monospace;">${brush}</span><br>
                    Copied Sector: <span style="color:#0af; font-family:monospace;">${copiedSectorLabel || 'None'}</span>
                </div>
                <button onclick="exitSectorTool()" style="background:#555; width:100%; margin-top:10px;">Done</button>
            </div>
        `;
        popup.style.display = "block";
        makeDraggable(popup, document.getElementById('toolPopupHeader'));
    }

    function setSectorToolMode(mode) {
        currentSectorToolMode = mode;
        showSectorTool();
    }

    function fillSectorWithBrush(globalX, globalY) {
        beginStroke();
        for (let y = globalY; y < globalY + SECTOR_TILE_HEIGHT; y++) {
            for (let x = globalX; x < globalX + SECTOR_TILE_WIDTH; x++) {
                setTile(x, y, brush);
            }
        }
        endStroke();
    }

    function copySector(globalX, globalY, label) {
        copiedSectorData = [];
        for (let y = globalY; y < globalY + SECTOR_TILE_HEIGHT; y++) {
            for (let x = globalX; x < globalX + SECTOR_TILE_WIDTH; x++) {
                if (x >= 0 && x < TILE_W && y >= 0 && y < TILE_H) {
                    copiedSectorData.push(mapData[y][x]);
                } else {
                    copiedSectorData.push('Ga');
                }
            }
        }
        copiedSectorLabel = label;
        showSectorTool();
        console.log(`Copied sector ${label} (containing ${copiedSectorData.length} tiles).`);
    }

    function pasteSector(globalX, globalY) {
        beginStroke();
        let sourceTiles = copiedSectorData;
        if (!sourceTiles) {
            console.log("No sector copied, pasting default grass.");
            sourceTiles = Array(SECTOR_TILE_WIDTH * SECTOR_TILE_HEIGHT).fill('Ga');
            copiedSectorLabel = "Default Grass";
        }
        let tileIndex = 0;
        for (let y = globalY; y < globalY + SECTOR_TILE_HEIGHT; y++) {
            for (let x = globalX; x < globalX + SECTOR_TILE_WIDTH; x++) {
                setTile(x, y, sourceTiles[tileIndex] || 'Ga');
                tileIndex++;
            }
        }
        endStroke();
        showSectorTool();
        console.log(`Pasted sector at (${globalX}, ${globalY}).`);
    }

    function exitSectorTool() {
        activeTool = 'brush';
        document.getElementById('toolPopup').style.display = 'none';
    }

    // ==========================================================================
    // FILE TOOL
    // ==========================================================================
    function showFileTool() {
        const popup = document.getElementById('toolPopup');
        popup.innerHTML = `
            <div id="toolPopupHeader" style="cursor:move; background:#222; padding:8px; border-radius:6px 6px 0 0; font-weight:bold; border-bottom:1px solid #444;">
                File Operations
                <span style="float:right;cursor:pointer;" onclick="document.getElementById('toolPopup').style.display='none'">✕</span>
            </div>
            <div style="padding:16px; display:flex; flex-direction:column; gap:10px;">
                <button onclick="newFile()" style="background:#2980b9;">New .gfx File</button>
                <button onclick="importMap()" style="background:#2980b9;">Import from Clipboard</button>
                <button onclick="exportMap()" style="background:#27ae60;">Export to Clipboard</button>
                <hr style="border:0; border-top:1px solid #444; margin:5px 0;">

    function solveRiverEdges() {
        beginStroke();
        // Clone map so neighbor checks aren't affected by tiles we change mid-loop
        const tempMap = mapData.map(row => [...row]);

        const isW = (x, y) => {
            if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) return true;
            const t = tempMap[y][x];
            return t.startsWith('U') || t.startsWith('A');
        };

        for (let y = 0; y < TILE_H; y++) {
            for (let x = 0; x < TILE_W; x++) {
                if (!isW(x, y)) continue;

                const N = isW(x, y - 1), S = isW(x, y + 1), W = isW(x - 1, y), E = isW(x + 1, y);
                const NW = isW(x - 1, y - 1), NE = isW(x + 1, y - 1), SW = isW(x - 1, y + 1), SE = isW(x + 1, y + 1);
                const cardinalCount = (N?1:0) + (S?1:0) + (W?1:0) + (E?1:0);

                let tile = 'Ua';
                if (cardinalCount === 3) {
                    if (!N) tile = 'Aa';
                    if (!S) tile = 'Ab';
                    if (!E) tile = 'Ac';
                    if (!W) tile = 'Ad';
                } else if (cardinalCount === 2) {
                    if (S && E) tile = 'Ag';
                    if (S && W) tile = 'Ah';
                    if (N && E) tile = 'Ai';
                    if (N && W) tile = 'Ae';
                } else if (cardinalCount === 4) {
                    if (!SE) tile = 'Ub';
                    if (!SW) tile = 'Uc';
                    if (!NE) tile = 'Ud';
                    if (!NW) tile = 'Ue';
                }
                setTile(x, y, tile);
            }
        }
        endStroke();
    }

    function applyDrunkRiver(start, end) {
        let path = findPath(start, end);
        if (!path) {
            alert("No path found! Make sure the start and end aren't blocked by mountains/walls.");
            return;
        }
        beginStroke();
        const half = Math.floor(brushSize / 2);
        path.forEach(node => {
            for (let dy = -half; dy <= half; dy++) {
                for (let dx = -half; dx <= half; dx++) {
                    setTile(node.x + dx, node.y + dy, 'Ua');
                }
            }
        });
        endStroke();
        pathMode = 1;
        const status = document.getElementById('pathStatus');
        if (status) status.innerHTML = "River drawn! Click for <b>New River Start</b>.";
    }

    function isMountain(x, y) {
        if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) return false;
        return mapData[y][x].startsWith('S');

    function getSmartMountainTile(x, y) {
        const N = isMountain(x, y - 1);
        const S = isMountain(x, y + 1);
        const W = isMountain(x - 1, y);
        const E = isMountain(x + 1, y);

        if (!N && S) return 'Sb';
        if (N && !S) return 'Sf';
        if (!W && E) return 'Sc';
        if (W && !E) return 'Se';
        if (N && S && W && E) return 'Sd';
        return 'Sb';
    }

    function applySmartMountain(x, y) {
        setTile(x, y, 'Sd');
        const pointsToUpdate = [
            {x: x, y: y},
            {x: x, y: y - 1}, {x: x, y: y + 1},
            {x: x - 1, y: y}, {x: x + 1, y: y}
        ];
        pointsToUpdate.forEach(p => {
            if (isMountain(p.x, p.y)) {
                setTile(p.x, p.y, getSmartMountainTile(p.x, p.y));
            }
        });
    }

    function applyFlowerSpray(x, y) {
        const currentTile = mapData[y][x];
        const isGrass = currentTile.startsWith('G') || currentTile === 'Fa';
        if (!isGrass) return;

        const roll = Math.random() * 100;
        let targetTile = null;
        const sets = {
            yellow: { primary: 'Fa', variant: 'Fe', weeds: 'Gb' },
            white:  { primary: 'Fb', variant: 'Ff', weeds: 'Gb' },
            blue:   { primary: 'Fc', variant: 'Fd', weeds: 'Gb' }
        };
        const config = sets[currentFlowerSet];

        if (roll < flowerWeights.primary) {
            targetTile = config.primary;
        } else if (roll < (flowerWeights.primary + flowerWeights.variant)) {
            targetTile = config.variant;
        } else if (roll < (flowerWeights.primary + flowerWeights.variant + flowerWeights.weeds)) {
            targetTile = config.weeds;
        }
        if (targetTile) setTile(x, y, targetTile);
    }

    function makeDraggable(popup, header) {
        let offsetX = 0, offsetY = 0, isDown = false;
        header.onmousedown = function(e) {
            isDown = true;
            offsetX = e.clientX - popup.offsetLeft;
            offsetY = e.clientY - popup.offsetTop;
            document.onmousemove = function(e) {
                if (!isDown) return;
                popup.style.left = (e.clientX - offsetX) + 'px';
                popup.style.top = (e.clientY - offsetY) + 'px';
            };
            document.onmouseup = function() {
                isDown = false;
                document.onmousemove = null;
            };
        };
    }

    function updateBrushSizePreview(val) {
        brushSize = parseInt(val, 10);

        let out = '<table style="border-collapse:collapse; background:#000;">';
        const half = Math.floor(brushSize / 2);
        for (let dy = -half; dy <= half; dy++) {
            out += '<tr>';
            for (let dx = -half; dx <= half; dx++) {
                let isActive = false;
                if (brushShape === 'box') isActive = true;
                else if (brushShape === 'circle') isActive = (dx * dx + dy * dy <= (half * half) + 0.5);
                else if (brushShape === 'diamond') isActive = (Math.abs(dx) + Math.abs(dy) <= half);
                else if (brushShape === 'hline') isActive = (dy === 0);
                else if (brushShape === 'vline') isActive = (dx === 0);
                else if (brushShape === 'triangle') {
                    let rowWidth = (dy + half);
                    isActive = (Math.abs(dx * 2) <= rowWidth);
                }
                const color = isActive ? '#0af' : 'transparent';
                out += `<td style="width:4px; height:4px; background:${color};"></td>`;
            }
            out += '</tr>';
        }
        out += '</table>';
        document.getElementById('brushPreview').innerHTML = out;
    }

    // ==========================================================================

    // ==========================================================================
    function borders() {
        scheduleRender();

    function drawSectorBordersViewport(camX, camY, r0, r1, c0, c1) {
        ctx.save();
        for (let r = r0; r <= r1; r++) {
            for (let c = c0; c <= c1; c++) {
                const currentLabel = `${UPPER[r]}${LOWER[c]}`;
                const exits = sectorExits[currentLabel] || "";

                const x = c * SECTOR_TILE_WIDTH * TILE_SIZE - camX;
                const y = r * SECTOR_TILE_HEIGHT * TILE_SIZE - camY;
                const w = SECTOR_TILE_WIDTH * TILE_SIZE;
                const h = SECTOR_TILE_HEIGHT * TILE_SIZE;

                if (c < SECTORS_WIDE - 1) {
                    const rightNeighbor = `${UPPER[r]}${LOWER[c + 1]}`;
                    const neighborExits = sectorExits[rightNeighbor] || "";
                    const canGoNext = exits.includes(rightNeighbor);
                    const canComeBack = neighborExits.includes(currentLabel);
                    if (canGoNext || canComeBack) {
                        ctx.strokeStyle = 'rgba(255, 255, 0, 0.6)';
                        ctx.lineWidth = 1;
                    } else {
                        ctx.strokeStyle = 'rgba(255, 50, 50, 0.8)';
                        ctx.lineWidth = 3;
                    }
                    ctx.beginPath();
                    ctx.moveTo(x + w, y);
                    ctx.lineTo(x + w, y + h);
                    ctx.stroke();
                }

                if (r < SECTORS_TALL - 1) {
                    const downNeighbor = `${UPPER[r + 1]}${LOWER[c]}`;
                    const neighborExits = sectorExits[downNeighbor] || "";
                    const canGoDown = exits.includes(downNeighbor);
                    const canComeUp = neighborExits.includes(currentLabel);
                    if (canGoDown || canComeUp) {
                        ctx.strokeStyle = 'rgba(255, 255, 0, 0.6)';
                        ctx.lineWidth = 1;
                    } else {
                        ctx.strokeStyle = 'rgba(255, 50, 50, 0.8)';
                        ctx.lineWidth = 3;
                    }
                    ctx.beginPath();
                    ctx.moveTo(x, y + h);
                    ctx.lineTo(x + w, y + h);
                    ctx.stroke();
                }
            }
        }
        ctx.restore();
    }

    function updateToolbarUI() {
        document.querySelectorAll('#toolbar button').forEach(btn => btn.classList.remove('active-tool'));
    }

    // ==========================================================================
    // PAINT DISPATCH (brush / forest / road / mountain / flower / path)
    // ==========================================================================
    function handlePaintAction(clientX, clientY) {
        const { tx: tileX, ty: tileY } = screenToTile(clientX, clientY);
        const half = Math.floor(brushSize / 2);

        for (let dy = -half; dy <= half; dy++) {
            for (let dx = -half; dx <= half; dx++) {
                let skip = false;
                if (brushShape === 'circle' && (dx * dx + dy * dy > (half * half) + 0.5)) skip = true;
                if (brushShape === 'diamond' && (Math.abs(dx) + Math.abs(dy) > half)) skip = true;
                if (brushShape === 'hline' && dy !== 0) skip = true;
                if (brushShape === 'vline' && dx !== 0) skip = true;
                if (brushShape === 'triangle' && (Math.abs(dx * 2) > (dy + half))) skip = true;
                if (skip) continue;

                const x = tileX + dx;
                const y = tileY + dy;
                if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) continue;

                if (activeTool === 'forest') { applyForestSpray(x, y); }
                else if (activeTool === 'road') { applySmartRoad(x, y); }
                else if (activeTool === 'mountain') { applySmartMountain(x, y); }
                else if (activeTool === 'flower') { applyFlowerSpray(x, y); }
                else if (activeTool === 'brush') { setTile(x, y, brush); }
                else if (activeTool === 'path') {
                    if (!mapData[y][x].startsWith('B')) setTile(x, y, 'Ba');
                    fixPathTile(x, y);
                    fixPathTile(x, y - 1); fixPathTile(x, y + 1);
                    fixPathTile(x - 1, y); fixPathTile(x + 1, y);
                }
            }
        }
    }

    // ==========================================================================
    // MOUSE / KEYBOARD INPUT
    // ==========================================================================
    canvas.addEventListener('mousedown', (e) => {
        const { tx, ty } = screenToTile(e.clientX, e.clientY);
        if (tx < 0 || tx >= TILE_W || ty < 0 || ty >= TILE_H) return;

        const sectorX = Math.floor(tx / SECTOR_TILE_WIDTH);
        const sectorY = Math.floor(ty / SECTOR_TILE_HEIGHT);
        lastEditedSector = `${UPPER[sectorY]}${LOWER[sectorX]}`;

        if (document.getElementById('toolPopup').style.display === 'block' && exitEditSector !== null) {
            showExitsEditor(lastEditedSector);
        }

        if (activeTool === 'sector_tool' && e.button === 0) {
            const sectorGlobalX = sectorX * SECTOR_TILE_WIDTH;
            const sectorGlobalY = sectorY * SECTOR_TILE_HEIGHT;
            if (currentSectorToolMode === 'fill') fillSectorWithBrush(sectorGlobalX, sectorGlobalY);
            else if (currentSectorToolMode === 'copy') copySector(sectorGlobalX, sectorGlobalY, lastEditedSector);
            else if (currentSectorToolMode === 'paste') pasteSector(sectorGlobalX, sectorGlobalY);
            return;
        }

        if (activeTool === 'stamp' && e.button === 0) {
            applyStamp(tx, ty);
            return;
        }

        if (activeTool === 'items') {
            const label = `${UPPER[sectorY]}${LOWER[sectorX]}`;
            const localX = tx % SECTOR_TILE_WIDTH;
            const localY = ty % SECTOR_TILE_HEIGHT;
            const zIndex = (localY * SECTOR_TILE_WIDTH) + localX;
            const zStr = zIndex.toString().padStart(2, '0');

            if (!sectorItems[label]) sectorItems[label] = [];
            const existingIdx = sectorItems[label].findIndex(it => it.z === zStr);
            if (existingIdx > -1) sectorItems[label].splice(existingIdx, 1);
            else sectorItems[label].push({ id: currentItemCode, z: zStr, data: currentItemData });
            scheduleRender();
            return;
        }

        if (activeTool === 'select') {
            isSelecting = true;
            selectionStart = { x: tx, y: ty };
            selection = { x: tx, y: ty, w: 1, h: 1 };
            scheduleRender();
            return;
        }

        if (activeTool === 'paste') {
            pasteAt(tx, ty);
            return;
        }

        if (activeTool === 'river') {
            if (pathMode === 1) {
                pathStartNode = { x: tx, y: ty };
                pathMode = 2;
                const status = document.getElementById('pathStatus');
                if (status) status.innerHTML = "Click for <b>River End</b>.";
                return;
            }
            if (pathMode === 2) {
                applyDrunkRiver(pathStartNode, { x: tx, y: ty });
                return;
            }
        }

        if (activeTool === 'path') {
            isPainting = true;
            beginStroke();
            handlePaintAction(e.clientX, e.clientY);
            return;
        }

        // Standard editor: paint / eyedropper
        if (e.button === 0) {
            isPainting = true;
            beginStroke();
            handlePaintAction(e.clientX, e.clientY);
        } else if (e.button === 2) {
            brush = mapData[ty][tx];
            updateBrushUI();
        }
    });

    window.addEventListener('mousemove', (e) => {
        if (isSelecting) {
            const { tx, ty } = screenToTile(e.clientX, e.clientY);
            selection.x = Math.min(tx, selectionStart.x);
            selection.y = Math.min(ty, selectionStart.y);
            selection.w = Math.abs(tx - selectionStart.x) + 1;
            selection.h = Math.abs(ty - selectionStart.y) + 1;
            scheduleRender();
        }
        if (isPainting) handlePaintAction(e.clientX, e.clientY);
    });

    window.addEventListener('mouseup', () => {
        if (isPainting) endStroke();
        isPainting = false;
        isSelecting = false;
    });

    canvas.addEventListener('contextmenu', e => e.preventDefault());

    window.addEventListener('keydown', (e) => {
        if (e.ctrlKey) {
            if (e.key === 'c') { if (activeTool === 'select') copySelectionToStamp(); else copySelected(); }
            if (e.key === 'x') copySelected(true);
            if (e.key === 'v') { if (activeTool === 'select') applyStampToSelection(); else activeTool = 'paste'; }
            if (e.key === 'z') undo();
            return;
        }
        if (e.key.length === 1) {
            if (/[A-Z]/.test(e.key)) brush = e.key + brush[1];
            else if (/[a-z]/.test(e.key)) brush = brush[0] + e.key;
            updateBrushUI();
        }
        if (e.key === 'Escape') { exitSelectionMode(); }
    });

    // Camera: scrolling the viewport re-composites visible chunks.
    viewportEl.addEventListener('scroll', () => scheduleRender());
    new ResizeObserver(() => resizeCanvasToViewport()).observe(viewportEl);

    // ==========================================================================
    // EXITS EDITOR
    // ==========================================================================
    let exitEditSector = null;

    function showExitsEditor(sectorLabel) {
        exitEditSector = sectorLabel;
        const currExits = sectorExits[sectorLabel] || '';
        const popup = document.getElementById('toolPopup');

        let r = UPPER.indexOf(sectorLabel.charAt(0));
        let c = LOWER.indexOf(sectorLabel.charAt(1));

        const n = (r > 0) ? UPPER[r-1] + LOWER[c] : null;
        const s = (r < SECTORS_TALL - 1) ? UPPER[r+1] + LOWER[c] : null;
        const w = (c > 0) ? UPPER[r] + LOWER[c-1] : null;
        const e = (c < SECTORS_WIDE - 1) ? UPPER[r] + LOWER[c+1] : null;

        const isSelected = (code) => currExits.includes(code);

    function toggleExit(targetCode) {
        if (!targetCode || targetCode === 'null') return;
        let input = document.getElementById('exitsInput');
        let val = input.value;
        let parts = val.match(/.{1,2}/g) || [];
        if (parts.includes(targetCode)) parts = parts.filter(p => p !== targetCode);
        else if (parts.length < 8) parts.push(targetCode);
        input.value = parts.join("");
        sectorExits[exitEditSector] = input.value;
        showExitsEditor(exitEditSector);
        scheduleRender();
    }

    function validateExitsInput() {
        const input = document.getElementById('exitsInput');
        input.value = input.value.replace(/[^a-zA-Z0-9%()+,:;=@\[\]_{}^-]/g, '');
        sectorExits[exitEditSector] = input.value;
        scheduleRender();
    }

    // Generates the 4 "natural" exits (within map bounds) for a sector.
    function resetExitsToNatural(sectorLabel) {
        let r = UPPER.indexOf(sectorLabel.charAt(0));
        let c = LOWER.indexOf(sectorLabel.charAt(1));
        let exits = "";
        if (r > 0) exits += `${UPPER[r-1]}${LOWER[c]}`;
        if (r < SECTORS_TALL - 1) exits += `${UPPER[r+1]}${LOWER[c]}`;
        if (c > 0) exits += `${UPPER[r]}${LOWER[c-1]}`;
        if (c < SECTORS_WIDE - 1) exits += `${UPPER[r]}${LOWER[c+1]}`;
        document.getElementById('exitsInput').value = exits;
        validateExitsInput();
    }

    function autoCalculateExits(isRound) {
        const rowCount = SECTORS_TALL;
        const colCount = SECTORS_WIDE;
        sectorExits = {};
        for (let r = 0; r < rowCount; r++) {
            for (let c = 0; c < colCount; c++) {
                const currentLabel = `${UPPER[r]}${LOWER[c]}`;
                let neighbors = [];
                const directions = [
                    { dr: -1, dc: 0 }, { dr: 1, dc: 0 }, { dr: 0, dc: -1 }, { dr: 0, dc: 1 }
                ];
                directions.forEach(dir => {
                    let nr = r + dir.dr, nc = c + dir.dc;
                    if (isRound) {
                        nr = (nr + rowCount) % rowCount;
                        nc = (nc + colCount) % colCount;
                        neighbors.push(`${UPPER[nr]}${LOWER[nc]}`);
                    } else if (nr >= 0 && nr < rowCount && nc >= 0 && nc < colCount) {
                        neighbors.push(`${UPPER[nr]}${LOWER[nc]}`);
                    }
                });
                sectorExits[currentLabel] = neighbors.join("");
            }
        }
        alert(`Exits calculated for ${isRound ? 'Round' : 'Flat'} world!`);
        scheduleRender();
    }

    async function importMap() {

    async function processMap(text) {
        console.log('processMap=' + text);

        const lines = text.split('\n');
        const SECTOR_W = SECTOR_TILE_WIDTH;
        const SECTOR_H = SECTOR_TILE_HEIGHT;

        const aLine = lines.find(l => l.startsWith('a='));
        if (aLine) {
          const m = aLine.match(/W4([A-Za-z]{2})/);
          if (m) resizeMapBounds(m[1]);
        }

        mapData = [];
        for (let y = 0; y < TILE_H; y++) {
            mapData[y] = Array(TILE_W).fill('Ga');
        }

        sectorExits = {};
        sectorItems = {};
        preservedLines = {};

        uniqueTileCodes.clear();
        uniqueItemCodes.clear();

        lines.forEach(line => {
            if (!line.includes('=')) return;
            const [label, allData] = line.trim().split('=');
            if (!label || !allData) return;

            const rChar = label.charAt(0);
            const cChar = label.charAt(1);
            const rIndex = UPPER.indexOf(rChar);
            const cIndex = LOWER.indexOf(cChar);

            // Anything that isn't a valid Aa-Zz sector label for THIS map size
            // (e.g. city map data, scripts) is preserved untouched.
            if (label.length !== 2 || rIndex === -1 || cIndex === -1 || rIndex >= SECTORS_TALL || cIndex >= SECTORS_WIDE) {
                preservedLines[label] = allData;
                return;
            }

            const parts = allData.split('.');
            const mainData = parts[0];
            const objectData = parts[1] || "";

            const tilesLength = SECTOR_W * SECTOR_H * 2;
            const tilesString = mainData.substring(0, tilesLength);
            const exitString = mainData.substring(tilesLength);
            sectorExits[label] = exitString;

            for (let i = 0; i < SECTOR_W * SECTOR_H; i++) {
                const tileCode = tilesString.substring(i * 2, (i * 2) + 2);
                const sx = i % SECTOR_W;
                const sy = Math.floor(i / SECTOR_W);
                const globalX = (cIndex * SECTOR_W) + sx;
                const globalY = (rIndex * SECTOR_H) + sy;
                if (globalX < TILE_W && globalY < TILE_H) {
                    mapData[globalY][globalX] = tileCode || 'Ga';
                    uniqueTileCodes.add(mapData[globalY][globalX]);
                }
            }

            if (objectData) {
                sectorItems[label] = [];
                const objectChunks = objectData.split('~');
                objectChunks.forEach(chunk => {
                    if (!chunk) return;
                    const pipeIdx = chunk.indexOf('|');
                    const meta = pipeIdx !== -1 ? chunk.substring(0, pipeIdx) : chunk;
                    const logic = pipeIdx !== -1 ? chunk.substring(pipeIdx + 1) : "";
                    if (meta) {
                        if (meta.length >= 6) {
                            const item = { id: meta.substring(0, 2), z: meta.substring(2, 4), data: meta.substring(4, 6), logic: logic || "" };
                            sectorItems[label].push(item);
                            uniqueItemCodes.add(item.id);
                        } else if (meta.length >= 4) {
                            const item = { id: meta.substring(0, 2), z: meta.substring(2, 4), data: "", logic: logic || "" };
                            sectorItems[label].push(item);
                            uniqueItemCodes.add(item.id);
                        }
                    }
                });
            }
        });

        // Full map reload -- drop every cached chunk so they rebuild lazily
        // from the new mapData the next time they're scrolled into view.
        sectorChunks.clear();
        mapHistory = [];

        await preloadAllImages();
        scheduleRender();
    }

    function exportMap() {
        const SECTOR_W = SECTOR_TILE_WIDTH;
        const SECTOR_H = SECTOR_TILE_HEIGHT;
        let output = "";

        for (let r = 0; r < SECTORS_TALL; r++) {
            for (let c = 0; c < SECTORS_WIDE; c++) {
                const sectorLabel = `${UPPER[r]}${LOWER[c]}`;
                let tilesString = "";
                for (let sy = 0; sy < SECTOR_H; sy++) {
                    for (let sx = 0; sx < SECTOR_W; sx++) {
                        const globalX = (c * SECTOR_W) + sx;
                        const globalY = (r * SECTOR_H) + sy;
                        tilesString += mapData[globalY][globalX];
                    }
                }
                const exits = sectorExits[sectorLabel] || "";
                let objectString = "";
                if (sectorItems[sectorLabel] && sectorItems[sectorLabel].length > 0) {
                    const objSerialized = sectorItems[sectorLabel].map(it => {
                        let meta = it.id + it.z;
                        if (it.data && it.data.trim().length === 2) meta += it.data;
                        return it.logic ? `${meta}|${it.logic}` : meta;
                    }).join('~');
                    objectString = "." + objSerialized;
                }
                output += `${sectorLabel}=${tilesString}${exits}${objectString}\n`;
            }
        }

        for (const [key, value] of Object.entries(preservedLines)) {
            output += `${key}=${value}\n`;
        }

        navigator.clipboard.writeText(output.trim()).then(() => {
            alert("Map exported to clipboard in Object-compatible format!");
        }).catch(err => {
            console.error('Error copying to clipboard', err);
        });
    }

    function fixPathTile(x, y) {
        if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) return;
        if (!mapData[y][x].startsWith('B')) return;

        const isP = (nx, ny) => {
            if (nx < 0 || nx >= TILE_W || ny < 0 || ny >= TILE_H) return false;
            return mapData[ny][nx].startsWith('B');
        };

        const n = isP(x, y - 1), s = isP(x, y + 1), w = isP(x - 1, y), e = isP(x + 1, y);
        let tile = 'Ba';

        if (n && s && e && w) tile = 'Bc';
        else if (n && s && w) tile = 'Bh';
        else if (n && s && e) tile = 'Bi';
        else if (w && e && n) tile = 'Bj';
        else if (w && e && s) tile = 'Bk';
        else if (n && s) tile = 'Ba';
        else if (e && w) tile = 'Bb';
        else if (n && w) tile = 'Bd';
        else if (n && e) tile = 'Be';
        else if (s && e) tile = 'Bf';
        else if (s && w) tile = 'Bg';
        else if (n) tile = 'Bm';
        else if (s) tile = 'Bn';
        else if (e) tile = 'Bk';
        else if (w) tile = 'Bl';

        setTile(x, y, tile);
    }

    function isWalkable(tileCode) {
        return tileCode < "Ma";
    }

    function findPath(start, end) {
        const openSet = [start];
        const cameFrom = new Map();
        const gScore = new Map();
        const fScore = new Map();
        const posKey = (p) => `${p.x},${p.y}`;

        gScore.set(posKey(start), 0);
        fScore.set(posKey(start), Math.abs(start.x - end.x) + Math.abs(start.y - end.y));

        while (openSet.length > 0) {
            openSet.sort((a, b) => fScore.get(posKey(a)) - fScore.get(posKey(b)));
            let current = openSet.shift();

            if (current.x === end.x && current.y === end.y) {
                const path = [];
                while (current) {
                    path.push(current);
                    current = cameFrom.get(posKey(current));
                }
                return path.reverse();
            }

            const neighbors = [
                {x: current.x, y: current.y - 1}, {x: current.x, y: current.y + 1},
                {x: current.x - 1, y: current.y}, {x: current.x + 1, y: current.y}
            ];

            for (let neighbor of neighbors) {
                if (neighbor.x < 0 || neighbor.x >= TILE_W || neighbor.y < 0 || neighbor.y >= TILE_H) continue;
                if (!isWalkable(mapData[neighbor.y][neighbor.x])) continue;

                let tentativeG = gScore.get(posKey(current)) + 1 + (Math.random() * 0.2);
                if (!gScore.has(posKey(neighbor)) || tentativeG < gScore.get(posKey(neighbor))) {
                    cameFrom.set(posKey(neighbor), current);
                    gScore.set(posKey(neighbor), tentativeG);
                    fScore.set(posKey(neighbor), tentativeG + Math.abs(neighbor.x - end.x) + Math.abs(neighbor.y - end.y));
                    if (!openSet.find(p => p.x === neighbor.x && p.y === neighbor.y)) {
                        openSet.push(neighbor);
                    }
                }
            }
        }
        return null;
    }

    function applyPathToMap(path) {
        beginStroke();
        for (let i = 0; i < path.length; i++) {
            let curr = path[i];
            let prev = path[i - 1];
            let next = path[i + 1];
            let connections = { n: false, s: false, e: false, w: false };

            if (prev) {
                if (prev.y < curr.y) connections.n = true;
                if (prev.y > curr.y) connections.s = true;
                if (prev.x < curr.x) connections.w = true;
                if (prev.x > curr.x) connections.e = true;
            }
            if (next) {
                if (next.y < curr.y) connections.n = true;
                if (next.y > curr.y) connections.s = true;
                if (next.x < curr.x) connections.w = true;
                if (next.x > curr.x) connections.e = true;
            }

            let existing = mapData[curr.y][curr.x];
            if (existing.startsWith('B')) {
                if (existing === 'Ba') { connections.n = true; connections.s = true; }
                if (existing === 'Bb') { connections.e = true; connections.w = true; }
            }

            let tile = 'Ba';
            const {n, s, e, w} = connections;
            if (n && s && e && w) tile = 'Bc';
            else if (n && s && w) tile = 'Bh';
            else if (n && s && e) tile = 'Bi';
            else if (n && s) tile = 'Ba';
            else if (e && w) tile = 'Bb';
            else if (n && w) tile = 'Bd';
            else if (n && e) tile = 'Be';
            else if (s && e) tile = 'Bf';
            else if (s && w) tile = 'Bg';
            else if (n) tile = 'Bm';
            else if (s) tile = 'Bn';
            else if (e) tile = 'Bk';
            else if (w) tile = 'Bl';

            setTile(curr.x, curr.y, tile);
        }
        endStroke();
    }

        clipboard = out;
        if (isCut) endStroke();
        console.log("Copied to internal clipboard:\n" + clipboard);

    function pasteAt(tileX, tileY) {
        if (!clipboard) return;
        beginStroke();
        const rows = clipboard.split('\n');
        rows.forEach((rowStr, dy) => {
            const tiles = rowStr.match(/.{1,2}/g);
            if (tiles) {
                tiles.forEach((code, dx) => {
                    setTile(tileX + dx, tileY + dy, code);
                });
            }
        });
        endStroke();
    }

    function applyStampToSelection() {
        const text = document.getElementById('stampInput').value.trim();
        if (!text) {
            document.getElementById('stampStatus').innerText = "Nothing to paste!";
            return;
        }
        if (!selection) {
            alert("Click or drag on the map to set the paste origin.");
            return;
        }
        beginStroke();
        const originX = selection.x, originY = selection.y;
        const lines = text.split('\n');
        lines.forEach((line, dy) => {
            const cleanLine = line.replace(/\s+/g, '');
            const tiles = cleanLine.match(/.{1,2}/g);
            if (tiles) {
                tiles.forEach((code, dx) => {
                    setTile(originX + dx, originY + dy, code);
                });
            }
        });
        endStroke();
        document.getElementById('stampStatus').innerText = "Pasted at (" + originX + "," + originY + ")";

        const text = document.getElementById('stampInput').value.trim();

        const lines = text.split('\n');
        currentStamp = lines.map(line => {
            const cleanLine = line.replace(/\s+/g, '');
            const matches = cleanLine.match(/.{1,2}/g);
            return matches || [];
        });
        const height = currentStamp.length;
        const width = currentStamp[0] ? currentStamp[0].length : 0;
        document.getElementById('stampStatus').innerText = `Loaded: ${width}x${height} stamp. Click map to place.`;
    }

        for (let y = 0; y < currentStamp.length; y++) {
            for (let x = 0; x < currentStamp[y].length; x++) {
                setTile(tx + x, ty + y, currentStamp[y][x]);

        }
        endStroke();
    }

            <div id="toolPopupHeader" style="cursor:move; background:#2d5a27; padding:8px; border-radius:6px 6px 0 0; font-weight:bold;">
                Forest Sprayer (2-Tile Trees)
                <span style="float:right;cursor:pointer;" onclick="document.getElementById('toolPopup').style.display='none'">✕</span>
            </div>
            <div style="padding:14px;">
                <div style="margin-bottom:12px;">
                    <b>Tree Type:</b><br>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px; margin-top:5px;">
                        <button onclick="setForestSet('green')" style="${currentForestSet==='green'?'background:#2ecc71;':''}">Green</button>
                        <button onclick="setForestSet('white')" style="${currentForestSet==='white'?'background:#ecf0f1;color:#333':''}">White</button>
                        <button onclick="setForestSet('red')" style="${currentForestSet==='red'?'background:#e74c3c;':''}">Red</button>
                        <button onclick="setForestSet('all')" style="${currentForestSet==='all'?'background:#f1c40f;color:#333':''}">Mixed</button>
                    </div>
                </div>
                <div style="margin-bottom:10px;">
                    <b>Spray Density:</b><br>
                    <input type="range" min="1" max="50" value="${forestDensity}" oninput="forestDensity=parseInt(this.value)">
                </div>
                <p style="font-size:0.8em; color:#aaa;">Requires 1x2 vertical grass space. Base (Ra/Rp) + Top (Rb/Rc/Rd).</p>
                <button onclick="activeTool='brush'; document.getElementById('toolPopup').style.display='none'">Done</button>
            </div>
        `;
        popup.style.display = "block";
        makeDraggable(popup, document.getElementById('toolPopupHeader'));
    }

    function setForestSet(set) {
        currentForestSet = set;
        showForestTool();
    }

    function applyForestSpray(x, y) {
        if (Math.random() * 100 > forestDensity) return;
        if (y < 1) return;

        const isG = (tx, ty) => {
            const code = mapData[ty][tx];
            return code.startsWith('G') || code === 'Fa';
        };
        if (!isG(x, y) || !isG(x, y - 1)) return;

        let type = currentForestSet;
        if (type === 'all') {
            const roll = Math.random();
            if (roll < 0.6) type = 'green';
            else if (roll < 0.8) type = 'white';
            else type = 'red';
        }

        let topTile = 'Rb';
        let baseTile = 'Ra';
        if (type === 'white') topTile = 'Rc';
        if (type === 'red') {
            topTile = 'Rd';
            if (Math.random() < 0.15) baseTile = 'Rp';
        }

        setTile(x, y, baseTile);
        setTile(x, y - 1, topTile);
    }

    // ==========================================================================
    // BRICK ROAD TOOL
    // ==========================================================================
    function showRoadTool() {
        activeTool = 'road';
        const popup = document.getElementById('toolPopup');
        popup.innerHTML = `
            <div id="toolPopupHeader" style="cursor:move; background:#7f8c8d; padding:8px; border-radius:6px 6px 0 0; font-weight:bold;">
                Brick Road & Plaza Tool
                <span style="float:right;cursor:pointer;" onclick="document.getElementById('toolPopup').style.display='none'">✕</span>
            </div>
            <div style="padding:14px;">
                <p>Painting with this tool connects bricks (Ea-Ei).</p>
                <p style="font-size:0.85em; color:#aaa;">
                    - Use a small brush for narrow paths.<br>
                    - Use a large brush for open plazas.
                </p>
                <button onclick="activeTool='brush'; document.getElementById('toolPopup').style.display='none'">Done</button>
            </div>
        `;
        popup.style.display = "block";
        makeDraggable(popup, document.getElementById('toolPopupHeader'));
    }

    function isBrick(x, y) {
        if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) return false;
        return mapData[y][x].startsWith('E');
    }

    function getSmartBrickTile(x, y) {
        const N = isBrick(x, y - 1);
        const S = isBrick(x, y + 1);
        const W = isBrick(x - 1, y);
        const E = isBrick(x + 1, y);

        if (!N && !W && S && E) return 'Ef';
        if (!N && !E && S && W) return 'Ei';
        if (!S && !W && N && E) return 'Eh';
        if (!S && !E && N && W) return 'Eg';
        if (!N && S) return 'Ed';
        if (!S && N) return 'Ee';
        if (!W && E) return 'Eb';
        if (!E && W) return 'Ec';
        return 'Ea';
    }

    function applySmartRoad(x, y) {
        setTile(x, y, 'Ea');
        const pointsToUpdate = [
            {x: x, y: y},
            {x: x, y: y - 1}, {x: x, y: y + 1},
            {x: x - 1, y: y}, {x: x + 1, y: y}
        ];
        pointsToUpdate.forEach(p => {
            if (isBrick(p.x, p.y)) setTile(p.x, p.y, getSmartBrickTile(p.x, p.y));
        });
    }

    // ==========================================================================
    // ITEMS TOOL
    // ==========================================================================
    function showItemsTool() {
        activeTool = 'items';
        const popup = document.getElementById('toolPopup');
        popup.innerHTML = `
            <div id="toolPopupHeader" style="cursor:move; background:#b33939; padding:8px; border-radius:6px 6px 0 0; font-weight:bold;">
                Static Items Tool
                <span style="float:right;cursor:pointer;" onclick="document.getElementById('toolPopup').style.display='none'">✕</span>
            </div>
            <div style="padding:16px;">
                <div style="margin-bottom:10px;">
                    <label>Item (2 chars): </label>
                    <input type="text" id="itemCode" maxlength="2" value="${currentItemCode}" style="width:40px;">
                </div>
                <div style="margin-bottom:10px;">
                    <label>Data (2 chars): </label>
                    <input type="text" id="itemData" maxlength="2" value="${currentItemData}" style="width:40px;">
                </div>
                <p style="font-size:0.8em; color:#aaa;">Click map to place item. Click existing item to remove.</p>
                <button onclick="activeTool='brush'; document.getElementById('toolPopup').style.display='none'">Done</button>
            </div>
        `;
        popup.style.display = "block";
        makeDraggable(popup, document.getElementById('toolPopupHeader'));
        document.getElementById('itemCode').oninput = (e) => currentItemCode = e.target.value.substring(0,2);
        document.getElementById('itemData').oninput = (e) => currentItemData = e.target.value.substring(0,2);
    }

    window.onload = function() {
        renderToolbar();
        initMap();
    };

</script>
</body>
</html>
