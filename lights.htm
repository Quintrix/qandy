<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Synth: Transposition Matrix</title>
    <style>
        :root { --bg: #08080a; --neon: #00f2ff; }
        body { 
            background: var(--bg); color: var(--neon); 
            font-family: 'Courier New', monospace;
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; margin: 0; overflow: hidden;
        }
        h1 { font-weight: 200; letter-spacing: 5px; margin: 15px 0; text-shadow: 0 0 10px var(--neon); }
        
        #grid-container {
            padding: 8px; background: #000;
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.15);
            border: 2px solid #222; border-radius: 4px;
        }

        table { border-collapse: collapse; }
        td {
            width: 20px; height: 20px; border: 1px solid #151515;
            cursor: crosshair; transition: background 0.1s;
        }

        .active-pulse { animation: pulse 0.1s infinite; }
        @keyframes pulse { 50% { filter: brightness(1.8); } }

        .keyboard { display: flex; gap: 4px; margin: 20px 0; background: #111; padding: 10px; border-radius: 5px; }
        .key {
            width: 55px; height: 90px; border: none; border-radius: 0 0 3px 3px;
            cursor: pointer; font-weight: bold; font-size: 0.7rem;
            display: flex; align-items: flex-end; justify-content: center;
            padding-bottom: 10px; transition: 0.1s; text-transform: uppercase;
        }
        .key:active { transform: scaleY(0.95); filter: brightness(1.4); }

        .controls { text-align: center; font-size: 0.8rem; }
        .mode-toggle { margin-bottom: 10px; color: #888; }
        button.tool { background: #222; color: #0ff; border: 1px solid #444; padding: 5px 10px; cursor: pointer; }
        button.tool:hover { background: #333; }
    </style>
</head>
<body>

    <h1>TRANSPOSE_MATRIX.v3</h1>

    <div id="grid-container"></div>

    <div class="keyboard">
        <button class="key" style="background: #444; color: #fff;" onclick="transpose(0)">Rest<br>(0)</button>
        <button class="key" style="background: #00ff00; color: #000;" onclick="transpose(1)">Shift<br>(C)</button>
        <button class="key" style="background: #ff0000; color: #fff;" onclick="transpose(2)">Shift<br>(D)</button>
        <button class="key" style="background: #0000ff; color: #fff;" onclick="transpose(3)">Shift<br>(E)</button>
        <button class="key" style="background: #ffff00; color: #000;" onclick="transpose(4)">Shift<br>(F)</button>
        <button class="key" style="background: #ff00ff; color: #fff;" onclick="transpose(5)">Shift<br>(G)</button>
        <button class="key" style="background: #00ffff; color: #000;" onclick="transpose(6)">Shift<br>(A)</button>
    </div>

    <div class="controls">
        <div class="mode-toggle">
            <label><input type="checkbox" id="shiftAll"> Affect 'Off' Tiles (Chaos Mode)</label>
        </div>
        <button class="tool" onclick="randomizeGrid()">Randomize</button>
        <button class="tool" onclick="clearGrid()">Zero Out</button>
        <input type="range" id="speed" min="20" max="300" value="80">
    </div>

    <script>
        const size = 18;
        let grid = [];
        const colors = ['#111', '#00ff00', '#ff0000', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
        const container = document.getElementById('grid-container');
        const speedInput = document.getElementById('speed');
        const shiftAllCheck = document.getElementById('shiftAll');

        function initGrid() {
            const table = document.createElement('table');
            for (let r = 0; r < size; r++) {
                grid[r] = [];
                const tr = document.createElement('tr');
                for (let c = 0; c < size; c++) {
                    const td = document.createElement('td');
                    grid[r][c] = { state: false, type: 0, element: td };
                    td.onclick = () => {
                        grid[r][c].type = (grid[r][c].type + 1) % colors.length;
                        updateDisplay();
                    };
                    tr.appendChild(td);
                }
                table.appendChild(tr);
            }
            container.appendChild(table);
        }

        // --- THE TRANSPOSITION METRIC ---
        function transpose(amount) {
            if (amount === 0) return; // Rest key does nothing to identity
            
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const cell = grid[r][c];
                    // If Chaos Mode is off, we only shift tiles that are already logic tiles
                    if (shiftAllCheck.checked || cell.type !== 0) {
                        cell.type = ((cell.type + amount - 1) % (colors.length - 1)) + 1;
                        // The math above ensures we cycle 1-6 and stay away from 0 (Grey)
                        // unless Chaos Mode is on.
                        if (shiftAllCheck.checked) {
                             cell.type = (cell.type + amount) % colors.length;
                        }
                    }
                }
            }
            updateDisplay();
        }

        function clearGrid() {
            grid.forEach(row => row.forEach(c => { c.type = 0; c.state = false; }));
            updateDisplay();
        }

        function randomizeGrid() {
            grid.forEach(row => row.forEach(c => c.type = Math.floor(Math.random() * colors.length)));
            updateDisplay();
        }

        function updateDisplay() {
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const cell = grid[r][c];
                    const color = colors[cell.type];
                    if (cell.state && cell.type !== 0) {
                        cell.element.style.background = color;
                        cell.element.style.boxShadow = `0 0 15px ${color}`;
                        cell.element.classList.add('active-pulse');
                    } else {
                        cell.element.style.background = cell.type === 0 ? '#111' : 'transparent';
                        cell.element.style.border = `1px solid ${cell.type === 0 ? '#222' : color}`;
                        cell.element.style.boxShadow = 'none';
                        cell.element.classList.remove('active-pulse');
                    }
                }
            }
        }

        function tick() {
            let nextStates = grid.map(row => row.map(cell => cell.state));

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const cell = grid[r][c];
                    const type = cell.type;

                    if (type === 5) nextStates[r][c] = !cell.state; // PULSE

                    if (!cell.state) continue;

                    if (type === 1 && c + 1 < size) nextStates[r][c+1] = true; // FLOW
                    if (type === 2 && c + 1 < size) nextStates[r][c+1] = !grid[r][c+1].state; // NOT
                    if (type === 3) nextStates[r][c] = true; // STORE
                    
                    if (type === 4) { // SPLIT
                        if (r + 1 < size) nextStates[r+1][c] = true;
                        if (r - 1 >= 0) nextStates[r-1][c] = true;
                        if (c + 1 < size) nextStates[r][c+1] = true;
                        if (c - 1 >= 0) nextStates[r][c-1] = true;
                    }

                    if (type === 6) { // XOR
                        const up = (r - 1 >= 0) ? grid[r-1][c].state : false;
                        const down = (r + 1 < size) ? grid[r+1][c].state : false;
                        if (up !== down && c + 1 < size) nextStates[r][c+1] = true;
                    }

                    if (type !== 3 && type !== 5) nextStates[r][c] = false;
                }
            }

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    grid[r][c].state = nextStates[r][c];
                }
            }
            updateDisplay();
            setTimeout(tick, speedInput.value);
        }

        initGrid();
        randomizeGrid();
        tick();
    </script>
</body>
</html>
