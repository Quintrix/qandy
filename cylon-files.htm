<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cylon Files</title>
<script src="cylon-sdk.js"></script>
<style>
    /* Clean Grouped List View Styles */
    .file-row {
        display: flex; align-items: center; padding: 12px 16px; cursor: pointer;
        border-bottom: 1px dashed var(--sel-bg, #333); transition: background 0.1s;
    }
    .file-row:hover { background-color: var(--sel-bg, #111); }
    .f-icon { width: 28px; height: 28px; image-rendering: pixelated; margin-right: 16px; flex-shrink: 0; filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.5)); }
    .f-name { flex: 1; font-weight: bold; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .f-meta { color: var(--fg-color, #0f0); font-size: 14px; opacity: 0.7; margin-left: 10px; }
</style>
</head>
<body>
<div id="files-container" style="display: flex; flex-direction: column; overflow-y: auto; height: 100%; box-sizing: border-box; background-color: var(--bg-color, #000); color: var(--fg-color, #0f0); font-family: var(--font-face, monospace);"></div>
<script>
    window.onload = async function() {
        CylonSDK.injectDesktopStyles();

        if (!window.parent || !window.parent.CylonDOS) {
            document.getElementById('files-container').innerHTML = "<h3 style='padding:20px;'>Error: CylonDOS not connected.</h3>";
            return;
        }

        let dos = window.parent.CylonDOS;
        let currentDir = dos.cwd || '/';
        let container = document.getElementById('files-container');
        
        try {
            // Strictly fetch current directory avoiding deep recursive logic
            let rawFiles = await dos.dir(currentDir);
            
            let folders = [];
            let fileGroups = {}; 

            // Parse and Group
            for (let f of rawFiles) {
                let internalPath = f.name.replace(/[<>]/g, '');
                let name = internalPath.substring(internalPath.lastIndexOf('/') + 1);
                
                if (f.type === 'directory') {
                    folders.push({ name: name, fullPath: '/' + internalPath });
                } else {
                    let dotIdx = name.lastIndexOf('.');
                    let base = dotIdx > 0 ? name.substring(0, dotIdx) : name;
                    let ext = dotIdx > 0 ? name.substring(dotIdx).toLowerCase() : '(none)';
                    
                    if (!fileGroups[base]) fileGroups[base] = [];
                    fileGroups[base].push({ name: name, ext: ext, fullPath: '/' + internalPath, size: f.size });
                }
            }

            // Up Directory Row
            if (currentDir !== '/' && currentDir !== '') {
                container.appendChild(makeRow('q/folder.png', '.. (Up)', '', async () => {
                    await window.parent.injectAndExecute('cd ..');
                    window.location.reload(); 
                }));
            }

            // Folder Rows
            folders.sort((a,b) => a.name.localeCompare(b.name)).forEach(dir => {
                container.appendChild(makeRow('q/folder.png', dir.name, '', () => {
                    window.parent.injectAndExecute(`cd "${dir.fullPath}"`);
                    setTimeout(() => window.location.reload(), 100);
                }));
            });

            function getIconForBase(exts) {
                if (exts.includes('.htm') || exts.includes('.html')) return 'q/cylon.png';
                if (exts.includes('.js')) return 'q/dot-js.png';
                if (exts.includes('.txt')) return 'q/dot-txt.png';
                if (exts.includes('.json')) return 'q/dot-json.png';
                if (exts.includes('.cfg')) return 'q/folder.png';
                return 'q/file.png';
            }

            // File Group Rows
            Object.keys(fileGroups).sort().forEach(base => {
                let files = fileGroups[base];
                let exts = files.map(f => f.ext);
                let metaText = files.length > 1 ? `[${files.length} files]` : files[0].ext;
                
                let icon = getIconForBase(exts);
                
                let row = makeRow(icon, base, metaText, (e) => {
                    // Fast action if only 1 file in group
                    if (files.length === 1) {
                        showActionMenu(e, files[0], base);
                    } else {
                        // Open Extension Selector Menu
                        let extMenu = files.map(f => ({
                            label: `[ ${f.ext} ]`,
                            action: () => setTimeout(() => showActionMenu(e, f, base), 50)
                        }));
                        window.parent.CylonPopManager.showContextMenu(e, extMenu);
                    }
                });
                
                container.appendChild(row);
            });

        } catch (err) {
            console.error("File Explorer Error:", err);
        }

        // Action Engine 
        function showActionMenu(e, f, baseName) {
            window.parent.CylonPopManager.showContextMenu(e, [
                { label: `Load ${f.name}`, action: () => {
                    window.parent.injectAndExecute(`load "${f.fullPath}"`);
                }},
                { label: `Add to Desktop`, action: async () => {
                    try {
                        let dos = window.parent.CylonDOS;
                        
                        // Safety measure to ensure we have a valid desktop mount
                        await window.parent.injectAndExecute(`iferror mount desktop idb`);
                        
                        let desktopPath = 'desktop:/w/Aa';
                        let deskFiles = [];
                        try { deskFiles = await dos.dir(desktopPath); } catch(e) {}
                        
                        // Scan for occupied Z index slots on the desktop
                        let usedZ = new Set();
                        deskFiles.forEach(df => {
                            let fn = df.name.replace(/[<>]/g, '').split('/').pop();
                            if (fn.length >= 4 && fn !== 't' && fn !== 'm') {
                                usedZ.add(parseInt(fn.substring(2,4), 16));
                            }
                        });
                        
                        // Discover next free slot
                        let freeZ = 0; 
                        while(usedZ.has(freeZ) && freeZ <= 255) freeZ++;
                        if (freeZ > 255) { window.parent.print("[.3]Desktop is full![.]\\n"); return; }
                        
                        let hexZ = freeZ.toString(16).padStart(2, '0').toUpperCase();
                        
                        // Map extension to GFX Icon IDs
                        let iconId = 'Fi'; 
                        if (f.ext === '.htm' || f.ext === '.html') iconId = 'Aa';
                        else if (f.ext === '.js') iconId = 'Lj';
                        else if (f.ext === '.txt' || f.ext === '.cfg' || f.ext === '.json') iconId = 'Tx';
                        else if (f.ext === '.png' || f.ext === '.jpg' || f.ext === '.gif') iconId = 'Im';
                        
                        let safeLabel = baseName.substring(0, 10).replace(/[^a-zA-Z0-9_\- ]/g, '');
                        let targetFile = `${desktopPath}/${iconId}${hexZ}${safeLabel}`;
                        let cmd = `load "${f.fullPath}"`;
                        
                        // Execute physical file construction directly to VFS via terminal save
                        await window.parent.injectAndExecute(`save "${targetFile}" "${cmd}"`);
                        window.parent.print(`\\n[.4]Icon added to Desktop at ${targetFile}[.]\\n`);
                        
                    } catch(err) {
                        window.parent.print(`\\n[.3]Failed to add icon: ${err.message}[.]\\n`);
                    }
                }},
                { label: `Delete ${f.name}`, action: () => {
                    window.parent.injectAndExecute(`delete "${f.fullPath}" -y`);
                    setTimeout(() => window.location.reload(), 100);
                }}
            ]);
        }

        // GUI Row Constructor
        function makeRow(icon, name, metaText, onClick) {
            let row = document.createElement('div');
            row.className = 'file-row';
            
            let img = document.createElement('img');
            img.src = icon;
            img.className = 'f-icon';
            img.onerror = function() { this.src = 'q/file.png'; };
            
            let nameDiv = document.createElement('div');
            nameDiv.textContent = name;
            nameDiv.className = 'f-name';
            
            let metaDiv = document.createElement('div');
            metaDiv.textContent = metaText;
            metaDiv.className = 'f-meta';
            
            row.appendChild(img);
            row.appendChild(nameDiv);
            row.appendChild(metaDiv);
            row.onclick = onClick;
            
            return row;
        }
    };
</script>
</body>
</html>
