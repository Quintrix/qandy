<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>.GFX EDITOR</title>
    <style>
        body {
            background: #222;
            color: #eee;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #toolbar {
            background: #333;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #444;
        }
        #outerContainer { display: flex; flex-direction: row; height: 100vh; }
        #sideToolbar {
          width: 56px;
          background: #202a36;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 8px 0;
          border-right: 1px solid #333;
          gap: 14px;
        }
        #viewport {
            flex-grow: 1;
            overflow: auto;
            background: #111;
            padding: 20px;
        }
        canvas {
            background: #000;
            cursor: crosshair;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .brush-info {
            font-weight: bold;
            font-family: monospace;
            font-size: 1.2em;
            background: #444;
            padding: 5px 10px;
            border-radius: 4px;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
            background: #068;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover { background: #07a; }
    </style>
</head>
<body>

<div id="toolbar"></div>

<div id="outerContainer">
    <div id="viewport"> <canvas id="mapCanvas"></canvas></div>
</div>

<div id="toolPopup" style="display:none; position:fixed; left:200px; top:100px; background:#333; border:2px solid #0af; color:#eee; border-radius:8px; z-index:1000; min-width:250px; min-height:120px; box-shadow:0 6px 32px #000a"></div>

<script>
const SECTORS_WIDE = 8, SECTORS_TALL = 12;
    const SECTOR_TILE_WIDTH = 8, SECTOR_TILE_HEIGHT = 12;

    var TILE_W = 64;
    var TILE_H = 144;
    var TILE_SIZE = 32; 
    var NOISE_TILES = ['Fa', 'Gb', 'Gc', 'Gd', 'Ge', 'Gf', 'Gg'];
    
    let sectorExits = {};  // Example: { "A1": "A2B1", "A2": "A1A3B2", ... }
    let lastEditedSector = "A1";
    
    let brush = "Ga";
    let brushSize = 1; 
    let mapData = [];
    const imageCache = {};

    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    const brushDisplay = document.getElementById('brushDisplay');

    function initMap() {
        canvas.width = TILE_W * TILE_SIZE;
        canvas.height = TILE_H * TILE_SIZE;

        for (let y = 0; y < TILE_H; y++) {
            mapData[y] = [];
            for (let x = 0; x < TILE_W; x++) {
                mapData[y][x] = NOISE_TILES[Math.floor(Math.random() * NOISE_TILES.length)];
            }
        }
        renderFullMap();
    }

function renderToolbar() {
    const toolbar = document.getElementById('toolbar');
    toolbar.innerHTML = ''; // Remove the brush display (now handled in the popup)

    function addButton(label, onclick) {
        var btn = document.createElement('button');
        btn.innerText = label;
        btn.onclick = onclick;
        toolbar.appendChild(btn);
    }

    addButton('Brush', bigbrush);
    addButton('Borders', borders);

    // Tile size dropdown
    const select = document.createElement('select');
    [
      {label:'2x', value:64},
      {label:'1x', value:32},
      {label:'1/2x', value:16},
      {label:'1/4x', value:8}
    ].forEach(opt => {
      let o = document.createElement('option');
      o.textContent = opt.label;
      o.value = opt.value;
      select.appendChild(o);
    });

    // *** Add the event listener ***
    select.addEventListener('change', function() {
      setTileSize(Number(this.value));
    });

    toolbar.appendChild(select);

    addButton('Exits', () => showExitsEditor(lastEditedSector));
    addButton('Import', importMap);
    addButton('Export', exportMap);
}

    function setTileSize(size) {
        TILE_SIZE = size;
        canvas.width = TILE_W * TILE_SIZE;
        canvas.height = TILE_H * TILE_SIZE;
        renderFullMap();
    }

    // no longer used
    // renderSidebar();
    function renderSidebar() {
        const sidebar = document.getElementById('sideToolbar');
        sidebar.innerHTML = '';

        var btn = document.createElement('button');
        btn.innerText = 'Brush';
        btn.onclick = bigbrush;
        sidebar.appendChild(btn);

        var btn = document.createElement('button');
        btn.innerText = 'Borders';
        btn.onclick = borders;
        sidebar.appendChild(btn);

        const sizes = [
            {label: '1x', size: 32},
            {label: '1/2x', size: 16},
            {label: '1/4x', size: 8}
        ];
        sizes.forEach(option => {
            const sbtn = document.createElement('button');
            sbtn.innerText = option.label;
            sbtn.onclick = function() {
                TILE_SIZE = option.size;
                canvas.width = TILE_W * TILE_SIZE;
                canvas.height = TILE_H * TILE_SIZE;
                renderFullMap();
            };
            sidebar.appendChild(sbtn);
        });

        var btn = document.createElement('button');
        btn.innerText = 'Exits';
        btn.onclick = () => showExitsEditor(lastEditedSector);
        sidebar.appendChild(btn);
        
        var btn = document.createElement('button');
        btn.innerText = 'Import';
        btn.onclick = importMap;
        sidebar.appendChild(btn);

        var btn = document.createElement('button');
        btn.innerText = 'Export';
        btn.onclick = exportMap;
        sidebar.appendChild(btn);
    }

    function getTileImage(code) {
        if (imageCache[code]) return imageCache[code];
        const img = new Image();
        img.src = `t/${code}.png`;
        img.onload = () => renderFullMap(); 
        imageCache[code] = img;
        return img;
    }

    function makeDraggable(popup, header) {
        let offsetX = 0, offsetY = 0, isDown = false;
        header.onmousedown = function(e) {
            isDown = true;
            offsetX = e.clientX - popup.offsetLeft;
            offsetY = e.clientY - popup.offsetTop;
            document.onmousemove = function(e) {
                if (!isDown) return;
                popup.style.left = (e.clientX - offsetX) + 'px';
                popup.style.top = (e.clientY - offsetY) + 'px';
            };
            document.onmouseup = function() {
                isDown = false;
                document.onmousemove = null;
            };
        };
    }

    function bigbrush() {
        const group = brush[0];
        const matchingTiles = Object.keys(imageCache)
            .filter(code => code[0] === group)
            .sort();

        var groupTiles = [];
        for (let i = 0; i < 16; ++i) {
            var code = group + String.fromCharCode(97 + i); // 'a'..'p'
            groupTiles.push(code);
        }

        const tileButtons = groupTiles.map(code =>
        `<button onclick="setBrush('${code}')" style="margin:2px; padding:2px;${brush===code ? 'background:#4af;' : ''}">
          <img src="t/${code}.png" style="width:32px; height:32px; vertical-align:middle;" alt="">
        </button>`
        ).join("");

        const popup = document.getElementById('toolPopup');
        popup.innerHTML = `
        <div id="toolPopupHeader" style="cursor:move; background:#047; padding:8px; border-radius:6px 6px 0 0; font-weight:bold;">
            Brush Tool
            <span style="float:right;cursor:pointer;" onclick="document.getElementById('toolPopup').style.display='none'">✕</span>
        </div>
        <div style="padding:14px;">
            <div style="margin-bottom:10px;">
                <b>Current tile:</b>
                <span class="brush-info" style="padding:4px 10px; font-size:1.2em;">${brush}</span>
            </div>
            <div style="margin-bottom:10px;">
                <label for="brushSizeSlider"><b>Brush Size:</b></label>
                <input type="range" min="1" max="7" step="2" id="brushSizeSlider" value="${brushSize}"
                    oninput="updateBrushSizePreview(this.value)">
                <span id="brushSizeValue">${brushSize}</span>
            </div>
            <div><b>Preview:</b></div>
            <div id="brushPreview" style="padding:8px 0; text-align:center;">
                <img src="t/${brush}.png" style="width:48px; height:48px; border:2px solid #05f; border-radius:6px; background:#fff;">
            </div>
            <div style="margin:10px 0 5px 0;"><b>Group:</b></div>
            <div id="brushGroup" style="display:flex; flex-wrap:wrap; gap:2px; align-items:center; width:170px;">
          ${tileButtons}
        </div>
        </div>
        `;
        popup.style.display = "block";
        makeDraggable(popup, document.getElementById('toolPopupHeader'));
        updateBrushSizePreview(brushSize);
    }

    function setBrush(code) {
      brush = code;
      updateBrushUI();
      bigbrush(); // re-show popup with new tile highlighted
    }

    function updateBrushSizePreview(val) {
        brushSize = parseInt(val, 10);
        document.getElementById('brushSizeValue').textContent = brushSize;
        let out = '<table style="border-collapse:collapse;">';
        for (let y = 0; y < brushSize; y++) {
            out += '<tr>';
            for (let x = 0; x < brushSize; x++) {
                out += `<td style="border:1px solid #666;width:15px;height:15px;background:#0af;"></td>`;
            }
            out += '</tr>';
        }
        out += '</table>';
        document.getElementById('brushPreview').innerHTML = out;
    }

    function renderFullMap() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let y = 0; y < TILE_H; y++) {
            for (let x = 0; x < TILE_W; x++) {
                drawTile(x, y);
            }
        }
        drawSectorBorders(ctx, TILE_SIZE, SECTORS_WIDE, SECTORS_TALL, SECTOR_TILE_WIDTH, SECTOR_TILE_HEIGHT);
    }


    function borders() {
      drawSectorBorders(ctx, TILE_SIZE, SECTORS_WIDE, SECTORS_TALL, SECTOR_TILE_WIDTH, SECTOR_TILE_HEIGHT);
    }

    function drawSectorBorders(ctx, tileSize, sectorsWide, sectorsTall, sectorTileWidth, sectorTileHeight) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 0, 0.4)';
        ctx.lineWidth = 1;
        for (let sx = 1; sx < sectorsWide; sx++) {
            const x = sx * sectorTileWidth * tileSize;
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let sy = 1; sy < sectorsTall; sy++) {
            const y = sy * sectorTileHeight * tileSize;
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }
        ctx.restore();
    }

    function drawTile(x, y) {
        if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) return;
        const code = mapData[y][x];
        const img = getTileImage(code);
        ctx.fillStyle = '#000';
        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        if (img.complete && img.naturalWidth !== 0) {
            ctx.drawImage(img, x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        } else {
            ctx.strokeStyle = '#333';
            ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        }
    }

    // Consolidated Paint Logic
    let isPainting = false;

    function handlePaintAction(clientX, clientY) {
    
        const rect = canvas.getBoundingClientRect();
        const tileX = Math.floor((clientX - rect.left) / TILE_SIZE);
        const tileY = Math.floor((clientY - rect.top) / TILE_SIZE);
        

        // Calculate the sector
        const sectorCol = Math.floor(tileX / SECTOR_TILE_WIDTH);
        const sectorRow = Math.floor(tileY / SECTOR_TILE_HEIGHT);
        const ROWS = ["A","B","C","D","E","F","G","H","I","J","K","L"];
        lastEditedSector = `${ROWS[sectorRow]}${sectorCol+1}`;    
        
        const half = Math.floor(brushSize / 2);
        for (let dy = -half; dy <= half; dy++) {
            for (let dx = -half; dx <= half; dx++) {
                const x = tileX + dx;
                const y = tileY + dy;
                if (x >= 0 && x < TILE_W && y >= 0 && y < TILE_H) {
                    if (mapData[y][x] !== brush) {
                        mapData[y][x] = brush;
                        drawTile(x, y);
                    }
                }
            }
        }
        if(document.getElementById('toolPopup').style.display === "block" && 
           document.getElementById('toolPopupHeader')?.textContent?.includes("Sector Exits Editor")) {
           showExitsEditor(lastEditedSector);
        }
    }

    canvas.addEventListener('mousedown', (e) => {
        if (e.button === 0) {
            isPainting = true;
            handlePaintAction(e.clientX, e.clientY);
        } else if (e.button === 2) {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / TILE_SIZE);
            const y = Math.floor((e.clientY - rect.top) / TILE_SIZE);
            brush = mapData[y][x];
            updateBrushUI();
        }
    });

    window.addEventListener('mousemove', (e) => {
        if (isPainting) handlePaintAction(e.clientX, e.clientY);
    });

    window.addEventListener('mouseup', () => isPainting = false);
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    window.addEventListener('keydown', (e) => {
        if (e.key.length === 1) {
            if (/[A-Z]/.test(e.key)) brush = e.key + brush[1];
            else if (/[a-z]/.test(e.key)) brush = brush[0] + e.key;
            updateBrushUI();
        }
    });

    function updateBrushUI() {
        brushDisplay.innerText = brush;
    }


let exitEditSector = null; // Sector label being edited, e.g., "A1"

function showExitsEditor(sectorLabel) {
    exitEditSector = sectorLabel;
    const currExits = sectorExits[sectorLabel] || '';
    const popup = document.getElementById('toolPopup');
    popup.innerHTML = `
        <div id="toolPopupHeader" style="cursor:move; background:#047; padding:8px; border-radius:6px 6px 0 0; font-weight:bold;">
            Sector Exits Editor (${sectorLabel})
            <span style="float:right;cursor:pointer;" onclick="document.getElementById('toolPopup').style.display='none'">✕</span>
        </div>
        <div style="padding:16px;">
            <label for="exitsInput">Exits (e.g. A2B1): </label>
            <input type="text" id="exitsInput" maxlength="8" value="${currExits}" style="width:90px;" autocomplete="off">
            <button onclick="resetExitsToNatural('${sectorLabel}')">Reset</button>
            <div id="exitsValidation" style="margin-top:8px; font-size:0.9em"></div>
            <p style="font-size:0.95em;color:#aaa;margin:7px 0 0 0;">
              Enter 2-char sector labels concatenated: e.g. <b>A2B1</b>.<br>
              Use <b>Reset</b> to auto-fill with the "natural" 4 exits.<br>
              Accepts teleport/secret exits, as needed.
            </p>
            <button style="margin-top:12px" onclick="saveExitsInput()">Save</button>
        </div>
    `;
    popup.style.display = "block";
    makeDraggable(popup, document.getElementById('toolPopupHeader'));
    document.getElementById('exitsInput').addEventListener('input', validateExitsInput);
    validateExitsInput();
}

function validateExitsInput() {
    const val = document.getElementById('exitsInput').value.toUpperCase();
    document.getElementById('exitsInput').value = val;
    // Validate: up to 8 characters, each 2 chars A-L + [1-8]
    let valid = (/^([A-L][1-8]){0,4}$/).test(val);
    document.getElementById('exitsValidation').innerHTML =
        valid ?
          `<span style="color:#3fa">Valid exits:</span> ${val.match(/.{1,2}/g)?.join(' ')||''}` :
          `<span style="color:#f66">Invalid! Use 2-char codes, e.g. A2B1</span>`;
}

function saveExitsInput() {
    const val = document.getElementById('exitsInput').value.toUpperCase();
    if (!/^([A-L][1-8]){0,4}$/.test(val)) {
        alert("Invalid exits! Use sector codes like A2B1 (2 chars each, up to 4).");
        return;
    }
    sectorExits[exitEditSector] = val;
    document.getElementById('toolPopup').style.display = 'none';
}

// Generates the 4 "natural" exits (within map bounds) for a sector
function resetExitsToNatural(sectorLabel) {
    const ROWS = ["A","B","C","D","E","F","G","H","I","J","K","L"];
    let rowChar = sectorLabel.charAt(0), colNum = parseInt(sectorLabel.slice(1));
    let r = ROWS.indexOf(rowChar), c = colNum - 1;
    let exits = "";
    if (r > 0) exits += `${ROWS[r-1]}${c+1}`;
    if (r < 11) exits += `${ROWS[r+1]}${c+1}`;
    if (c > 0) exits += `${ROWS[r]}${c}`;
    if (c < 7) exits += `${ROWS[r]}${c+2}`;
    document.getElementById('exitsInput').value = exits;
    validateExitsInput();
}

async function importMap() {
    try {
        const text = await navigator.clipboard.readText();
        if (!text) return;

        const lines = text.split('\n');
        const ROWS = ["A","B","C","D","E","F","G","H","I","J","K","L"];
        const SECTOR_W = 8;
        const SECTOR_H = 12;

        lines.forEach(line => {
            if (!line.includes('=')) return;

            // Split "A1=[tiles][exits]"
            const [label, data] = line.trim().split('=');
            if (!label || !data) return;
            
            // Parse sector indices
            const rowChar = label.charAt(0);
            const colNum = parseInt(label.substring(1));
            const rIndex = ROWS.indexOf(rowChar);
            const cIndex = colNum - 1;
            if (rIndex === -1 || isNaN(cIndex)) return;

            // --- Extract and store exits after tiles ---
            const tilesLength = 96 * 2; // 192 chars for 96 tiles, each 2 chars
            const tilesString = data.substring(0, tilesLength);
            const exitString = data.substring(tilesLength); // may be "" if no exits were saved (old format)

            // Store exits using sector codes (label) or by [r][c] as needed
            sectorExits[label] = exitString; // e.g. sectorExits["A1"] = "A2B1"

            // --- Process tiles ---
            for (let i = 0; i < 96; i++) {
                const tileCode = tilesString.substring(i * 2, (i * 2) + 2);

                // Local tile coords in sector
                const sx = i % SECTOR_W;
                const sy = Math.floor(i / SECTOR_W);

                // Map to global grid
                const globalX = (cIndex * SECTOR_W) + sx;
                const globalY = (rIndex * SECTOR_H) + sy;

                if (globalX < TILE_W && globalY < TILE_H) {
                    mapData[globalY][globalX] = tileCode;
                }
            }
        });

        // Optionally: update UI to reflect exits here

        renderFullMap();
        alert("Map imported successfully!");

    } catch (err) {
        console.error('Failed to read clipboard:', err);
        alert("Failed to import. Make sure you've granted clipboard permissions.");
    }
}

    // Export logic
function exportMap() {
    const SECTOR_W = 8;
    const SECTOR_H = 12;
    const ROWS = ["A","B","C","D","E","F","G","H","I","J","K","L"];
    let output = "";

    for (let r = 0; r < 12; r++) { // Vertical sectors
        for (let c = 0; c < 8; c++) { // Horizontal sectors
            const sectorLabel = `${ROWS[r]}${c + 1}`;
            let sectorString = "";

            // Get tiles in this sector
            for (let sy = 0; sy < SECTOR_H; sy++) {
                for (let sx = 0; sx < SECTOR_W; sx++) {
                    const globalX = (c * SECTOR_W) + sx;
                    const globalY = (r * SECTOR_H) + sy;
                    sectorString += mapData[globalY][globalX];
                }
            }

            // --- Add the exits string ---
            var exits = sectorExits[sectorLabel] || ""; // fallback to "" if undefined
            output += `${sectorLabel}=${sectorString}${exits}\n`;
        }
    }

    navigator.clipboard.writeText(output.trim()).then(() => {
        alert("Map exported to clipboard!");
    }).catch(err => {
        console.error('Error copying to clipboard', err);
    });
}

    initMap();
    renderToolbar();    
    
    
</script>
</body>
</html>
