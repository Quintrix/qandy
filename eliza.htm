<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliza AI</title>
    <style>
        /* Light Theme (Default) */
        :root {
            --bg-color: #f4f4f5;
            --chat-bg: #ffffff;
            --user-msg: #2563eb;
            --ai-msg: #f3f4f6;
            --text-main: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --input-bg: #f9fafb;
        }

        /* Dark Theme */
        [data-theme="dark"] {
            --bg-color: #111827;
            --chat-bg: #1f2937;
            --user-msg: #3b82f6;
            --ai-msg: #374151;
            --text-main: #f9fafb;
            --text-light: #9ca3af;
            --border: #374151;
            --input-bg: #111827;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background-color 0.3s ease;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background-color: var(--chat-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.3s ease;
        }

        /* Spacer to keep titles perfectly centered */
        .header-spacer {
            width: 44px; 
        }

        .header-titles {
            text-align: center;
        }

        .header-titles h1 {
            font-size: 1.2rem;
            color: var(--text-main);
            transition: color 0.3s ease;
        }

        .header-titles p {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-top: 4px;
            transition: color 0.3s ease;
        }

        /* Toggle Switch CSS */
        .theme-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--text-light);
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--user-msg);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .chat-history {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            word-wrap: break-word;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .message.ai {
            background-color: var(--ai-msg);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.user {
            background-color: var(--user-msg);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .input-area {
            padding: 20px 24px;
            background-color: var(--chat-bg);
            border-top: 1px solid var(--border);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .input-form {
            display: flex;
            gap: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 8px 8px 8px 20px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        input[type="text"] {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 1rem;
            color: var(--text-main);
            outline: none;
        }
        
        input[type="text"]::placeholder {
            color: var(--text-light);
        }

        button {
            background-color: var(--user-msg);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .typing {
            display: none;
            align-self: flex-start;
            background-color: transparent;
            color: var(--text-light);
            font-size: 0.9rem;
            padding: 0 16px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="header-spacer"></div>
            <div class="header-titles">
                <h1>ELIZA</h1>
                <p>Rogerian Psychotherapist (JavaScript Port)</p>
            </div>
            <!-- Theme Toggle Switch -->
            <label class="theme-switch" for="themeToggle" title="Toggle Dark Mode">
                <input type="checkbox" id="themeToggle" />
                <div class="slider"></div>
            </label>
        </div>
        
        <div class="chat-history" id="chatHistory">
            <div class="message ai">Hello. How are you feeling today?</div>
            <div class="typing" id="typingIndicator">Eliza is typing...</div>
        </div>

        <div class="input-area">
            <form class="input-form" id="chatForm">
                <input type="text" id="userInput" placeholder="Message Eliza..." autocomplete="off" required>
                <button type="submit" aria-label="Send">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <script>
        // --- THEME TOGGLE LOGIC ---
        const themeToggle = document.getElementById('themeToggle');
        
        // Check for saved theme in localStorage
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme) {
            document.documentElement.setAttribute('data-theme', currentTheme);
            if (currentTheme === 'dark') {
                themeToggle.checked = true;
            }
        }

        // Listen for switch changes
        themeToggle.addEventListener('change', function(e) {
            if (e.target.checked) {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            }
        });


        // --- ELIZA BRAIN (Based on original eliza.bas logic) ---
        const reflections = {
            "am": "are", "was": "were", "i": "you", "i'd": "you would", "i've": "you have",
            "i'll": "you will", "my": "your", "are": "am", "you've": "I have",
            "you'll": "I will", "your": "my", "yours": "mine", "you": "I", "me": "you"
        };

        const elizaRules = [
            [/hello(.*)|hi(.*)|hey(.*)/i, [
                "Hello... I'm glad you could drop by today.",
                "Hi there... how are you today?",
                "Hello, how are you feeling today?"
            ]],
            [/i need (.*)/i, [
                "Why do you need {0}?",
                "Would it really help you to get {0}?",
                "Are you sure you need {0}?"
            ]],
            [/why don\'?t you (.*)/i, [
                "Do you really believe I don't {0}?",
                "Perhaps I will {0} in good time.",
                "Should you {0} yourself?"
            ]],
            [/why can\'?t i (.*)/i, [
                "Do you think you should be able to {0}?",
                "If you could {0}, what would you do?",
                "I don't know -- why can't you {0}?"
            ]],
            [/i can\'?t (.*)/i, [
                "How do you know you can't {0}?",
                "Perhaps you could {0} if you tried.",
                "What would it take for you to {0}?"
            ]],
            [/i am (.*)|i\'?m (.*)/i, [
                "Did you come to me because you are {0}?",
                "How long have you been {0}?",
                "How do you feel about being {0}?",
                "Do you enjoy being {0}?"
            ]],
            [/are you (.*)/i, [
                "Why does it matter whether I am {0}?",
                "Would you prefer it if I were not {0}?",
                "Perhaps you believe I am {0}.",
                "I may be {0} -- what do you think?"
            ]],
            [/what (.*)/i, [
                "Why do you ask?",
                "How would an answer to that help you?",
                "What do you think?"
            ]],
            [/how (.*)/i, [
                "How do you suppose?",
                "Perhaps you can answer your own question.",
                "What is it you're really asking?"
            ]],
            [/because (.*)/i, [
                "Is that the real reason?",
                "What other reasons come to mind?",
                "Does that reason apply to anything else?",
                "If {0}, what else must be true?"
            ]],
            [/(.*) sorry (.*)/i, [
                "There are many times when no apology is needed.",
                "What feelings do you have when you apologize?"
            ]],
            [/i think (.*)/i, [
                "Do you doubt {0}?",
                "Do you really think so?",
                "But you're not sure {0}?"
            ]],
            [/(.*) friend (.*)/i, [
                "Tell me more about your friends.",
                "When you think of a friend, what comes to mind?",
                "Why don't you tell me about a childhood friend?"
            ]],
            [/yes/i, [
                "You seem quite sure.",
                "OK, but can you elaborate a bit?",
                "I understand."
            ]],
            [/(.*) computer(.*)/i, [
                "Are you really talking about me?",
                "Does it seem strange to talk to a computer?",
                "How do computers make you feel?"
            ]],
            [/is it (.*)/i, [
                "Do you think it is {0}?",
                "Perhaps it's {0} -- what do you think?",
                "If it were {0}, what would you do?"
            ]],
            [/it is (.*)/i, [
                "You seem very certain.",
                "If I told you that it probably isn't {0}, what would you feel?"
            ]],
            [/can you (.*)/i, [
                "What makes you think I can't {0}?",
                "If I could {0}, then what?",
                "Why do you ask if I can {0}?"
            ]],
            [/can i (.*)/i, [
                "Perhaps you don't want to {0}.",
                "Do you want to be able to {0}?",
                "If you could {0}, would you?"
            ]],
            [/you are (.*)|you\'?re (.*)/i, [
                "Why do you think I am {0}?",
                "Does it please you to think that I'm {0}?",
                "Perhaps you would like me to be {0}.",
                "Perhaps you're really talking about yourself?"
            ]],
            [/i don\'?t (.*)/i, [
                "Don't you really {0}?",
                "Why don't you {0}?",
                "Do you want to {0}?"
            ]],
            [/i feel (.*)/i, [
                "Good, tell me more about these feelings.",
                "Do you often feel {0}?",
                "When do you usually feel {0}?",
                "When you feel {0}, what do you do?"
            ]],
            [/i have (.*)/i, [
                "Why do you tell me that you've {0}?",
                "Have you really {0}?",
                "Now that you have {0}, what will you do next?"
            ]],
            [/i would (.*)/i, [
                "Could you explain why you would {0}?",
                "Why would you {0}?",
                "Who else knows that you would {0}?"
            ]],
            [/is there (.*)/i, [
                "Do you think there is {0}?",
                "It's likely that there is {0}.",
                "Would you like there to be {0}?"
            ]],
            [/my (.*)/i, [
                "I see, your {0}.",
                "Why do you say that your {0}?",
                "When your {0}, how do you feel?"
            ]],
            [/you (.*)/i, [
                "We should be discussing you, not me.",
                "Why do you say that about me?",
                "Why do you care whether I {0}?"
            ]],
            [/why (.*)/i, [
                "Why don't you tell me the reason why {0}?",
                "Why do you think {0}?"
            ]],
            [/i want (.*)/i, [
                "What would it mean to you if you got {0}?",
                "Why do you want {0}?",
                "What would you do if you got {0}?",
                "If you got {0}, then what would you do?"
            ]],
            [/(.*) mother(.*)/i, [
                "Tell me more about your mother.",
                "What was your relationship with your mother like?",
                "How do you feel about your mother?",
                "How does this relate to your feelings today?",
                "Good family relations are important."
            ]],
            [/(.*) father(.*)/i, [
                "Tell me more about your father.",
                "How did your father make you feel?",
                "How do you feel about your father?",
                "Does your relationship with your father relate to your feelings today?",
                "Do you have trouble showing affection with your family?"
            ]],
            [/(.*) child(.*)/i, [
                "Did you have close friends as a child?",
                "What is your favorite childhood memory?",
                "Do you remember any dreams or nightmares from childhood?",
                "Did the other children sometimes tease you?",
                "How do you think your childhood experiences relate to your feelings today?"
            ]],
            [/(.*)\?/i, [
                "Why do you ask that?",
                "Please consider whether you can answer your own question.",
                "Perhaps the answer lies within yourself?",
                "Why don't you tell me?"
            ]],
            [/(.*)/i, [ 
                "Please tell me more.",
                "Let's change focus a bit... Tell me about your family.",
                "Can you elaborate on that?",
                "Why do you say that?",
                "I see.",
                "Very interesting.",
                "I understand.",
                "Go on.",
                "And how does that make you feel?"
            ]]
        ];

        function reflect(text) {
            const words = text.toLowerCase().split(/\b/);
            return words.map(word => {
                return reflections[word] !== undefined ? reflections[word] : word;
            }).join('');
        }

        function getElizaResponse(input) {
            let cleanInput = input.replace(/[.?!]+$/, '');

            for (let i = 0; i < elizaRules.length; i++) {
                const pattern = elizaRules[i][0];
                const responses = elizaRules[i][1];
                const match = cleanInput.match(pattern);

                if (match) {
                    let response = responses[Math.floor(Math.random() * responses.length)];
                    if (response.includes("{0}")) {
                        let capturedGroup = match[1] || match[2] || "";
                        response = response.replace("{0}", reflect(capturedGroup.trim()));
                    }
                    return response;
                }
            }
            return "I am unable to understand. Please try again.";
        }

        // --- UI INTERACTION LOGIC ---
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const chatHistory = document.getElementById('chatHistory');
        const typingIndicator = document.getElementById('typingIndicator');

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.textContent = text;
            
            chatHistory.insertBefore(msgDiv, typingIndicator);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';

            typingIndicator.style.display = 'block';
            chatHistory.scrollTop = chatHistory.scrollHeight;

            setTimeout(() => {
                typingIndicator.style.display = 'none';
                const elizaReply = getElizaResponse(text);
                appendMessage(elizaReply, 'ai');
            }, 600 + Math.random() * 800); 
        });
    </script>
</body>
</html>
