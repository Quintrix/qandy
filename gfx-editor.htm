<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2D Tile Map Editor</title>
    <style>
        body {
            background: #222;
            color: #eee;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #toolbar {
            background: #333;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #444;
        }
        #viewport {
            flex-grow: 1;
            overflow: auto;
            background: #111;
            padding: 20px;
        }
        canvas {
            background: #000;
            cursor: crosshair;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .brush-info {
            font-weight: bold;
            font-family: monospace;
            font-size: 1.2em;
            background: #444;
            padding: 5px 10px;
            border-radius: 4px;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
            background: #068;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover { background: #07a; }
    </style>
</head>
<body>

<div id="toolbar">
    <div>Brush: <span class="brush-info" id="brushDisplay">Ga</span></div>
    <button onclick="importMap()">Import from Clipboard</button>
    <button onclick="exportMap()">Export to Clipboard</button>
    <div style="font-size: 0.8em; color: #aaa;">
        [L-Click] Paint | [R-Click] Eyedropper | [A-Z] Set 1st Char | [a-z] Set 2nd Char
    </div>
</div>

<div id="viewport">
    <canvas id="mapCanvas"></canvas>
</div>

<script>
    const SECTORS_WIDE = 8, SECTORS_TALL = 12;
    const SECTOR_TILE_WIDTH = 8, SECTOR_TILE_HEIGHT = 12;

    const TILE_W = 64;
    const TILE_H = 144;
    const TILE_SIZE = 32; // Visual size of tiles on canvas
    const NOISE_TILES = ['Fa', 'Gb', 'Gc', 'Gd', 'Ge', 'Gf', 'Gg'];
    
    let brush = "Ga";
    let mapData = [];
    const imageCache = {};

    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    const brushDisplay = document.getElementById('brushDisplay');

    // Initialize Map with random noise
    function initMap() {
        canvas.width = TILE_W * TILE_SIZE;
        canvas.height = TILE_H * TILE_SIZE;

        for (let y = 0; y < TILE_H; y++) {
            mapData[y] = [];
            for (let x = 0; x < TILE_W; x++) {
                mapData[y][x] = NOISE_TILES[Math.floor(Math.random() * NOISE_TILES.length)];
            }
        }
        renderFullMap();
    }

    // Fetch or return cached image
    function getTileImage(code) {
        if (imageCache[code]) return imageCache[code];
        
        const img = new Image();
        img.src = `t/${code}.png`;
        img.onload = () => renderFullMap(); // Redraw once loaded
        imageCache[code] = img;
        return img;
    }

    function renderFullMap() {
        for (let y = 0; y < TILE_H; y++) {
            for (let x = 0; x < TILE_W; x++) {
                drawTile(x, y);
            }
        }
        drawSectorBorders(
            ctx, 
            TILE_SIZE, 
            SECTORS_WIDE, SECTORS_TALL, 
            SECTOR_TILE_WIDTH, SECTOR_TILE_HEIGHT
        );
    }

function drawSectorBorders(ctx, tileSize, sectorsWide, sectorsTall, sectorTileWidth, sectorTileHeight) {
    ctx.save();
    ctx.strokeStyle = '#FF0'; // sector border color (yellow, but adjust as you like)
    ctx.lineWidth = 2;        // sector border thickness

    // Draw vertical sector lines
    for (let sx = 1; sx < sectorsWide; sx++) {
        const x = sx * sectorTileWidth * tileSize + 0.5;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, sectorsTall * sectorTileHeight * tileSize);
        ctx.stroke();
    }

    // Draw horizontal sector lines
    for (let sy = 1; sy < sectorsTall; sy++) {
        const y = sy * sectorTileHeight * tileSize + 0.5;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(sectorsWide * sectorTileWidth * tileSize, y);
        ctx.stroke();
    }
    ctx.restore();
}

    function drawTile(x, y) {
        const code = mapData[y][x];
        const img = getTileImage(code);
        
        // Draw black background first to prevent transparency bleeding
        ctx.fillStyle = '#000';
        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        
        if (img.complete) {
            ctx.drawImage(img, x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        } else {
            // Placeholder while loading
            ctx.strokeStyle = '#333';
            ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        }
    }

    // Interaction logic
let isPainting = false;

    // Helper to paint a specific coordinate
    function paintAt(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor((clientX - rect.left) / TILE_SIZE);
        const y = Math.floor((clientY - rect.top) / TILE_SIZE);

        // Bounds check to prevent errors if dragging off-canvas
        if (x >= 0 && x < TILE_W && y >= 0 && y < TILE_H) {
            if (mapData[y][x] !== brush) {
                mapData[y][x] = brush;
                drawTile(x, y);
            }
        }
    }

    canvas.addEventListener('mousedown', (e) => {
        if (e.button === 0) { // Left Click
            isPainting = true;
            paintAt(e.clientX, e.clientY);
        } else if (e.button === 2) { // Right Click: Eyedropper
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / TILE_SIZE);
            const y = Math.floor((e.clientY - rect.top) / TILE_SIZE);
            brush = mapData[y][x];
            updateBrushUI();
        }
    });

    window.addEventListener('mousemove', (e) => {
        if (isPainting) {
            paintAt(e.clientX, e.clientY);
        }
    });

    window.addEventListener('mouseup', () => {
        isPainting = false;
    });

    // Disable context menu on right click
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    // Keyboard logic
    window.addEventListener('keydown', (e) => {
        if (e.key.length === 1) {
            if (/[A-Z]/.test(e.key)) {
                brush = e.key + brush[1];
            } else if (/[a-z]/.test(e.key)) {
                brush = brush[0] + e.key;
            }
            updateBrushUI();
        }
    });

    function updateBrushUI() {
        brushDisplay.innerText = brush;
    }

async function importMap() {
    try {
        const text = await navigator.clipboard.readText();
        if (!text) return;

        const lines = text.split('\n');
        const ROWS = ["A","B","C","D","E","F","G","H","I","J","K","L"];
        const SECTOR_W = 8;
        const SECTOR_H = 12;

        lines.forEach(line => {
            if (!line.includes('=')) return;

            // Split "A1=[tiles]" into label and data
            const [label, data] = line.trim().split('=');
            
            // Extract Row index (A-L -> 0-11) and Col index (1-8 -> 0-7)
            const rowChar = label.charAt(0);
            const colNum = parseInt(label.substring(1));
            
            const rIndex = ROWS.indexOf(rowChar);
            const cIndex = colNum - 1;

            if (rIndex === -1 || isNaN(cIndex)) return;

            // Loop through the 192-character string (96 tiles)
            for (let i = 0; i < 96; i++) {
                const tileCode = data.substring(i * 2, (i * 2) + 2);
                
                // Calculate local tile position within sector
                const sx = i % SECTOR_W;
                const sy = Math.floor(i / SECTOR_W);

                // Map to global grid coordinates
                const globalX = (cIndex * SECTOR_W) + sx;
                const globalY = (rIndex * SECTOR_H) + sy;

                if (globalX < TILE_W && globalY < TILE_H) {
                    mapData[globalY][globalX] = tileCode;
                }
            }
        });

        // Redraw the entire canvas with the imported data
        renderFullMap();
        alert("Map imported successfully!");

    } catch (err) {
        console.error('Failed to read clipboard:', err);
        alert("Failed to import. Make sure you've granted clipboard permissions.");
    }
}

    // Export logic
    function exportMap() {
        const SECTOR_W = 8;
        const SECTOR_H = 12;
        const ROWS = ["A","B","C","D","E","F","G","H","I","J","K","L"];
        let output = "";

        for (let r = 0; r < 12; r++) { // Vertical sectors
            for (let c = 0; c < 8; c++) { // Horizontal sectors
                const sectorLabel = `${ROWS[r]}${c + 1}`;
                let sectorString = "";

                // Get tiles in this sector
                for (let sy = 0; sy < SECTOR_H; sy++) {
                    for (let sx = 0; sx < SECTOR_W; sx++) {
                        const globalX = (c * SECTOR_W) + sx;
                        const globalY = (r * SECTOR_H) + sy;
                        sectorString += mapData[globalY][globalX];
                    }
                }
                output += `${sectorLabel}=${sectorString}\n`;
            }
        }

        navigator.clipboard.writeText(output.trim()).then(() => {
            alert("Map exported to clipboard!");
        }).catch(err => {
            console.error('Error copying to clipboard', err);
        });
    }

    initMap();
</script>

</body>
</html>
