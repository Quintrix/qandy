<!DOCTYPE html>
<html>
<head>
    <title>Map Walker - Tile Editor</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #eee; padding: 20px; }
        .controls { background: #333; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        table { border-collapse: collapse; background: #000; margin: 10px; }
        td { border: 1px solid #444; width: 60px; height: 75px; text-align: center; position: relative; cursor: pointer; }
        .map-id { position: absolute; top: 2px; left: 2px; font-size: 9px; color: #888; }
        .world-img { width: 32px; height: 32px; margin: 10px auto; display: block;}
        /* Detail Overlay */
        #detailOverlay { 
            display: none; position: fixed; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); background: #444; 
            padding: 20px; border: 3px solid #666; z-index: 100; box-shadow: 0 0 50px #000;
        }
        .tile-grid { display: grid; grid-template-columns: repeat(8, 32px); gap: 1px; background: #222; }
        .tile-unit { width: 32px; height: 32px; background: #000; border: 0.1px solid #333; }
        .close-btn { float: right; cursor: pointer; color: red; font-weight: bold; }
    </style>
</head>
<body>

    <div class="controls">
        Wide: <input type="number" id="mapWide" value="3"> 
        High: <input type="number" id="mapHigh" value="3">
        Terrain Brush: 
        <select id="terrainBrush">
            <option value="G">Grass</option>
            <option value="P">Brick Path</option>
            <option value="W">Water</option>
            <option value="S">Swamp</option>
        </select>
        <button onclick="initWorld()">(Re)Generate World</button>
        <button onclick="pathWalker()" style="background:#F39C12; color:white;">Path Walker</button>
        <button onclick="copyBigBang()" style="background:#2196F3; color:white;">Copy All to Clipboard</button>
    </div>

    <div id="worldContainer"></div>

    <!-- Detail View for 8x12 Tiles -->
    <div id="detailOverlay">
        <span class="close-btn" onclick="closeDetail()">[X] Close</span>
        <h3 id="detailTitle">Map ID: --</h3>
        <div id="tileGrid" class="tile-grid"></div>
    </div>

<script>
let worldWide = 3, worldHigh = 3;
let worldTerrain = []; // E.g. [['G','P','G'],['G','P','G'],['G','P','G']]
let worldData = {};    // Map tiles data for *each* map-cell (id -> string like 'GaGa...')

const terrainToBrush = {
    'G': 'Ga', // grass base
    'P': 'Pb', // path as 'Pb' for now (use 'Pb.png')
    'W': 'Ua', // water
    'S': 'Ta'  // swamp
};
const brushToTerrain = { Ga: 'G', Gb: 'G', Fa: 'G', Rh: 'G', Pb: 'P', Ua: 'W', Ta: 'S' };
const terrainSprite = { G:'Ga', P:'Pb', W:'Ua', S:'Ta' };
const terrainNames = { G:'Grass', P:'Path', W:'Water', S:'Swamp' };

// Helper for IDs like 'Aa','Ab', etc.
function getMapId(h, w) { return String.fromCharCode(65 + h) + String.fromCharCode(97 + w); }

function initWorld() {
    worldWide = parseInt(document.getElementById('mapWide').value);
    worldHigh = parseInt(document.getElementById('mapHigh').value);
    worldTerrain = [];
    worldData = {};
    for(let h=0; h<worldHigh; ++h) {
        let row=[];
        for(let w=0; w<worldWide; ++w) row.push('G'); // default terrain: Grass
        worldTerrain.push(row);
    }
    drawWorld();
}

// Render the top-level "world" (terrain grid)
function drawWorld() {
    let html = "<table>";
    for (let h = 0; h < worldHigh; h++) {
        html += "<tr>";
        for (let w = 0; w < worldWide; w++) {
            const id = getMapId(h, w);
            const terrain = worldTerrain[h][w];
            if (!worldData[id]) worldData[id] = generate192CharString(terrainToBrush[terrain]);
            html += `<td onclick="showDetail('${id}')" data-h="${h}" data-w="${w}" onmousedown="event.stopPropagation(); paintCell(${h},${w},event)">
                <span class="map-id">${id}</span>
                <img class="world-img" src="t/${terrainSprite[terrain]}.png" alt="${terrainNames[terrain]}">
                <div style="font-size:15px">${terrain}</div>
            </td>`;
        }
        html += "</tr>";
    }
    html += "</table>";
    document.getElementById('worldContainer').innerHTML = html;

    // Add click listeners for painting
    document.querySelectorAll('#worldContainer td').forEach(td=>{
        td.onmousedown = function(e) { 
            if (e.button === 2 || e.ctrlKey) return; // right click skip
            let h = parseInt(td.getAttribute('data-h'));
            let w = parseInt(td.getAttribute('data-w'));
            paintCell(h, w, e);
        }
        td.oncontextmenu = function(e) { e.preventDefault(); };
    });
}

// Paint terrain on main grid
function paintCell(h, w, e) {
    // Only process if this was called for painting, not for tile overlay
    if (e.target.tagName === "TD" || e.target.classList.contains('world-img') || e.target.classList.contains('map-id')) {
        const brush = document.getElementById('terrainBrush').value;
        worldTerrain[h][w] = brush;
        // Regenerate associated 8x12 detail map too (using new brush)
        const id = getMapId(h, w);
        worldData[id] = generate192CharString(terrainToBrush[brush]);
        drawWorld();
    }
}

function generate192CharString(baseTerrain) {
    // You can make this fancier if desired, using random noise per your original; for clarity, all base for now.
    let str = "";
    for(let i=0; i<96; ++i) str += baseTerrain;
    return str;
}

// Show overlay detail tiles
function showDetail(id) {
    const overlay = document.getElementById('detailOverlay');
    const grid = document.getElementById('tileGrid');
    const data = worldData[id];

    document.getElementById('detailTitle').innerText = `Map Screen: ${id}`;
    grid.innerHTML = "";
    for (let i = 0; i < data.length; i += 2) {
        const tileCode = data.substring(i, i + 2);
        grid.innerHTML += `<img class="tile-unit" src="t/${tileCode}.png" title="${tileCode}" alt="${tileCode}">`;
    }
    overlay.style.display = 'block';
}

function closeDetail() { document.getElementById('detailOverlay').style.display = 'none'; }

async function copyBigBang() {
    const finalString = Object.values(worldData).join('');
    await navigator.clipboard.writeText(finalString);
    alert("Copied " + finalString.length + " characters to clipboard!");
}

// ---- PATH WALKER - draw connecting path between all 'P' tiles ----

// Find all positions w/ terrain P (in order)
// Then connect P tiles with a 'path' using A* pathfinding (or simpler BFS) - on terrain not water (W)
function pathWalker() {
    // Gather path cells in order found
    let points = [];
    for(let h=0; h<worldHigh; ++h) for(let w=0; w<worldWide; ++w)
        if (worldTerrain[h][w] === 'P') points.push([h,w]);
    if (points.length < 2) { alert("Mark at least two Path tiles to connect!"); return; }

    // Make a copy of terrain to paint onto
    let newTerrain = worldTerrain.map(r=>[...r]);

    // Connect points one after the other (A1 to B2 to ...)
    // Only on non-water squares
    for(let i=0;i<points.length-1;++i) {
        let [sh,sw]=points[i], [eh,ew]=points[i+1];
        let path = findPath([sh,sw],[eh,ew],newTerrain);
        path.forEach(([h,w])=>{
            if (newTerrain[h][w]!=='W') newTerrain[h][w]='P';
        });
    }
    // Copy new terrain back and redraw
    worldTerrain = newTerrain;
    // Update worldData for path tiles (set inner data to brick)
    for(let h=0;h<worldHigh;++h)
        for(let w=0;w<worldWide;++w) {
            if(worldTerrain[h][w]==='P') {
                worldData[getMapId(h,w)] = generate192CharString(terrainToBrush['P']);
            }
        }
    drawWorld();
}

// Simple BFS pathfinder for grid, avoids 'W'
function findPath([sh,sw],[eh,ew],terrain) {
    let visited = Array.from({length:worldHigh},()=>Array(worldWide).fill(false));
    let prev = Array.from({length:worldHigh},()=>Array(worldWide).fill(null));
    let queue = [[sh,sw]];
    visited[sh][sw]=true;
    let found=false;
    let dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    while(queue.length) {
        let [h,w] = queue.shift();
        if (h===eh && w===ew) { found=true; break; }
        for(let [dh,dw] of dirs) {
            let nh=h+dh, nw=w+dw;
            if (nh>=0&&nh<worldHigh&&nw>=0&&nw<worldWide && !visited[nh][nw] && terrain[nh][nw]!=='W') {
                visited[nh][nw]=true;
                prev[nh][nw]=[h,w];
                queue.push([nh,nw]);
            }
        }
    }
    if(!found) return [];
    // Reconstruct path
    let path = [];
    let cur=[eh,ew];
    while(cur&&(cur[0]!==sh||cur[1]!==sw)) {
        path.push(cur);
        cur=prev[cur[0]][cur[1]];
    }
    path.push([sh,sw]); path.reverse();
    return path;
}

initWorld(); // Initial world build

</script>
</body>
</html>
