// 2. Selection & Copy Logic
let isSelecting = false;
let startX, startY;

overlay.addEventListener('mousedown', e => {
    isSelecting = true;
    const rect = overlay.getBoundingClientRect();
    startX = e.clientX - rect.left;
    startY = e.clientY - rect.top;
});

overlay.addEventListener('mousemove', e => {
    if (!isSelecting) return;
    const rect = overlay.getBoundingClientRect();
    const currX = e.clientX - rect.left;
    const currY = e.clientY - rect.top;

    octx.clearRect(0, 0, overlay.width, overlay.height);
    octx.strokeStyle = '#0af';
    octx.lineWidth = 2;
    octx.setLineDash([5, 5]);
    octx.strokeRect(startX, startY, currX - startX, currY - startY);
    octx.fillStyle = 'rgba(0, 170, 255, 0.2)';
    octx.fillRect(startX, startY, currX - startX, currY - startY);
});

overlay.addEventListener('mouseup', e => {
    isSelecting = false;
    const rect = overlay.getBoundingClientRect();
    const endX = e.clientX - rect.left;
    const endY = e.clientY - rect.top;

    copySelectedTiles(startX, startY, endX, endY);
    octx.setLineDash([]); // Reset dash
});

function copySelectedTiles(x1, y1, x2, y2) {
    // Normalize coordinates (handle dragging backwards)
    const tx1 = Math.floor(Math.min(x1, x2) / TILE_SIZE);
    const ty1 = Math.floor(Math.min(y1, y2) / TILE_SIZE);
    const tx2 = Math.floor(Math.max(x1, x2) / TILE_SIZE);
    const ty2 = Math.floor(Math.max(y1, y2) / TILE_SIZE);

    let output = "";
    for (let y = ty1; y <= ty2; y++) {
        let line = "";
        for (let x = tx1; x <= tx2; x++) {
            const code = worldGrid[`${x},${y}`] || "  "; // Use space for empty tiles
            line += code;
        }
        output += line + "\n";
    }

    if (output.trim().length > 0) {
        navigator.clipboard.writeText(output.trim()).then(() => {
            // Flash the selection box green to show success
            octx.fillStyle = 'rgba(0, 255, 100, 0.4)';
            octx.fillRect(tx1 * TILE_SIZE, ty1 * TILE_SIZE, (tx2 - tx1 + 1) * TILE_SIZE, (ty2 - ty1 + 1) * TILE_SIZE);
            setTimeout(() => octx.clearRect(0, 0, overlay.width, overlay.height), 300);
            console.log("Tiles copied to clipboard!");
        });
    }
}
