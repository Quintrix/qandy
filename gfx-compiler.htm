<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PUNCH CODE COMPILER</title>
<style>
body { background: #222; color: #eee; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
#toolbar { background: #333; padding: 10px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #444; }
#main { display: flex; flex: 1; overflow: hidden; }
#viewport { padding: 20px; background: #111; display: flex; flex-direction: column; align-items: center; border-right: 1px solid #444; flex-shrink: 0; position: relative; }
code
Code
canvas { background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.5); cursor: crosshair; border: 2px solid #444; touch-action: none; }

    #panel { flex: 1; background: #222; display: flex; flex-direction: column; padding: 15px; overflow-y: auto; }
    .stack-header { font-weight: bold; color: #0af; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
    
    .tool-box { background: #2c3e50; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #34495e; }
    .tool-box label { font-size: 0.7em; color: #95a5a6; display: block; margin-bottom: 5px; }
    
    input[type="text"] { background: #111; color: #fff; border: 1px solid #555; padding: 4px; text-align: center; font-family: monospace; }
    
    #tileBrushRow { display: flex; align-items: center; gap: 10px; }
    #brushPreview { width: 32px; height: 32px; border: 1px solid #0af; background: #000; }

    .object-entry { background: #333; padding: 8px; margin-bottom: 5px; border-radius: 4px; cursor: pointer; border: 1px solid #444; font-family: monospace; font-size: 0.85em; }
    .object-entry:hover { border-color: #0af; }
    .object-entry b { color: #f1c40f; }

    textarea { width: 100%; height: 60px; background: #111; color: #2ecc71; border: 1px solid #555; padding: 10px; font-family: monospace; font-size: 1em; resize: none; box-sizing: border-box; }
    
    button { padding: 6px 12px; cursor: pointer; background: #068; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 0.75em; }
    button:hover { background: #07a; }
    button.reject { background: #7f8c8d; }
    button.remove { background: #c0392b; }
    
    #decompiler {
      background: #000; padding: 8px; font-family: monospace; color: #ddd;
      font-size: 0.8em; margin-top: 5px; border: 1px solid #333; min-height: 20px; }
    
    .exit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 10px; }
    .exit-btn { background: #34495e; text-align: center; padding: 10px; border-radius: 4px; cursor: pointer; border: 1px solid #444; }
    .exit-btn.active { border-color: #f1c40f; color: #f1c40f; background: #1a252f; }

    .exit-layout-wrapper { display: flex; flex-direction: column; gap: 10px; }
    .exit-cross {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 5px;
        width: 180px;
        margin: 0 auto;
    }
    .cross-slot { 
        background: #1a252f; border: 1px solid #333; height: 45px; 
        display: flex; align-items: center; justify-content: center; 
        font-size: 0.8em; border-radius: 4px; cursor: pointer; color: #555;
    }
    .cross-slot.active { border-color: #f1c40f; color: #f1c40f; background: #2c3e50; }
    .cross-slot.special { border-color: #0af; color: #0af; }
    .cross-slot.disabled { opacity: 0.3; cursor: default; border: none; }
    
    #manualExitRow { display: flex; gap: 5px; margin-top: 5px; }
    #manualExitRow input { flex: 1; }

    .punchcodeImages img, 
    .punchcode-text {
        width: 32px;
        height: 32px;
        vertical-align: middle;
        margin: 1px;
    }

    .punchcode-space {
        width: 32px;
        height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: transparent;
        color: #CCFFFF;
        font-family: monospace;
        font-size: 16px;
        font-weight: bold;
        border-radius: 4px;
        box-sizing: border-box;    
        overflow: hidden;
    }        

    .punchcode-text {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: #006600;
        color: #FFFFFF;
        font-family: monospace;
        font-size: 16px;
        font-weight: bold;
        border-radius: 4px;
        box-sizing: border-box;    
        overflow: hidden;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    .punchcode-num {
        width: 32px;
        height: 32px;
        display: inline-block;
        vertical-align: middle;
        margin: 1px;
        flex-shrink: 0;
        position: relative;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    .punchcode-img {
        width: 32px;
        height: 32px;
        display: inline-block;
        vertical-align: middle;
        margin: 1px;
        flex-shrink: 0;
        position: relative;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }
    
    .punchcode-img img {
        width: 32px;
        height: 32px;
        display: block;
    }

    /* Dynamic Exits UI */
    .dir-btn {
        background: #222; color: #7f8c8d; border: 1px solid #444;
        padding: 5px 8px; border-radius: 4px; cursor: pointer;
        font-family: monospace; font-size: 0.85em;
        transition: all 0.2s;
    }
    .dir-btn.active {
        background: #2c3e50; color: #f1c40f; border-color: #f1c40f;
        font-weight: bold;
    }
    .dir-btn.disabled {
        opacity: 0.3; cursor: not-allowed;
    }
    .other-btn {
        background: #331111; color: #e74c3c; border: 1px solid #c0392b;
        padding: 5px 8px; border-radius: 4px; cursor: pointer;
        font-family: monospace; font-size: 0.85em; font-weight: bold;
    }
    .other-btn:hover { background: #551111; color: #ff7777; }

    #tooltip { 
        position: absolute; 
        background: rgba(240, 230, 140, 0.9);
        color: #000; 
        padding: 6px 10px;
        font-size: 16px;
        font-weight: bold;
        pointer-events: none; 
        border: 1px solid #444; 
        display: none;
        width: 100%; 
        z-index: 100; 
        font-family: monospace; 
        border-radius: 4px;
    }
    </style>
<script src="gfx-itemid.js"></script>
</head>
<body>
<div id="main">
<div id="viewport">
<canvas id="sectorCanvas" width="256" height="384"></canvas>
<div id="tooltip">Z:00</div>
    <div class="tool-box" id="brushBox">
        <div id="tileBrushRow">
            <input type="text" id="tileInput" size=2 maxlength="2" value="Ga" oninput="updateBrushPreview()">
            <div id="brushPreview"></div>
        </div>
    </div>
</div>

<div id="panel">

    <div class="tool-box" id="toolbar">
      <div style="font-weight: bold; color: #0af;"> &nbsp; PUNCH CODE COMPILER:</div>
      <button onclick="importGfx()">IMPORT MAP (.GFX)</button>
      <button onclick="exportGfx()">EXPORT MAP (.GFX)</button>
      <select id="sectorNav" onchange="changeSector()"></select>
      <button id="cityToggleBtn" onclick="toggleCity()">ENTER CITY</button>
    </div>
    
    <div id="stackView">
      <div class="tool-box" style="background: #1a252f;">
        <div style="font-weight: bold; color: #0af;">OBJECT STACK: <span id="sectorLabel">A1</span>
          <input type="text" id="newID" size=2 maxlength="2" placeholder="ID">
          <input type="text" id="newZ" size=2 maxlength="2" placeholder="Z">
          <input type="text" id="newDATA" size=2 maxlength="2" value="00">
          <button onclick="addObject()">+ ADD</button>
          <button onclick="editObject()">EDIT</button> 
          <div id="listItems"></div>
        </div>
       </div>                
    </div>

    <div id="globalStackView">
      <div class="tool-box" style="background: #1a252f;">
        <div style="font-weight: bold; color: #0af; margin-bottom: 10px;">GLOBAL STACK:</div>
        <div id="global-a"><div class="object-entry" onclick="openGlobalEditor('a')">[<b>a</b>] Alpha (On Connect) <span id="global-lbl-a" style="color: #888;"></span></div></div>
        <div id="global-b"><div class="object-entry" onclick="openGlobalEditor('b')">[<b>b</b>] Before (Pre-Tick) <span id="global-lbl-b" style="color: #888;"></span></div></div>
        <div id="global-c"><div class="object-entry" onclick="openGlobalEditor('c')">[<b>c</b>] After (Post-Tick) <span id="global-lbl-c" style="color: #888;"></span></div></div>
        <div id="global-f"><div class="object-entry" onclick="openGlobalEditor('f')">[<b>f</b>] Functions (File F) <span id="global-lbl-f" style="color: #888;"></span></div></div>
      </div>
    </div>

    <!-- NEW QPC MACRO STACK -->
    <div id="qpcStackView">
      <div class="tool-box" style="background: #1a252f;">
        <div style="font-weight: bold; color: #0af; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
            QPC SCRIPTS:
            <div>
                <button style="background: #0af;" onclick="importQpc()">IMPORT .QPC</button>
                <button style="background: #0af;" onclick="exportQpc()">EXPORT .QPC</button>
            </div>
        </div>
        <div style="margin-bottom: 10px; display: flex; gap: 5px;">
            <input type="text" id="newQpcName" placeholder="tape name" style="flex: 2; ">
            <button style="background: #0af;" onclick="addQpc()">+ ADD TAPE</button>
        </div>
        <div id="qpcListItems"></div>
      </div>
    </div>
    
    <div class="tool-box" id="logicBox" style="display: none;">
    <div class="stack-header">
        <div><span id="logicLabel">LOGIC</span>: <span id="editingObjID"></span>
            <button onclick="LightMode()">Light</button>
            <button onclick="DarkMode()">Dark</button>
            &nbsp;
            <button onclick="setPunchcodeBg('Ga')">Grass</button>
            <button onclick="setPunchcodeBg('Ib')">Dungeon</button>
            <button onclick="setPunchcodeBg('Ca')">Dirt</button>
            <button onclick="setPunchcodeBg('Ua')">Water</button>
            <input type="text" id="bgInput" size="2" maxlength="2" value="Ca" oninput="setCustomPunchcodeBg()">
        </div>
    </div>

    <div id="pcinput"><textarea id="punchcodeInput" oninput="updateDecompiler()"></textarea></div>
    <div id="punchcodeImages" class="punchcodeImages"></div>
    
    <div id="decompiler"></div>
        <div class="btn-row" style="display:flex; gap:5px; margin-top:10px;">
            <button class="reject" onclick="rejectLogic()">CLEAR</button>
            <button class="remove" onclick="removeObject()">DELETE</button>
        </div>
    </div>
    
    <div class="tool-box" id="exitsBox">
       <label style="margin-bottom: 5px;">Exits</label>
       <div id="manualExitRow" style="align-items: center; gap: 10px;">
           <div id="exitButtonsRow" style="display: flex; gap: 5px; flex-wrap: wrap;"></div>
           <input type="text" id="manualExitInput" placeholder="e.g. A2B1H1" oninput="saveExitInput()">
       </div>                
    </div>        
    
</div>
</div>
<script>
// --- STATE ---
let currentSector = "Aa";
let mapSectors = {};
let editingIndex = -1;
let editingGlobalKey = null;
let globalLogic = { a: "", b: "", c: "", f: "" };
let punchcodeTextColor = "#FFFFFF";

// QPC Script Macros State
let qpcData = {};
let editingQpcKey = null;

// Maximum possible map bounds Aa to Zz
const UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const LOWER = "abcdefghijklmnopqrstuvwxyz";
const CITY_SYMBOLS = "0123456789%()+,-:;=@[]^_{}";

const COLS = 8;
const tileCache = {}, itemCache = {};
const canvas = document.getElementById('sectorCanvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

const punchcodeItemImageCache = {};
const nav = document.getElementById('sectorNav');

// Helper: Find W4 register dynamically from Global Alpha script
function getMapBounds() {
let maxX = 'H', maxY = 'h'; // Defaults to 8x8 (Aa-Hh)
if (globalLogic.a) {
// Look for Xs W4 [XX] or XsW4[XX]
const match = globalLogic.a.match(/Xs\s*W4\s*([A-Z][a-z])/);
if (match) {
maxX = match[1].charAt(0);
maxY = match[1].charAt(1);
}
}
return {
maxX: Math.max(0, UPPER.indexOf(maxX)),
maxY: Math.max(0, LOWER.indexOf(maxY))
};
}

// Helper: Rebuild the Dropdown list based on W4 boundaries
function updateNavDropdown() {
nav.innerHTML = '';
var bounds = getMapBounds();

// Append Standard Map Layer Options
for(let x = 0; x <= bounds.maxX; x++) {
for(let y = 0; y <= bounds.maxY; y++) {
let opt = document.createElement('option');
let sec = UPPER[x] + LOWER[y];
opt.value = opt.textContent = sec;
nav.appendChild(opt);
}
}

// Append City Maps Layer Options
for(let x = 0; x <= bounds.maxX; x++) {
for(let y = 0; y <= bounds.maxY; y++) {
let opt = document.createElement('option');
let sec = UPPER[x] + CITY_SYMBOLS[y];
opt.value = opt.textContent = sec;
nav.appendChild(opt);
}
}

// Force fallback if the map shrinks and player is out-of-bounds
if (nav.querySelector(`option[value="${currentSector}"]`)) {
nav.value = currentSector;
} else {
currentSector = "Aa";
nav.value = "Aa";
document.getElementById('sectorLabel').innerText = currentSector;
updateCityButton();
render();
}
}

function initBlank() {
globalLogic = { a: "", b: "", c: "", f: "" };
mapSectors = {};
qpcData = {};

// Initialize ALL 676 potential sectors and 676 extended city sectors
for(let x = 0; x < 26; x++) {
for(let y = 0; y < 26; y++) {
let sec = UPPER[x] + LOWER[y];
mapSectors[sec] = { tiles: "Ga".repeat(96), exits: "", objects: [] };

let citySec = UPPER[x] + CITY_SYMBOLS[y];
mapSectors[citySec] = { tiles: "Ga".repeat(96), exits: "", objects: [] };
}
}
currentSector = "Aa";
updateNavDropdown();
updateBrushPreview();
updateGlobalLabels();
updateQpcList();
updateCityButton();
render();
}

function updateCityButton() {
const btn = document.getElementById('cityToggleBtn');
if (!btn) return;
const isCity = CITY_SYMBOLS.includes(currentSector[1]);
btn.innerText = isCity ? "EXIT CITY" : "ENTER CITY";
btn.style.background = isCity ? "#8e44ad" : ""; // Noticeable purple color for City Mode
}

function toggleCity() {
saveCurrentEditor();
let isCity = CITY_SYMBOLS.includes(currentSector[1]);
let xChar = currentSector[0];
let yIdx = isCity ? CITY_SYMBOLS.indexOf(currentSector[1]) : LOWER.indexOf(currentSector[1]);

if (yIdx !== -1) {
currentSector = isCity ? (xChar + LOWER[yIdx]) : (xChar + CITY_SYMBOLS[yIdx]);
nav.value = currentSector;
changeSector();
}
}

// --- NAVIGATION ---
window.addEventListener('keydown', (e) => {
  var bounds = getMapBounds();
  var changed = false;

  if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;

  if (e.key === "Escape" && document.activeElement) {
    document.activeElement.blur();
    return;
  }

  // Tile Brush Keyboard Shortcuts
  if (!e.ctrlKey && !e.metaKey && !e.altKey && e.key.length === 1) {
    const tileInput = document.getElementById('tileInput');
    let currentBrush = tileInput.value || "Ga";
    if (currentBrush.length < 2) currentBrush = currentBrush.padEnd(2, 'a');

    // Upper-case letter updates first character
    if (e.key >= 'A' && e.key <= 'Z') {
      tileInput.value = e.key + currentBrush[1];
      updateBrushPreview();
      return;
    } else { 
      if ((e.key >= 'a' && e.key <= 'z') || (e.key >= '0' && e.key <= '9')) {
        tileInput.value = currentBrush[0] + e.key;
        updateBrushPreview();
        return;
      }
    }
  }

let xIdx = UPPER.indexOf(currentSector[0]);
let isCity = false;
let yIdx = LOWER.indexOf(currentSector[1]);
if (yIdx === -1) {
yIdx = CITY_SYMBOLS.indexOf(currentSector[1]);
isCity = true;
}

if (xIdx === -1 || yIdx === -1) return; // Ignore legacy formats

var bounds = getMapBounds();
var changed = false;

if (e.key === "ArrowUp") { xIdx--; changed = true; }
if (e.key === "ArrowDown") { xIdx++; changed = true; }
if (e.key === "ArrowLeft") { yIdx--; changed = true; }
if (e.key === "ArrowRight") { yIdx++; changed = true; }

if (changed) {
e.preventDefault();
// Toroidal wrap math strictly within current layer bounds
if (xIdx < 0) xIdx = bounds.maxX;
if (xIdx > bounds.maxX) xIdx = 0;
if (yIdx < 0) yIdx = bounds.maxY;
if (yIdx > bounds.maxY) yIdx = 0;

nav.value = UPPER[xIdx] + (isCity ? CITY_SYMBOLS[yIdx] : LOWER[yIdx]);
changeSector();
}
});

// --- MOUSE AND TOUCH INTERACTION ---
canvas.addEventListener('contextmenu', e => e.preventDefault());

let longPressTimer = null;
let isLongPress = false;
let startPointerX = 0;
let startPointerY = 0;

function handlePointerDown(clientX, clientY, isRightClick) {
if (document.activeElement) { document.activeElement.blur(); }

const rect = canvas.getBoundingClientRect();
const x = Math.floor((clientX - rect.left) / 32);
const y = Math.floor((clientY - rect.top) / 32);
const tileIndex = y * 8 + x;

if (tileIndex < 0 || tileIndex >= 96) return;

startPointerX = clientX;
startPointerY = clientY;

const sec = mapSectors[currentSector];
const originalTiles = sec.tiles; // Backup the map layout before optimistically painting
const sampled = sec.tiles.substring(tileIndex * 2, tileIndex * 2 + 2);

if (isRightClick) {
document.getElementById('tileInput').value = sampled;
updateBrushPreview();
render();
return;
}

isLongPress = false;

// Optimistically paint right away (gives immediate feedback)
const brush = document.getElementById('tileInput').value || "Ga";
sec.tiles = sec.tiles.substring(0, tileIndex * 2) + brush + sec.tiles.substring(tileIndex * 2 + 2);
render();

// Start long press timer (Mobile-friendly tile picker)
longPressTimer = setTimeout(() => {
isLongPress = true;
sec.tiles = originalTiles; // Revert the accidental paint

document.getElementById('tileInput').value = sampled;
updateBrushPreview();
render();
showToast("SAMPLED TILE: " + sampled);
}, 500); // Trigger after 500ms
}

function cancelLongPress() {
if (longPressTimer) {
clearTimeout(longPressTimer);
longPressTimer = null;
}
}

function checkPointerMove(clientX, clientY) {
if (longPressTimer) {
const dx = clientX - startPointerX;
const dy = clientY - startPointerY;
// Cancel long press if moved more than ~10px threshold
if (dx * dx + dy * dy > 100) {
cancelLongPress();
}
}
}

canvas.addEventListener('mousedown', (e) => {
if (e.button === 0) {
handlePointerDown(e.clientX, e.clientY, false);
} else if (e.button === 2) {
handlePointerDown(e.clientX, e.clientY, true);
}
});

canvas.addEventListener('mousemove', (e) => {
checkPointerMove(e.clientX, e.clientY);

const rect = canvas.getBoundingClientRect();
const x = Math.floor((e.clientX - rect.left) / 32);
const y = Math.floor((e.clientY - rect.top) / 32);
const tileIndex = y * 8 + x;

if (tileIndex >= 0 && tileIndex < 96) {
tooltip.style.display = 'block';
tooltip.style.left = (e.clientX - rect.left + 25) + 'px';
tooltip.style.top = (e.clientY - rect.top - 15) + 'px';
tooltip.innerText = `${tileIndex.toString().padStart(2, '0')}`;
} else {
tooltip.style.display = 'none';
}
});

canvas.addEventListener('mouseup', cancelLongPress);
canvas.addEventListener('mouseleave', () => {
cancelLongPress();
tooltip.style.display = 'none';
});

// Mobile specific touch support
canvas.addEventListener('touchstart', (e) => {
e.preventDefault(); // Prevents emulated mouse events and stopping browser drag
if (e.touches.length > 0) {
handlePointerDown(e.touches[0].clientX, e.touches[0].clientY, false);
}
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
e.preventDefault();
if (e.touches.length > 0) {
checkPointerMove(e.touches[0].clientX, e.touches[0].clientY);
}
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
e.preventDefault();
cancelLongPress();
}, { passive: false });

// --- CORE LOGIC ---

function updateBrushPreview() {
const code = document.getElementById('tileInput').value;
const preview = document.getElementById('brushPreview');
preview.style.background = `#000 url('t/${code}.png') no-repeat center`;
preview.style.backgroundSize = "cover";
}

function getImg(src, cache) {
if (cache[src] && cache[src].complete) return cache[src];

const img = new Image();
img.src = src;
img.onload = () => {
cache[src] = img;
render();
};
cache[src] = img;
return img;
}

function render() {
const sec = mapSectors[currentSector];
if(!sec) return;
ctx.clearRect(0,0,256,384);

for(let i=0; i<96; i++) {
let code = sec.tiles.substring(i*2, i*2+2);
let img = getImg(`t/${code}.png`, tileCache);
if(img.complete) ctx.drawImage(img, (i%8)*32, Math.floor(i/8)*32, 32, 32);
}

sec.objects.forEach(obj => {
let img = getImg(`i/${obj.id}.png`, itemCache);
let z = parseInt(obj.z);
let targetX = (z % 8) * 32;
let targetY = Math.floor(z / 8) * 32;

if(img.complete) {
if (obj.id.startsWith('T') || obj.id.startsWith('U')) {
let drawX = targetX + 32 - img.width;
let drawY = targetY + 32 - img.height;
ctx.drawImage(img, drawX, drawY, img.width, img.height);
} else {
ctx.drawImage(img, targetX, targetY, 32, 32);
}
}
});
updateObjectList();
}

function addManualExit() {
const input = document.getElementById('manualExitInput');
const code = input.value.trim();
if (code.length === 2) {
let sec = mapSectors[currentSector];
if (!sec.exits.includes(code)) {
sec.exits += code;
render();
}
input.value = "";
}
}

function saveExitInput() {
// Strips completely invalid characters but permits alphanumeric and all city symbols
const val = document.getElementById('manualExitInput').value.replace(/[^a-zA-Z0-9%()+,:;=@\[\]_{}^-]/g, '');
mapSectors[currentSector].exits = val;
updateExitsUI();
}

function updateExitInput() {
const input = document.getElementById('manualExitInput');
if (input) input.value = mapSectors[currentSector]?.exits || "";
}

function updateExitsUI() {
const sec = mapSectors[currentSector];
if (!sec) return;

let exitsStr = sec.exits || "";
let exitsArr = [];

for (let i = 0; i < exitsStr.length; i += 2) {
if (i + 1 < exitsStr.length) {
exitsArr.push(exitsStr.substring(i, i + 2));
}
}

const xIdx = UPPER.indexOf(currentSector[0]);
let isCity = false;
let yIdx = LOWER.indexOf(currentSector[1]);
if (yIdx === -1) {
yIdx = CITY_SYMBOLS.indexOf(currentSector[1]);
isCity = true;
}

var btnContainer = document.getElementById('exitButtonsRow');
if(btnContainer) btnContainer.innerHTML = '';

if (xIdx === -1 || yIdx === -1) return; // Prevent crash on old A1-H8 legacy files

var bounds = getMapBounds();
const wrap = (val, max) => val < 0 ? max : (val > max ? 0 : val);

// Calculates toroidal (wrap-around) exits automatically mapped to the current dimension (Standard vs City)
const neighbors = {
North: UPPER[wrap(xIdx - 1, bounds.maxX)] + (isCity ? CITY_SYMBOLS[yIdx] : LOWER[yIdx]),
East: UPPER[xIdx] + (isCity ? CITY_SYMBOLS[wrap(yIdx + 1, bounds.maxY)] : LOWER[wrap(yIdx + 1, bounds.maxY)]),
South: UPPER[wrap(xIdx + 1, bounds.maxX)] + (isCity ? CITY_SYMBOLS[yIdx] : LOWER[yIdx]),
West: UPPER[xIdx] + (isCity ? CITY_SYMBOLS[wrap(yIdx - 1, bounds.maxY)] : LOWER[wrap(yIdx - 1, bounds.maxY)])
};

const neighborIDs = Object.values(neighbors);

// Render Compass Buttons (North, East, South, West)
for (let dir of ['North', 'East', 'South', 'West']) {
const targetID = neighbors[dir];
const btn = document.createElement('button');

if (!targetID) {
btn.className = 'dir-btn disabled';
btn.innerText = dir;
btn.disabled = true;
} else {
const isActive = exitsArr.includes(targetID);
btn.className = 'dir-btn' + (isActive ? ' active' : '');
btn.innerText = isActive ? dir : dir;
btn.onclick = () => toggleExit(targetID);
}
if(btnContainer) btnContainer.appendChild(btn);
}

// Render Other Non-Standard Exits (Teleports, etc)
exitsArr.forEach(exitID => {
if (!neighborIDs.includes(exitID)) {
const btn = document.createElement('button');
btn.className = 'other-btn';
btn.innerText = `[${exitID}]`;
btn.title = "Click to remove";
btn.onclick = () => toggleExit(exitID);
if(btnContainer) btnContainer.appendChild(btn);
}
});

const input = document.getElementById('manualExitInput');
if (input && document.activeElement !== input) {
input.value = exitsStr;
}
}

function toggleExit(targetID) {
const sec = mapSectors[currentSector];
let exitsArr = [];
for (let i = 0; i < sec.exits.length; i += 2) {
if (i + 1 < sec.exits.length) exitsArr.push(sec.exits.substring(i, i + 2));
}

if (exitsArr.includes(targetID)) {
exitsArr = exitsArr.filter(e => e !== targetID);
} else {
exitsArr.push(targetID);
}
sec.exits = exitsArr.join('');

updateExitsUI();

const input = document.getElementById('manualExitInput');
if (input) input.value = sec.exits;
}

function parseQpcData(text) {
const unescapeWhitespace = (str) => (str || "").replace(/\\n/g, "\n").replace(/\\r/g, "\r").replace(/\\\\/g, "\\");
const lines = text.split(/\r?\n/);
for (let line of lines) {
line = line.trim();
if (!line) continue;
const match = line.match(/^\[(.*?)\](.*)$/);
if (match) {
qpcData[match[1]] = unescapeWhitespace(match[2]);
}
}
updateQpcList();
}

function exportGfx() {
  saveCurrentEditor();
  let out = "";

  // 1. Better New Line Strategy: Standard backslash escaping
  const escapeWhitespace = (str) => (str || "")
  .replace(/\\/g, "\\\\")
  .replace(/\n/g, "\\n")
  .replace(/\r/g, "\\r");

  if (globalLogic.a) out += `a=${globalLogic.a}\n`;
  if (globalLogic.b) out += `b=${globalLogic.b}\n`;
  if (globalLogic.c) out += `c=${globalLogic.c}\n`;
  if (globalLogic.f) out += `f=${globalLogic.f}\n`;

  var bounds = getMapBounds();
  let validLabels = new Set();
  for (let x = 0; x <= bounds.maxX; x++) {
    for (let y = 0; y <= bounds.maxY; y++) {
      validLabels.add(UPPER[x] + LOWER[y]);
      validLabels.add(UPPER[x] + CITY_SYMBOLS[y]);
    }
  }

  const defaultTiles = "Ga".repeat(96);

  for (const label in mapSectors) {
    if (validLabels.has(label)) {
      let sec = mapSectors[label];
      // 2. Filter out completely empty/default sectors
      if (sec.tiles === defaultTiles && (!sec.exits || sec.exits === "") && sec.objects.length === 0) {
        continue;
      }
      let objStr = sec.objects.map(o => {
      let meta = o.id + o.z;
      if (o.data && o.data.trim().length === 2) {
        meta += o.data;
      }
      return o.logic ? `${meta}|${escapeWhitespace(o.logic)}` : meta;
    }).join('~');
    out += `${label}=${sec.tiles}${sec.exits}.${objStr}\n`;
    }
  }

  navigator.clipboard.writeText(out.trim());
  showToast("GFX EXPORTED TO CLIPBOARD!");
}

function parseGfxData(text) {
globalLogic = { a: "", b: "", c: "", f: "" };

// Unescape our new standards, but keep legacy _NL_ support for old saves
const unescapeWhitespace = (str) => (str || "")
.replace(/_NL_/g, "\n")
.replace(/\\n/g, "\n")
.replace(/\\r/g, "\r")
.replace(/\\\\/g, "\\");

text.split('\n').forEach(line => {
const eqIdx = line.indexOf('=');
if (eqIdx === -1) return;
const label = line.substring(0, eqIdx);
const content = line.substring(eqIdx + 1);

if (label === 'a' || label === 'b' || label === 'c' || label === 'f') {
globalLogic[label] = unescapeWhitespace(content);
return;
}

let [map, items] = content.split('.');
let objs = [];
if(items) items.split('~').forEach(c => {
if(!c) return;
let [m, rawl] = c.split('|');
let l = unescapeWhitespace(rawl);
if (m) {
if (m.length >= 6) {
objs.push({ id: m.substring(0,2), z: m.substring(2,4), data: m.substring(4,6), logic: l || "" });
} else if (m.length >= 4) {
objs.push({ id: m.substring(0,2), z: m.substring(2,4), data: "", logic: l || "" });
}
}
});
mapSectors[label] = { tiles: map.substring(0,192), exits: map.substring(192), objects: objs };
});
updateGlobalLabels();
render();
}

function isWRegister(code) {
return code.length === 2 && code.charAt(0) === 'W' && (
(code.charAt(1) >= 'a' && code.charAt(1) <= 'z') ||
(code.charAt(1) >= '0' && code.charAt(1) <= '9')
);
}

function isNumerical(code) {
return code.length === 2 && !isNaN(parseInt(code));
}

function getCodeDescription(code) {
if (code === "Za") return "nothing (null)";
if (code === "Z1") return "exit Z1";

const itemText = typeof gfxItemID === "function" ? gfxItemID(code) : "Unknown";
if (itemText !== "Item " + code && itemText !== "Unknown") return itemText;

// Gracefully identifies both Standard and City sectors without breaking Item lookups
if (code.length === 2 && code.charAt(0) >= 'A' && code.charAt(0) <= 'Z' && (LOWER.includes(code.charAt(1)) || CITY_SYMBOLS.includes(code.charAt(1)))) {
return `sector ${code}`;
}

return `code "${code}"`;
}

function parseAndRender(srcString, overrideStart = null, overrideEnd = null) {
let col = 0;
let ifnot = false;
let ifnotStartIdx = null;

while (col < srcString.length) {
let startIdx = col;
let char = srcString.charAt(col);

// Handle Space
if (char === ' ' || char === '\t') {
const spacer = document.createElement('div');
spacer.style.width = '16px';
spacer.style.height = '32px';
spacer.style.display = 'inline-block';
punchcodeImagesContainer.appendChild(spacer);
col++;
continue;
}
// Handle Newline
else if (char === '\n' || char === '\r') {
const br = document.createElement('div');
br.style.flexBasis = '100%';
br.style.height = '0';
punchcodeImagesContainer.appendChild(br);
if (char === '\r' && srcString.charAt(col + 1) === '\n') col++;
col++;
continue;
}

// Extract Token (Tag or 2-char code)
let text = "";
let endIdx = col;

if (char === '[') {
let closeIdx = srcString.indexOf(']', col);
if (closeIdx !== -1) {
text = srcString.substring(col, closeIdx + 1);
endIdx = closeIdx + 1;
col = endIdx;
} else {
let len = Math.min(2, srcString.length - col);
text = srcString.substring(col, col + len);
endIdx = col + len;
col = endIdx;
}
} else {
let len = Math.min(2, srcString.length - col);
text = srcString.substring(col, col + len);
endIdx = col + len;
col = endIdx;
}

// Parent Highlight Overrides (for QPC expanding)
let hlStart = overrideStart !== null ? overrideStart : startIdx;
let hlEnd = overrideEnd !== null ? overrideEnd : endIdx;

// Handle QPC Tape Tag
if (text.startsWith('[') && text.endsWith(']')) {
let macroName = text.substring(1, text.length - 1);
let macroCode = qpcData[macroName];
if (macroCode !== undefined) {
// Recursively render tape content, passing the parent tag's textarea coords
parseAndRender(macroCode, hlStart, hlEnd);
} else {
// Unknown Tag
let block = createTextBlock(text);
punchcodeImagesContainer.appendChild(block);
bindHover(block, "Missing Tape: " + text, hlStart, hlEnd);
}
continue;
}

// --- Standard Code Handling ---
let item = text;
let rawDesc = typeof gfxItemID === "function" ? gfxItemID(item) : "Unknown";
if (rawDesc === "Unknown") rawDesc = getCodeDescription(item);

if (item === "Xn") {
ifnot = true;
ifnotStartIdx = hlStart;
continue;
}

let blockEl = null;

if (item === "Xc") {
blockEl = createImgBlock('i/Xc.png');
punchcodeImagesContainer.appendChild(blockEl);
bindHover(blockEl, rawDesc, hlStart, hlEnd);
} else {
let imgSrc = ifnot ? ('i/' + item + 'n.png') : ('i/' + item + '.png');
blockEl = createImgBlock(imgSrc);
punchcodeImagesContainer.appendChild(blockEl);

let cleanDesc = rawDesc.replace(/^[%\$#]{2}/, '');
let tooltipDesc = cleanDesc;

if (cleanDesc.match(/\[(.*?)\/(.*?)\]/)) {
tooltipDesc = cleanDesc.replace(/\[(.*?)\/(.*?)\]/g, (match, left, right) => {
return ifnot ? right : left;
});
} else {
tooltipDesc = ifnot ? ("If Not: " + cleanDesc) : cleanDesc;
}

let finalStart = ifnot ? ifnotStartIdx : hlStart;
bindHover(blockEl, tooltipDesc || item, finalStart, hlEnd);

let currentDesc = rawDesc;

// Consume prefix parameters sequentially inline
while (currentDesc.startsWith("%%") || currentDesc.startsWith("$$") || currentDesc.startsWith("##")) {
let prefix = currentDesc.substring(0, 2);

// skip spaces before next token
let nStart = col;
while(nStart < srcString.length && (srcString.charAt(nStart) === ' ' || srcString.charAt(nStart) === '\t' || srcString.charAt(nStart) === '\n' || srcString.charAt(nStart) === '\r')) {
nStart++;
}
if (nStart >= srcString.length) break;

let nextcode = srcString.substring(nStart, nStart + 2);
col = nStart + 2;

let paramHlStart = overrideStart !== null ? overrideStart : nStart;
let paramHlEnd = overrideStart !== null ? overrideEnd : col;

let paramBlock = null;
let paramDesc = "";

if (prefix === "%%") {
currentDesc = currentDesc.substring(2);
paramDesc = "Param: " + getCodeDescription(nextcode);
paramBlock = createTextBlock(nextcode);
} else if (prefix === "$$") {
currentDesc = currentDesc.substring(2);
paramDesc = "Item: " + (typeof gfxItemID === "function" ? gfxItemID(nextcode) : nextcode);
paramBlock = createImgBlock('i/' + nextcode + '.png');
} else if (prefix === "##") {
currentDesc = currentDesc.substring(2);
paramDesc = "Number: " + nextcode;
paramBlock = createNumBlock(nextcode);
}

if (paramBlock) {
punchcodeImagesContainer.appendChild(paramBlock);
bindHover(paramBlock, paramDesc, paramHlStart, paramHlEnd);
}
}
}
ifnot = false;
}
}

// Trigger parser
parseAndRender(initialCode);
}

}

function setCustomPunchcodeBg() {
const code = document.getElementById('bgInput').value.trim();
if (code.length === 2) {
punchcodeBg = code;
updateDecompiler();
}
}

function createSpacer(text) {
const wrap = document.createElement('div');
wrap.className = 'punchcode-space';
const div = document.createElement('div');
div.style.backgroundColor = 'transparent';
div.textContent = text;
wrap.appendChild(div);
return wrap;
}

function createTextBlock(text) {
const div = document.createElement('div');
div.className = 'punchcode-text';
div.textContent = text;
div.style.backgroundImage = `url('t/${punchcodeBg}.png')`;
div.style.color = punchcodeTextColor;
return div;
}

function createNumBlock(num) {
const wrap = document.createElement('div');
wrap.className = 'punchcode-num';
wrap.style.backgroundImage = `url('t/${punchcodeBg}.png')`;

if (!/^[A-Z]/.test(String(num))) {
const div = document.createElement('div');
div.className = 'punchcode-text';
div.style.backgroundColor = 'transparent';
div.style.backgroundImage = 'none';
div.style.color = punchcodeTextColor;
div.textContent = num;
wrap.appendChild(div);
return wrap;
} else {
const img = document.createElement('img');
img.src = "i/" + num + ".png";
img.style.width = "32px";
img.style.height = "32px";
img.style.display = "block";
wrap.appendChild(img);
return wrap;
}
}

function createImgBlock(src) {
const wrap = document.createElement('div');
wrap.className = 'punchcode-img';
wrap.style.backgroundImage = `url('t/${punchcodeBg}.png')`;
const img = document.createElement('img');
img.src = src;
wrap.appendChild(img);
return wrap;
}

function DarkMode() {
punchcodeTextColor = "#000000";
updateDecompiler();
}

function LightMode() {
punchcodeTextColor = "#FFFFFF";
updateDecompiler();
}

window.onload = loadDefaultMap;

</script></body></html>
