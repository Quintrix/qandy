<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PUNCH CODE COMPILER</title>
    <style>
        body { background: #222; color: #eee; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #toolbar { background: #333; padding: 10px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #444; }
        #main { display: flex; flex: 1; overflow: hidden; }
        #viewport { padding: 20px; background: #111; display: flex; flex-direction: column; align-items: center; border-right: 1px solid #444; flex-shrink: 0; position: relative; }
        
        canvas { background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.5); cursor: crosshair; border: 2px solid #444; }

        #panel { flex: 1; background: #222; display: flex; flex-direction: column; padding: 15px; overflow-y: auto; }
        .stack-header { font-weight: bold; color: #0af; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        
        .tool-box { background: #2c3e50; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #34495e; }
        .tool-box label { font-size: 0.7em; color: #95a5a6; display: block; margin-bottom: 5px; text-transform: uppercase; }
        
        input[type="text"] { background: #111; color: #fff; border: 1px solid #555; padding: 4px; text-align: center; font-family: monospace; }
        
        #tileBrushRow { display: flex; align-items: center; gap: 10px; }
        #brushPreview { width: 32px; height: 32px; border: 1px solid #0af; background: #000; }

        .object-entry { background: #333; padding: 8px; margin-bottom: 5px; border-radius: 4px; cursor: pointer; border: 1px solid #444; font-family: monospace; font-size: 0.85em; }
        .object-entry:hover { border-color: #0af; }
        .object-entry b { color: #f1c40f; }

        textarea { width: 100%; height: 60px; background: #111; color: #2ecc71; border: 1px solid #555; padding: 10px; font-family: monospace; font-size: 1em; resize: none; box-sizing: border-box; }
        
        button { padding: 6px 12px; cursor: pointer; background: #068; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 0.75em; }
        button:hover { background: #07a; }
        button.reject { background: #7f8c8d; }
        button.remove { background: #c0392b; }
        
        #decompiler { background: #000; padding: 8px; font-family: monospace; color: #aaa; font-size: 0.8em; margin-top: 5px; border: 1px solid #333; min-height: 20px; }
        
        .exit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 10px; }
        .exit-btn { background: #34495e; text-align: center; padding: 10px; border-radius: 4px; cursor: pointer; border: 1px solid #444; }
        .exit-btn.active { border-color: #f1c40f; color: #f1c40f; background: #1a252f; }

        .exit-layout-wrapper { display: flex; flex-direction: column; gap: 10px; }
        .exit-cross {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            width: 180px;
            margin: 0 auto;
        }
        .cross-slot { 
            background: #1a252f; border: 1px solid #333; height: 45px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 0.8em; border-radius: 4px; cursor: pointer; color: #555;
        }
        .cross-slot.active { border-color: #f1c40f; color: #f1c40f; background: #2c3e50; }
        .cross-slot.special { border-color: #0af; color: #0af; }
        .cross-slot.disabled { opacity: 0.3; cursor: default; border: none; }
        
        #manualExitRow { display: flex; gap: 5px; margin-top: 5px; }
        #manualExitRow input { flex: 1; text-transform: uppercase; }

        #punchcodeImages img {
            width: 32px; /* Fixed width for icon display */
            height: 32px; /* Fixed height for icon display */
            image-rendering: pixelated; /* For crisp retro look */
            border: 1px solid #444;
            margin-right: 2px; /* Space between images */
            flex-shrink: 0; /* Prevent images from shrinking */
            background-color: #000;
        }
        
        /* Tooltip styles */
        #tooltip { position: absolute; background: rgba(240, 230, 140, 0.8); color: #000; padding: 2px 6px; font-size: 10px; pointer-events: none; border: 1px solid #444; display: none; z-index: 100; font-family: monospace; }
    </style>
    <script src="gfx-itemid.js"></script>
</head>
<body>

<div id="main">
    <div id="viewport">
        <canvas id="sectorCanvas" width="256" height="384"></canvas>
        <div id="tooltip">Z:00</div>

        <div class="tool-box" id="brushBox">
            <label>Tile Brush</label>
            <div id="tileBrushRow">
                <input type="text" id="tileInput" size=2 maxlength="2" value="Ga" oninput="updateBrushPreview()">
                <div id="brushPreview"></div>
            </div>
        </div>
    </div>


    <div id="panel">

        <div class="tool-box" id="toolbar">
          <div style="font-weight: bold; color: #0af;"> &nbsp; PUNCH CODE COMPILER:</div>
          <button onclick="importGfx()">IMPORT</button>
          <button onclick="exportGfx()">EXPORT</button>
          <select id="sectorNav" onchange="changeSector()"></select>
        </div>
        
        <div id="stackView">
          <div class="tool-box" style="background: #1a252f;">
            <div style="font-weight: bold; color: #0af;">OBJECT STACK: <span id="sectorLabel">A1</span>
              <input type="text" id="newID" size=2 maxlength="2" placeholder="ID">
              <input type="text" id="newZ" size=2 maxlength="2" placeholder="Z">
              <input type="text" id="newDATA" size=2 maxlength="2" value="00">
              <button onclick="addObject()">+ ADD</button>
              <button onclick="editObject()">EDIT</button> <!-- NEW BUTTON -->
              <div id="listItems"></div>
            </div>
          </div>
        </div>
        
        <div class="tool-box" id="logicBox">
            <div class="stack-header"><span id="logicLabel">LOGIC</span>: <span id="editingObjID"></span></div>
            <textarea id="punchcodeInput" spellcheck="false" oninput="updateDecompiler()"></textarea>
            <div id="decompiler"></div>
            <div id="punchcodeImages" class="tool-box" style="display: flex; flex-wrap: nowrap; overflow-x: auto; margin-top: 10px; padding: 5px; height: 42px;">
                <!-- Images will be inserted here by JS -->
            </div>
            <div class="btn-row" style="display:flex; gap:5px; margin-top:10px;">
                <button class="reject" onclick="rejectLogic()">CLEAR</button>
                <button class="remove" onclick="removeObject()">DELETE</button>
            </div>
        </div>

        
        <div class="tool-box" id="exitsBox">
            <label>Sector Exits (N/S/E/W & Special)</label>
            <div class="exit-layout-wrapper">
                <!--<div class="exit-cross" id="exitCross">
                    <!-- Generated by JS -->
                </div>
                <div id="manualExitRow">
                    <input type="text" id="manualExitInput" maxlength="2" placeholder="ADD CODE (e.g. Z1)">
                    <button onclick="addManualExit()">+</button>
                </div>
                
            </div>
        </div>
        
        
    </div>
</div>

<script>
    // --- STATE ---
    let currentSector = "A1";
    let mapSectors = {};
    let editingIndex = -1;
    // Bounds restricted to A1-H8 (8x8 world)
    const ROWS = ["A","B","C","D","E","F","G","H"]; 
    const COLS = 8;
    const tileCache = {}, itemCache = {};
    const canvas = document.getElementById('sectorCanvas');
    const ctx = canvas.getContext('2d');
    const tooltip = document.getElementById('tooltip');

    const punchcodeItemImageCache = {};

    const nav = document.getElementById('sectorNav');
    for(let r=0; r<ROWS.length; r++) {
        for(let c=1; c<=COLS; c++) {
            let opt = document.createElement('option');
            opt.value = opt.textContent = ROWS[r] + (c);
            nav.appendChild(opt);
        }
    }

    function initBlank() {
        ROWS.forEach(r => {
            for(let c=1; c<=COLS; c++) {
                // Initialize 12 rows worth of tiles (96 total) per sector logic
                mapSectors[r+c] = { tiles: "Ga".repeat(96), exits: "", objects: [] };
            }
        });
        updateBrushPreview();
        render();
    }

    // --- NAVIGATION ---
    window.addEventListener('keydown', (e) => {
        if (e.key === "Escape" && document.activeElement) {
            document.activeElement.blur();
            return;
        }
        
        if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
        
        let rowIdx = ROWS.indexOf(currentSector[0]);
        let colIdx = parseInt(currentSector.slice(1));
        let changed = false;

        if (e.key === "ArrowUp" && rowIdx > 0) { rowIdx--; changed = true; }
        if (e.key === "ArrowDown" && rowIdx < ROWS.length - 1) { rowIdx++; changed = true; }
        if (e.key === "ArrowLeft" && colIdx > 1) { colIdx--; changed = true; }
        if (e.key === "ArrowRight" && colIdx < COLS) { colIdx++; changed = true; }

        if (changed) {
            currentSector = ROWS[rowIdx] + colIdx;
            nav.value = currentSector;
            changeSector();
        }
    });

    // --- MOUSE INTERACTION ---
    canvas.addEventListener('contextmenu', e => e.preventDefault()); // Disable context menu for sampling

    canvas.addEventListener('mousedown', (e) => {
        if (document.activeElement) { document.activeElement.blur(); }

        const rect = canvas.getBoundingClientRect();
        const x = Math.floor((e.clientX - rect.left) / 32);
        const y = Math.floor((e.clientY - rect.top) / 32);
        const tileIndex = y * 8 + x;
        
        if (tileIndex < 0 || tileIndex >= 96) return;

        const sec = mapSectors[currentSector];

        if (e.button === 0) { // Left Click: Paint
            const brush = document.getElementById('tileInput').value || "Ga";
            const before = sec.tiles.substring(0, tileIndex * 2);
            const after = sec.tiles.substring(tileIndex * 2 + 2);
            sec.tiles = before + brush + after;
        } 
        else if (e.button === 2) { // Right Click: Sample
            const sampled = sec.tiles.substring(tileIndex * 2, tileIndex * 2 + 2);
            document.getElementById('tileInput').value = sampled;
            updateBrushPreview();
        }
        render();
    });

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor((e.clientX - rect.left) / 32);
        const y = Math.floor((e.clientY - rect.top) / 32);
        const tileIndex = y * 8 + x;

        if (tileIndex >= 0 && tileIndex < 96) {
            tooltip.style.display = 'block';
            tooltip.style.left = (e.clientX - rect.left + 25) + 'px';
            tooltip.style.top = (e.clientY - rect.top - 15) + 'px';
            tooltip.innerText = `${tileIndex.toString().padStart(2, '0')}`;
        } else {
            tooltip.style.display = 'none';
        }
    });

    canvas.addEventListener('mouseleave', () => tooltip.style.display = 'none');

    // --- CORE LOGIC ---

    function updateBrushPreview() {
        const code = document.getElementById('tileInput').value;
        const preview = document.getElementById('brushPreview');
        preview.style.background = `#000 url('t/${code}.png') no-repeat center`;
        preview.style.backgroundSize = "cover";
    }

    function getImg(src, cache) {
        if (cache[src] && cache[src].complete) return cache[src]; // Return if image is already loaded and complete

        const img = new Image();
        img.src = src;
        img.onload = () => {
            // Store the image itself along with its dimensions in the cache
            cache[src] = img; 
            render(); // Rerender once the image is loaded
        };
        // Also store the image object itself for immediate use if not yet loaded (though it won't draw until onload)
        cache[src] = img; 
        return img;
    }

    function render() {
        const sec = mapSectors[currentSector];
        if(!sec) return;
        ctx.clearRect(0,0,256,384);
        
        for(let i=0; i<96; i++) {
            let code = sec.tiles.substring(i*2, i*2+2);
            let img = getImg(`t/${code}.png`, tileCache);
            if(img.complete) ctx.drawImage(img, (i%8)*32, Math.floor(i/8)*32, 32, 32);
        }

        sec.objects.forEach(obj => {
            let img = getImg(`i/${obj.id}.png`, itemCache);
            let z = parseInt(obj.z); // Z is the tile index
            let targetX = (z % 8) * 32;
            let targetY = Math.floor(z / 8) * 32;

            if(img.complete) {
                if (obj.id.startsWith('Y')) { // For 'building' items (Ya-Yz)
                    // Calculate drawing position so the lower-right corner aligns with targetX, targetY + 32
                    let drawX = targetX + 32 - img.width;
                    let drawY = targetY + 32 - img.height;
                    ctx.drawImage(img, drawX, drawY, img.width, img.height);
                } else {
                    // All other items are 32x32 and align to the top-left of the tile
                    ctx.drawImage(img, targetX, targetY, 32, 32);
                }
            }
        });
        updateObjectList();
    }

    function addManualExit() {
      const input = document.getElementById('manualExitInput');
      const code = input.value.trim().toUpperCase();
      if (code.length === 2) {
        let sec = mapSectors[currentSector];
        if (!sec.exits.includes(code)) {
            sec.exits += code;
            render();
        }
        input.value = "";
      }
    }

    function toggleExit(code) {
        let exits = mapSectors[currentSector].exits;
        if (exits.includes(code)) exits = exits.replace(code, "");
        else exits += code;
        mapSectors[currentSector].exits = exits;
        render();
    }

    function editObject() {
        if (editingIndex === -1) {
            alert("Please select an object from the list below to edit first.");
            return;
        }
        const idStr = document.getElementById('newID').value.trim();
        const zStr = document.getElementById('newZ').value.trim();
        const dataStr = document.getElementById('newDATA').value.trim();
        // Basic validation
        if (idStr.length !== 2 || zStr.length !== 2) {
            alert("ID and Z must be exactly 2 characters (e.g., ID: 'Bd', Z: '05')");
            return;
        }
        // Update the object in memory
        const obj = mapSectors[currentSector].objects[editingIndex];
        obj.id = idStr;
        obj.z = zStr;
        obj.data = (dataStr.length === 2) ? dataStr : "";
        // Update the label in the logic editor to reflect the new ID/Z
        document.getElementById('editingObjID').innerText = obj.id + "@" + obj.z;
        // Update logic label dynamically in case they added/removed DATA
        const labelEl = document.getElementById('logicLabel');
        if (obj.data && obj.data.length === 2) {
            labelEl.innerText = "PUNCH CODE";
        } else {
            labelEl.innerText = "ITEM INVENTORY";
        }
        // Re-render the canvas and the stack list
        render();
    }
    
    function updateObjectList() {
      const list = document.getElementById('listItems');
      list.innerHTML = "";
      mapSectors[currentSector].objects.forEach((obj, idx) => {
        const div = document.createElement('div');
        div.className = 'object-entry';
        
        // Display data segment if present, otherwise mark as dynamic
        const typeLabel = obj.data ? `d:${obj.data}` : `dynamic`;
        
        div.innerHTML = `[<b>${obj.id}</b> z:${obj.z} <span style="color: #888;">(${typeLabel})</span>] ${gfxItemID(obj.id)}`;
        div.onclick = () => openEditor(idx);
        list.appendChild(div);
      });
    }
    
    function addObject() {
      const idStr = document.getElementById('newID').value.trim();
      const zStr = document.getElementById('newZ').value.trim();
      const dataStr = document.getElementById('newDATA').value.trim();

      // Basic validation
      if (idStr.length !== 2 || zStr.length !== 2) {
        alert("ID and Z must be exactly 2 characters (e.g., ID: 'Bd', Z: '05')");
        return;
      }

      // If DATA is empty, it's treated as a dynamic item. 
      // If DATA has 2 characters, it's a static object.
      const newObject = {
        id: idStr,
        z: zStr,
        data: (dataStr.length === 2) ? dataStr : "", 
        logic: ""
      };

      // Add to the current sector's array
      mapSectors[currentSector].objects.push(newObject);

      // Clear inputs for the next entry (leave DATA as is for convenience, or clear it)
      document.getElementById('newID').value = "";
      document.getElementById('newZ').value = "";
    
      // Re-render the canvas and the stack list
      render();
    }

    function rejectLogic() {
        closeEditor();
    }

    function removeObject() {
        if (editingIndex !== -1) {
            mapSectors[currentSector].objects.splice(editingIndex, 1);
        }
        closeEditor();
    }

    function updateDecompiler() {
        const code = document.getElementById('punchcodeInput').value;
        const display = document.getElementById('decompiler');
        if (!display) return;
        display.innerText = code || "(no instructions)";
    }

    function openEditor(idx) {
      // AUTO-SAVE: If we are already editing an object, save its logic before switching
      if (editingIndex !== -1) {
        mapSectors[currentSector].objects[editingIndex].logic = document.getElementById('punchcodeInput').value;
      }

      editingIndex = idx;
      const obj = mapSectors[currentSector].objects[idx];

      document.getElementById('newID').value = obj.id;
      document.getElementById('newZ').value = obj.z;
      document.getElementById('newDATA').value = obj.data || "";

      const labelEl = document.getElementById('logicLabel');
      if (obj.data && obj.data.length === 2) {
          labelEl.innerText = "PUNCH CODE";    // Has DATA (Static Object)
      } else {
          labelEl.innerText = "ITEM INVENTORY"; // No DATA (Dynamic Item / Player)
      }

      document.getElementById('editingObjID').innerText = obj.id + "@" + obj.z;
      document.getElementById('punchcodeInput').value = obj.logic;

      document.getElementById('logicBox').style.display = "block"; 

      updateDecompiler();
      updateObjectList(); 
    }

    function closeEditor() {
      editingIndex = -1;
      document.getElementById('brushBox').style.display = 'block';
      document.getElementById('exitsBox').style.display = 'block';
      document.getElementById('stackView').style.display = 'block';
      document.getElementById('newID').value = "";
      document.getElementById('newZ').value = "";
      document.getElementById('newDATA').value = "00";
      // Clear out the logic editor text so it looks "closed"
      document.getElementById('editingObjID').innerText = "";
      document.getElementById('punchcodeInput').value = "";
      updateDecompiler();
      render();
    }
    
    function changeSector() {
        currentSector = nav.value;
        document.getElementById('sectorLabel').innerText = currentSector;
        closeEditor();
        render();
    }

    async function importGfx() {
      try {
        const text = await navigator.clipboard.readText();
        if(!text) return;
        parseGfxData(text);
      } catch (e) { console.error("Import failed", e); }
    }
 
    function exportGfx() {
      let out = "";
      for(const label in mapSectors) {
        let sec = mapSectors[label];
        let objStr = sec.objects.map(o => {
            let meta = o.id + o.z;
            if (o.data && o.data.trim().length === 2) {
                meta += o.data; // Add 2-character DATA for static objects
            }
            return o.logic ? `${meta}:${o.logic}` : meta;
        }).join(',');
        out += `${label}=${sec.tiles}${sec.exits}.${objStr}\n`;
      }
      navigator.clipboard.writeText(out.trim());
      alert("GFX EXPORTED!");
    }

    async function loadDefaultMap() {
        // First, initialize a blank map just in case the .gfx file is missing some sectors
        initBlank(); 

        try {
            const response = await fetch('capflag.gfx');
            if (!response.ok) throw new Error('File not found');
        
            const text = await response.text();
            parseGfxData(text);
        
            // Ensure UI updates to whatever 'currentSector' is selected
            changeSector(); 
        
            console.log("Successfully loaded capflag.gfx");
        } catch (error) {
            console.warn("Could not load capflag.gfx automatically. Remaining blank.", error);
        }
    }


    function parseGfxData(text) {
        text.split('\n').forEach(line => {
            if(!line.includes('=')) return; 
            let [label, content] = line.split('=');
            if(!content) return;
            let [map, items] = content.split('.');
            let objs = [];
            if(items) items.split(',').forEach(c => {
                if(!c) return;
                let [m, l] = c.split(':');
                if (m) {
                    if (m.length >= 6) {
                        // Static Object (ID + Z + DATA)
                        objs.push({ id: m.substring(0,2), z: m.substring(2,4), data: m.substring(4,6), logic: l || "" });
                    } else if (m.length >= 4) {
                        // Dynamic Item (ID + Z)
                        objs.push({ id: m.substring(0,2), z: m.substring(2,4), data: "", logic: l || "" });
                    }
                }
            });
            mapSectors[label] = { tiles: map.substring(0,192), exits: map.substring(192), objects: objs };
        });
        render();
    }

    // Helper to identify W registers and numerical values
    function isWRegister(code) {
        return code.length === 2 && code.charAt(0) === 'W' && (
            (code.charAt(1) >= 'a' && code.charAt(1) <= 'z') ||
            (code.charAt(1) >= '0' && code.charAt(1) <= '9')
        );
    }

    function isNumerical(code) {
        return code.length === 2 && !isNaN(parseInt(code));
    }

    // Function to provide text descriptions for specific item/sector codes
    function getCodeDescription(code) {
        // This can be extended to provide more descriptive names for specific item/sector codes
        // For now, we'll use gfxItemID for known object IDs.
        if (code === "Za") return "nothing (null)";
        if (code === "Z1") return "exit Z1"; // Example for special exits
        if (code.match(/^[A-H][1-8]$/)) return `sector ${code}`; // E.g., A1, H8
        
        const itemText = gfxItemID(code);
        if (itemText !== "Item " + code) return itemText; // If gfxItemID provided a specific name

        return `code "${code}"`; // Default for unknown codes
    }

function decompilepunchcode(code) {
    let outputText = "";
    let visualTokens = []; // NEW: Array to store what we should draw
    let column = 0;

    while (column < code.length) {
        let item = code.substring(column, column + 2);
        column += 2;

        // Special case for newline instruction
        if (item === "Xc") {
            outputText += "\n";
            visualTokens.push({ type: 'image', val: 'Xc' }); // <--- Fixed! Now it draws the image
            continue;
        }
        
        let desc = typeof gfxItemID === "function" ? gfxItemID(item) : "Unknown";
        if (desc === "Unknown") desc = item;

        // Extract all flags from the beginning of the description
        let flags = [];
        while (desc.startsWith("%%") || desc.startsWith("$$") || desc.startsWith("##")) {
            flags.push(desc.substring(0, 2));
            desc = desc.substring(2);
        }

        // Add the base text (e.g. "teleport to")
        let baseText = desc.trim();
        if (baseText) {
            if (outputText.length > 0 && !outputText.endsWith("\n")) outputText += " ";
            outputText += baseText;
        }

        // The base instruction is ALWAYS an image
        visualTokens.push({ type: 'image', val: item });

        // Process the flags for arguments
        for (let i = 0; i < flags.length; i++) {
            let flag = flags[i];
            let nextCode = code.substring(column, column + 2);
            if (nextCode.length < 2) break; // Safety check
            column += 2;

            if (outputText.length > 0 && !outputText.endsWith("\n")) outputText += " ";

            if (flag === "%%") {
                // Map Sector (e.g., A1)
                outputText += nextCode; 
                visualTokens.push({ type: 'sector', val: nextCode });
            } 
            else if (flag === "$$") {
                // Item (e.g., [black hat])
                let nextDesc = typeof gfxItemID === "function" ? gfxItemID(nextCode) : nextCode;
                if (nextDesc === "Unknown") nextDesc = nextCode;
                outputText += "[" + nextDesc + "]";
                visualTokens.push({ type: 'image', val: nextCode });
            } 
            else if (flag === "##") {
                // Number (e.g., <05>)
                outputText += "<" + nextCode + ">"; 
                visualTokens.push({ type: 'number', val: nextCode });
            }
        }
    }
    
    return { text: outputText, tokens: visualTokens };
}

function updateDecompiler() {
    const code = document.getElementById('punchcodeInput').value;
    const display = document.getElementById('decompiler');
    const punchcodeImagesContainer = document.getElementById('punchcodeImages');
    
    // Clear previous elements
    punchcodeImagesContainer.innerHTML = "";

    if (!display || !punchcodeImagesContainer) return;
    
    if (code.trim() === "") {
        display.innerText = "(no instructions)";
        return;
    }

    // Call our unified decompiler
    const decompiled = decompilepunchcode(code);
    
    // 1. Render human-readable text block
    display.innerText = decompiled.text;
    
    // 2. Render dynamic visual images and blocks
    let tokensRendered = 0;
    const maxTokens = 35; // Render limit to prevent UI overflow on massive scripts

    for (let i = 0; i < decompiled.tokens.length; i++) {
        if (tokensRendered >= maxTokens) break;
        
        let token = decompiled.tokens[i];

        if (token.type === 'image') {

            if(token.val === "Xc") { 
            const spacer = document.createElement('div');
            spacer.style.width = "24px"; 
            spacer.style.height = "32px";
            spacer.style.background = "transparent"; // Invisible block
            spacer.style.marginRight = "2px";
            spacer.style.flexShrink = "0";
            
            punchcodeImagesContainer.appendChild(spacer);
            continue;
            }
            
            let imgPath = `i/${token.val}.png`;
            const img = document.createElement('img');
            img.onerror = () => { img.style.display = 'none'; };
            
            // Image caching logic
            if (!punchcodeItemImageCache[imgPath]) {
                const cachedImg = new Image();
                cachedImg.src = imgPath;
                cachedImg.onload = () => {
                    punchcodeItemImageCache[imgPath] = cachedImg;
                    if (img.parentNode === punchcodeImagesContainer) {
                         img.src = cachedImg.src;
                    }
                };
                punchcodeItemImageCache[imgPath] = cachedImg; 
            } else {
                img.src = punchcodeItemImageCache[imgPath].src;
            }
            
            punchcodeImagesContainer.appendChild(img);
            tokensRendered++;
        }
        else if (token.type === 'sector' || token.type === 'number') {
            // Render map sectors and numerals as stylized 32x32 retro UI blocks!
            const block = document.createElement('div');
            block.style.width = "32px";
            block.style.height = "32px";
            block.style.boxSizing = "border-box";
            block.style.display = "flex";
            block.style.alignItems = "center";
            block.style.justifyContent = "center";
            block.style.background = "#1a252f";
            block.style.border = "1px solid #444";
            block.style.marginRight = "2px";
            block.style.flexShrink = "0";
            block.style.fontFamily = "monospace";
            block.style.fontSize = "14px";
            block.style.fontWeight = "bold";
            
            // Colors: Map Sectors are yellow, Numbers are green
            block.style.color = token.type === 'sector' ? "#f1c40f" : "#2ecc71";
            block.innerText = token.val;
            
            punchcodeImagesContainer.appendChild(block);
            tokensRendered++;
        }
    }
}

    window.onload = loadDefaultMap;

</script></body></html>
