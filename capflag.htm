<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CapFlag Web Map Generator</title>
    <style>
        :root { --bg: #1a1a1a; --text: #e0e0e0; --accent: #4a90e2; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .controls { margin-bottom: 20px; background: #333; padding: 15px; border-radius: 8px; display: flex; gap: 15px; align-items: center; }
        
        #worldGrid { display: grid;
                     grid-template-columns: repeat(8, 70px);
                     gap: 0px;
                     background: #444;
                     border: 0px; }

        .sector { width: 70px;
                  height: 70px;
                  background: #222;
                  cursor: pointer;
                  display: flex;
                  flex-direction: column;
                  align-items: center;
                  justify-content: center;
                  font-size: 10px;
                  border: 1px solid #333;
                  position: relative; }

        .sector img { width: 40px;
                      height: 40px;
                      image-rendering: pixelated; }
        
        .sector:hover { border-color: var(--accent); }

        /* Modal */
        #detailOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10; align-items: center; justify-content: center; }
        #detailContent { background: #222; padding: 20px; border-radius: 10px; border: 2px solid var(--accent); max-width: 90vw; }
        .mini-grid { display: grid; grid-template-columns: repeat(8, 32px); gap: 1px; background: #555; border: 1px solid #555; }
        .mini-tile { width: 32px; height: 32px; cursor: pointer; overflow: hidden; background: #111; }
        .mini-tile img { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
        .mini-tile:hover { outline: 1px solid white; z-index: 2; }
        
        button { padding: 10px 20px; cursor: pointer; background: var(--accent); border: none; color: white; font-weight: bold; border-radius: 4px; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <h2>Map Sector Generator</h2>

    <div class="controls">
        <label>Brush:</label>
        <select id="brushSelect">
            <option value="Ga">Grass (Ga)</option>
            <option value="Ca">Dirt (Ca)</option>
            <option value="Ha">Farm (Ha)</option>
            <option value="Sb">Rock (Sb)</option>
            <option value="Ta">Swamp (Ta)</option>
            <option value="Ka">Railroad (Ka)</option>
            <option value="Cp">Stump (Cp)</option>
        </select>
        <button onclick="generateAll()">Generate All</button>
        <button onclick="exportFlat()" style="background:#27ae60">Flat World</button>
        <button onclick="exportRound()" style="background:#27ae60">Round World</button>
    </div>

    <div id="worldGrid"></div>

    <div id="detailOverlay" onclick="this.style.display='none'">
        <div id="detailContent" onclick="event.stopPropagation()">
            <h3 id="detailTitle">Sector Detail</h3>
            <div id="miniGrid" class="mini-grid"></div>
            <br>
            <p style="font-size: 12px; color: #aaa;">Click tiles to paint with current brush.</p>
            <button onclick="document.getElementById('detailOverlay').style.display='none'">Close</button>
        </div>
    </div>

<script>
    const ROWS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L'];
    const COLS = 8;
    const worldData = {}; 

    const gridEl = document.getElementById('worldGrid');
    const brushEl = document.getElementById('brushSelect');

    function init() {
        ROWS.forEach(r => {
            for (let c = 1; c <= COLS; c++) {
                const code = r + c;
                worldData[code] = new Array(96).fill('Ga');
                
                const cell = document.createElement('div');
                cell.className = 'sector';
                cell.id = `sec-${code}`;
                cell.innerHTML = `<span>${code}</span><img src="t/Ga.png" onerror="this.src='https://via.placeholder.com/40/2ecc71/ffffff?text=Ga'" id="img-${code}">`;
                cell.onclick = () => paintSector(code);
                //cell.oncontextmenu = (e) => { e.preventDefault(); showDetail(code); };
                gridEl.appendChild(cell);
            }
        });
    }

    function paintSector(code) {
        const brush = brushEl.value;
        worldData[code].fill(brush);
        document.getElementById(`img-${code}`).src = `t/${brush}.png`;
    }

    function runProcGen(type) {
        let tiles = new Array(96).fill(type);
        if (type === 'Ga') { 
            const flora = ['Fa','Fb','Fc','Fd','Fe','Ff','Fg','Fh','Fk','Fl','Gb','Gc','Gd','Ge','Gf','Gg'];
            tiles = tiles.map(t => Math.random() > 0.85 ? flora[Math.floor(Math.random()*flora.length)] : 'Ga');
        } 
        else if (type === 'Ca') {
            tiles = tiles.map(t => Math.random() > 0.95 ? 'Cp' : 'Ca');
            let startRow = Math.floor(Math.random() * 12) * 8;
            for(let i=0; i<8; i++) tiles[startRow + i] = 'Ka'; 
        }
        else if (type === 'Ha') {
            for(let i=0; i<4; i++) { 
                for(let j=0; j<4; j++) tiles[(i+2)*8 + (j+2)] = 'Ha';
            }
        }
        else if (type === 'Sb') {
            tiles = tiles.map(t => Math.random() > 0.9 ? 'Sb' : 'Sb');
            let idx = 40;
            tiles[idx] = 'Sc'; tiles[idx+1] = 'Sd'; tiles[idx+2] = 'Se';
        }
        else if (type === 'Ta') {
            tiles = tiles.map((t, i) => Math.random() > 0.8 ? 'Tf' : 'Ta');
            tiles[20] = 'Tb'; tiles[21] = 'Tc';
        }
        return tiles;
    }

    function generateAll() {
        Object.keys(worldData).forEach(code => {
            const base = worldData[code][0]; 
            worldData[code] = runProcGen(base);
        });
        alert("World features generated!");
        document.querySelectorAll('.sector').forEach(cell => {
                const code = cell.id.replace('sec-', ''); // extract code (e.g., "A1" from "sec-A1")
                cell.onclick = (e) => {
                    e.preventDefault();
                    showDetail(code);
                };
            });
        }

    // UPDATED: right-click detail now shows images and allows editing
    function showDetail(code) {
      var brush="Ga";
      document.addEventListener('keydown', function(event) {
          // Only react if a single character (ignores arrows, etc)
          if (event.key.length === 1 && /[a-zA-Z]/.test(event.key)) {
              // Assuming 'brush' is a global string variable.
              // Ensure brush has at least 2 characters.
              if (typeof brush === "string" && brush.length >= 2) {
                  if (event.key === event.key.toUpperCase() && event.key >= 'A' && event.key <= 'Z') {
                      // Uppercase, set first character
                      brush = event.key + brush.slice(1);
                  } else if (event.key === event.key.toLowerCase() && event.key >= 'a' && event.key <= 'z') {
                      // Lowercase, set second character
                      brush = brush.charAt(0) + event.key + brush.slice(2);
                  }
              }
              // If brush is an array, use:
              /*
              if (Array.isArray(brush) && brush.length >= 2) {
                  if (event.key === event.key.toUpperCase() && event.key >= 'A' && event.key <= 'Z') {
                      brush[0] = event.key;
                  } else if (event.key === event.key.toLowerCase() && event.key >= 'a' && event.key <= 'z') {
                      brush[1] = event.key;
                  }
              }
              */
          }
      });
    
    
        const overlay = document.getElementById('detailOverlay');
        const miniGrid = document.getElementById('miniGrid');
        document.getElementById('detailTitle').innerText = `Sector ${code} Detail (8x12)`;
        miniGrid.innerHTML = '';
        
        worldData[code].forEach((tileID, index) => {
            const container = document.createElement('div');
            container.className = 'mini-tile';
            
            const img = document.createElement('img');
            // Set source from t/ directory
            img.src = `t/${tileID}.png`;
            img.title = tileID;
            
            // Fallback for missing images
            // img.onerror = () => {
            //    const color = getTileColor(tileID).replace('#','');
            //    img.src = `https://via.placeholder.com/32/${color}/ffffff?text=${tileID}`;
            // };

            // FINE-TUNE CLICK HANDLER
            container.onclick = () => {
                const newBrush = brush;
                worldData[code][index] = newBrush; // Update the data
                img.src = `t/${newBrush}.png`;      // Update the visual immediately
                img.title = newBrush;
            };

            // set brush to this tile
            img.oncontextmenu = (e) => {
                e.preventDefault(); // Prevent the browser's context menu
                brush = img.title;  // Or extract from img.src if you prefer
                // Optionally, update brush UI if you have brushEl:
                // brushEl.value = brush;
            };
            container.appendChild(img);
            miniGrid.appendChild(container);
        });
        overlay.style.display = 'flex';
    }

    function getTileColor(id) {
        const colors = { Ga: '#2ecc71', Ca: '#8b4513', Ha: '#f1c40f', Sb: '#7f8c8d', Ta: '#16a085', Ka: '#34495e', Cp: '#a0522d' };
        return colors[id.substring(0,2)] || '#333';
    }

    function exportData() {
        let output = "";
        Object.keys(worldData).forEach(code => {
            output += `${code}=${worldData[code].join('')}\n`;
        });
        navigator.clipboard.writeText(output).then(() => alert("Exported to clipboard!"));
    }

    init();
</script>





</body>
</html>
